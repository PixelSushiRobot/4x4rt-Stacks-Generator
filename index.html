<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4x4rt Stacks Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --page-pad-x: 40px;
      --page-pad-y: 40px;
      --canvas-size: 80vmin;
      --rule-width: 1px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1b1b1b;
      font-family: 'Space Mono', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--page-pad-y) var(--page-pad-x);
      min-height: 100vh;
    }

    .app {
      display: flex;
      gap: calc(var(--canvas-size) * 0.015);
      align-items: flex-start;
      width: fit-content;
      max-width: 100%;
      justify-content: center;
    }

    .canvas-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--canvas-size) * 0.02);
      width: var(--canvas-size);
    }

    .params-panel {
      width: calc(var(--canvas-size) * 0.3);
      max-height: var(--canvas-size);
      overflow: auto;
      padding: calc(var(--canvas-size) * 0.015);
      background: var(--ui-bg);
      color: var(--ui-ink);
    }

    .params-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: calc(var(--canvas-size) * 0.024);
      line-height: 1;
      text-transform: uppercase;
      color: var(--ui-ink);
      margin-bottom: calc(var(--canvas-size) * 0.015);
    }

    .shuffle-btn {
      background: none;
      border: none;
      color: var(--ui-ink);
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shuffle-btn svg {
      width: calc(var(--canvas-size) * 0.032);
      height: calc(var(--canvas-size) * 0.032);
    }

    .params-copy {
      font-size: calc(var(--canvas-size) * 0.018);
      line-height: 1.5;
      color: var(--ui-ink-muted);
      margin-bottom: calc(var(--canvas-size) * 0.015);
    }

    .params-section {
      margin-bottom: calc(var(--canvas-size) * 0.02);
    }

    .params-section-header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: calc(var(--canvas-size) * 0.015);
      margin-bottom: calc(var(--canvas-size) * 0.015);
    }

    .params-section-title {
      font-size: calc(var(--canvas-size) * 0.02);
      text-transform: uppercase;
      color: var(--ui-ink);
      margin-bottom: calc(var(--canvas-size) * 0.01);
    }

    .params-section-header .params-section-title {
      margin-bottom: 0;
    }

    .params-subsection-title {
      font-size: calc(var(--canvas-size) * 0.016);
      text-transform: uppercase;
      color: var(--ui-ink-muted);
      margin-top: calc(var(--canvas-size) * 0.015);
      margin-bottom: calc(var(--canvas-size) * 0.005);
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .params-subsection-title:first-child {
      margin-top: 0;
    }

    /* Range vs Multi Toggle Button */
    .mode-toggle {
      cursor: pointer;
      width: calc(var(--canvas-size) * 0.045);
      display: flex;
      align-items: center;
    }

    .mode-toggle input {
      display: none;
    }

    .mode-toggle svg {
      width: 100%;
      height: auto;
      color: var(--ui-ink);
    }

    .mode-toggle .icon-range {
      display: none;
    }

    .mode-toggle input:checked~.icon-range {
      display: block;
    }

    .mode-toggle input:checked~.icon-multi {
      display: none;
    }

    .height-filter-list {
      display: flex;
      flex-wrap: wrap;
      gap: calc(var(--canvas-size) * 0.01) 0;
    }

    .height-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(var(--canvas-size) * 0.03);
      min-width: calc(var(--canvas-size) * 0.064);
      padding: 0 calc(var(--canvas-size) * 0.025) 0 calc(var(--canvas-size) * 0.015);
      color: var(--ui-ink);
      font-family: 'Space Mono', monospace;
      font-size: calc(var(--canvas-size) * 0.018);
      cursor: pointer;
    }

    .height-cell::before {
      content: '';
      position: absolute;
      inset: 0 calc(var(--canvas-size) * 0.01) 0 0;
      border: 2px solid var(--ui-ink);
      border-radius: 999px;
      z-index: 0;
    }

    .height-cell span {
      position: relative;
      z-index: 1;
    }

    .height-cell.is-selected,
    .height-cell.in-range {
      color: var(--ui-bg);
    }

    .height-cell.is-selected::before,
    .height-cell.in-range::before {
      background-color: var(--ui-ink);
      border-color: transparent;
    }

    .height-cell.in-range::before {
      inset: 0;
      border-radius: 0;
    }

    .height-cell.range-start::before {
      inset: 0;
      border-radius: 999px 0 0 999px;
    }

    .height-cell.range-end::before {
      inset: 0 calc(var(--canvas-size) * 0.01) 0 0;
      border-radius: 0 999px 999px 0;
    }

    .height-cell.range-start.range-end::before {
      inset: 0 calc(var(--canvas-size) * 0.01) 0 0;
      border-radius: 999px;
    }

    .settings-list {
      display: flex;
      flex-direction: column;
      gap: calc(var(--canvas-size) * 0.01);
    }

    .palette-filter-list {
      display: flex;
      flex-direction: column;
      gap: calc(var(--canvas-size) * 0.01);
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: calc(var(--canvas-size) * 0.012);
      font-size: calc(var(--canvas-size) * 0.018);
      text-transform: uppercase;
      cursor: pointer;
    }

    .setting-item input {
      appearance: none;
      width: calc(var(--canvas-size) * 0.022);
      height: calc(var(--canvas-size) * 0.022);
      flex: 0 0 auto;
      border: 2px solid var(--ui-ink);
      border-radius: 4px;
      background-color: transparent;
      margin: 0;
      cursor: pointer;
    }

    .setting-item input:checked {
      border-color: var(--ui-ink);
      background-color: var(--ui-ink);
      box-shadow: inset 0 0 0 2px var(--ui-bg);
    }

    .setting-item code {
      font-family: 'Space Mono', monospace;
      font-size: calc(var(--canvas-size) * 0.018);
      color: var(--ui-ink);
    }

    .params-actions {
      display: flex;
      gap: calc(var(--canvas-size) * 0.015);
      flex-wrap: wrap;
      font-size: calc(var(--canvas-size) * 0.018);
      text-transform: uppercase;
    }

    .params-link {
      font-family: 'Space Mono', monospace;
      font-size: calc(var(--canvas-size) * 0.018);
      text-transform: uppercase;
      color: var(--ui-ink);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-box-trim: trim-both;
      text-box-edge: cap alphabetic;
    }

    .params-link:hover {
      opacity: 0.7;
    }

    .svg-container {
      position: relative;
      width: var(--canvas-size);
      height: var(--canvas-size);
      background: var(--ui-bg);
    }

    .svg-out {
      display: block;
      width: 100%;
      height: 100%;
    }

    svg,
    path {
      shape-rendering: crispEdges;
    }

    .metadata-overlay {
      position: absolute;
      top: calc(var(--canvas-size) * 0.015);
      left: calc(var(--canvas-size) * 0.015);
      display: flex;
      flex-direction: column;
      gap: calc(var(--canvas-size) * 0.015);
      color: var(--ui-ink);
      z-index: 2;
      text-transform: uppercase;
      width: calc(var(--canvas-size) * 0.375);
    }

    .logo-overlay {
      position: absolute;
      right: calc(var(--canvas-size) * 0.01);
      bottom: calc(var(--canvas-size) * 0.01);
      width: calc(var(--canvas-size) * 0.09);
      height: calc(var(--canvas-size) * 0.03);
      z-index: 3;
      pointer-events: none;
    }

    .logo-overlay svg {
      display: block;
    }

    .export-overlay {
      position: absolute;
      left: calc(var(--canvas-size) * 0.015);
      bottom: calc(var(--canvas-size) * 0.015);
      display: flex;
      flex-direction: row;
      gap: calc(var(--canvas-size) * 0.015);
      z-index: 10;
    }

    .is-hidden {
      display: none !important;
    }

    .download-btn {
      font-family: 'Space Mono', monospace;
      font-weight: 400;
      font-size: calc(var(--canvas-size) * 0.029);
      text-transform: uppercase;
      color: var(--ui-ink);
      white-space: nowrap;
      text-box-trim: trim-both;
      text-box-edge: cap alphabetic;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
    }

    .arrow-symbol {
      font-family: 'Space Grotesk', sans-serif;
      display: inline-block;
      margin-left: 0.3em;
    }

    .stat {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: baseline;
      column-gap: calc(var(--canvas-size) * 0.016);
      width: 100%;
      font-size: calc(var(--canvas-size) * 0.024);
      color: var(--ui-ink-muted);
    }

    .stat+.stat {
      padding-top: calc(var(--canvas-size) * 0.015);
      border-top: var(--rule-width) solid var(--ui-rule);
    }

    .stat-value {
      color: var(--ui-ink);
      justify-self: end;
    }

    .stat-suffix {
      color: var(--ui-ink-muted);
    }

    #seed-display {
      cursor: pointer;
    }

    .shapes-list .stat {
      color: var(--ui-ink-muted);
      padding-top: calc(var(--canvas-size) * 0.015);
      padding-bottom: calc(var(--canvas-size) * 0.015);
      border-top: none;
    }

    .shapes-list .stat:first-child {
      border-top: var(--rule-width) solid var(--ui-rule);
    }

    .shapes-list .stat+.stat {
      border-top: var(--rule-width) solid var(--ui-rule);
    }

    .shapes-list .stat:last-child {
      border-bottom: var(--rule-width) solid var(--ui-rule);
    }

    .palette-dots {
      grid-column: 1 / -1;
      display: flex;
      width: 100%;
      gap: 0;
      flex-wrap: nowrap;
      margin-top: calc(var(--canvas-size) * 0.008);
      border: var(--rule-width) solid var(--ui-rule);
      border-radius: calc(var(--canvas-size) * 0.03);
      overflow: hidden;
    }

    .dot {
      flex: 1 1 0;
      height: calc(var(--canvas-size) * 0.02);
      flex-shrink: 1;
    }

    @media (max-width: 640px) {
      :root {
        --page-pad-x: 16px;
        --page-pad-y: 16px;
      }

      .app {
        flex-direction: column;
        gap: 24px;
      }

      .params-panel {
        width: 100%;
        max-height: none;
      }
    }
  </style>
</head>

<body>
  <div id="app" class="app">
    <div id="canvas-wrap" class="canvas-wrap">
      <div id="svg-container" class="svg-container">
        <svg id="svg-out" class="svg-out" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"></svg>

        <div id="metadata-overlay" class="metadata-overlay">
          <!-- Deterministic Seed Display -->
          <div class="stat">
            <span class="stat-label">Seed</span>
            <span class="stat-value" id="seed-display">—</span>
          </div>

          <div class="stat">
            <span class="stat-label">Palette</span>
            <span class="stat-value" id="palette-name">—</span>
            <div id="palette-dots" class="palette-dots"></div>
          </div>

          <div class="stat">
            <span class="stat-label">Profile</span>
            <span class="stat-value" id="profile-name">—</span>
            <div id="actual-palette-dots" class="palette-dots"></div>
          </div>

          <div class="stat">
            <span class="stat-label">Height</span>
            <span class="stat-value"><span id="stack-height">—</span><span class="stat-suffix"> units</span></span>
          </div>
          <div class="stat" id="shapes-heading">
            <span class="stat-label">Shapes</span>
            <span class="stat-value" id="shape-count">—</span>
          </div>
          <div id="shapes-list" class="shapes-list" role="list" aria-labelledby="shapes-heading"></div>
        </div>

        <div id="logo-overlay" class="logo-overlay">
          <svg viewBox="0 0 90 30" preserveAspectRatio="xMaxYMax meet" xmlns="http://www.w3.org/2000/svg">
            <g fill="var(--ui-ink-muted)">
              <rect width="24" height="6" />
              <rect y="16" width="24" height="6" />
              <rect y="24" width="12" height="6" />
              <rect x="12" y="8" width="18" height="6" />

              <rect x="30" y="8" width="24" height="6" />
              <rect x="30" y="24" width="24" height="6" />
              <rect x="36" width="24" height="6" />
              <rect x="36" y="16" width="24" height="6" />

              <rect x="60" width="24" height="6" />
              <rect x="60" y="16" width="24" height="6" />
              <rect x="60" y="24" width="12" height="6" />
              <rect x="72" y="8" width="18" height="6" />
              <rect x="78" y="24" width="12" height="6" />
            </g>
          </svg>
        </div>

        <div id="export-overlay" class="export-overlay">
          <button class="download-btn" id="download-png-btn">PNG<span class="arrow-symbol">↓</span></button>
          <button class="download-btn" id="download-svg-btn">SVG<span class="arrow-symbol">↓</span></button>
        </div>
      </div>
    </div>
    <aside id="params-panel" class="params-panel">
      <div class="params-title">
        <span>Parameters</span>
        <button class="shuffle-btn" id="panel-shuffle-btn" title="Regenerate">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2"
            stroke-miterlimit="10" stroke-linecap="square">
            <path d="M15.625 11.875L17.5 13.75L15.625 15.625" />
            <path d="M15.625 4.375L17.5 6.25L15.625 8.125" />
            <path d="M2.5 13.75H7.5L9.84375 10.1562" />
            <path d="M2.5 6.25H7.5L12.5 13.75H16.25" />
            <path d="M16.25 6.25H12.5L11.25 8.125" />
          </svg>
        </button>
      </div>

      <div class="params-section">
        <div class="params-section-title">Render Mode</div>
        <div class="settings-list">
          <label class="setting-item">
            <input type="checkbox" id="toggle-outline" checked>
            <code>Outline</code>
          </label>
          <label class="setting-item">
            <input type="checkbox" id="toggle-metadata" checked>
            <code>Metadata</code>
          </label>
          <label class="setting-item">
            <input type="checkbox" id="toggle-export" checked>
            <code>Export</code>
          </label>
        </div>
      </div>

      <div class="params-section">
        <div class="params-section-title">Color Profile</div>
        <div id="profile-filter-list" class="settings-list">
          <label class="setting-item">
            <input type="checkbox" value="isolate">
            <code>Isolate</code>
          </label>
          <label class="setting-item">
            <input type="checkbox" value="drift">
            <code>Drift</code>
          </label>
          <label class="setting-item">
            <input type="checkbox" value="spectrum">
            <code>Spectrum</code>
          </label>
        </div>
      </div>

      <div class="params-section">
        <div class="params-section-header">
          <div class="params-section-title">Height</div>
          <label class="mode-toggle" title="Toggle Range Mode">
            <input type="checkbox" id="toggle-range-mode">
            <svg class="icon-multi" viewBox="0 0 36 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="6" cy="8" r="4" fill="currentColor" />
              <circle cx="18" cy="8" r="4" fill="currentColor" />
              <circle cx="30" cy="8" r="4" fill="currentColor" />
            </svg>
            <svg class="icon-range" viewBox="0 0 36 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="6" y1="8" x2="30" y2="8" stroke="currentColor" stroke-width="2"
                vector-effect="non-scaling-stroke" />
              <circle cx="6" cy="8" r="4" fill="currentColor" />
              <circle cx="30" cy="8" r="4" fill="currentColor" />
            </svg>
          </label>
        </div>
        <div id="height-filter-container" class="height-filter-list"></div>
      </div>

      <div class="params-section">
        <div class="params-section-title">Palettes</div>
        <div id="palette-filter-list" class="palette-filter-list"></div>
      </div>

      <div class="params-actions">
        <button class="params-link" id="select-none-btn" type="button">clear all</button>
      </div>
    </aside>
  </div>
  <script>
    const BORDER_WIDTH = 10;
    const CANVAS_SIZE = 1000;
    const CELL_SIZE = 100;
    const CELL_STEP = CELL_SIZE - BORDER_WIDTH;
    const COLUMN_WIDTH = 2 * CELL_STEP + BORDER_WIDTH; // width of a 2-unit column: two steps + one closing border
    const INK_COLOR = '#1c1c1a'; // Fixed dark ink specifically for the structural artwork outlines

    // A cohesive generative system: Curated, thematic, and distinct.
    const PALETTES = [
      // 1. THE CLASSICS (Anchored to Warm Cotton, Newsprint, and Kraft papers)
      { name: 'spice', bg: '#f4f1ea', category: 'classic', contrast: 'high', temp: 'warm', colors: ['#c8a98c', '#0e3f39', '#c08e49', '#e2560b', '#a17073', '#695c54'] },
      { name: 'storm', bg: '#e8e6e1', category: 'classic', contrast: 'high', temp: 'warm', colors: ['#1c1a14', '#413819', '#f9cf45', '#fbd78b', '#948572', '#2c2618'] },
      { name: 'flora', bg: '#f4f1ea', category: 'classic', contrast: 'high', temp: 'warm', colors: ['#e07809', '#1f6334', '#df79a1', '#bb1009', '#63671b', '#a8b379'] },
      { name: 'earth', bg: '#e3d8c8', category: 'classic', contrast: 'medium', temp: 'warm', colors: ['#b66b56', '#284571', '#f6b36f', '#da6305', '#6e4354', '#ac9575'] },
      { name: 'sunset', bg: '#f4f1ea', category: 'classic', contrast: 'high', temp: 'warm', colors: ['#ee9340', '#133e71', '#e7bc6d', '#d8721e', '#c58583', '#7f9b9e'] },
      { name: 'ember', bg: '#e3d8c8', category: 'classic', contrast: 'high', temp: 'warm', colors: ['#dd4a14', '#33644f', '#c00b04', '#4d7d87', '#e08a19', '#23172d'] },
      { name: 'copper', bg: '#e3d8c8', category: 'classic', contrast: 'high', temp: 'warm', colors: ['#ed8836', '#362a40', '#53475f', '#cf5100', '#dba778', '#2a1e30'] },
      { name: 'twilight', bg: '#e8e6e1', category: 'classic', contrast: 'medium', temp: 'cool', colors: ['#132a5e', '#cf445b', '#ef5a70', '#452c56', '#eba2a9', '#8a5370'] },
      { name: 'plum', bg: '#f4f1ea', category: 'classic', contrast: 'high', temp: 'cool', colors: ['#e54c3c', '#343c7a', '#a90402', '#938cab', '#6d6789', '#b5aecd'] },
      { name: 'blush', bg: '#f4f1ea', category: 'classic', contrast: 'high', temp: 'warm', colors: ['#275a15', '#a16448', '#d47b6d', '#ff8a8b', '#ce4e4b', '#afca97'] },
      { name: 'orchid', bg: '#e8e6e1', category: 'classic', contrast: 'medium', temp: 'cool', colors: ['#1d4a83', '#c1585d', '#86aac4', '#e4948b', '#427ba6', '#a8c7db'] },

      // 2. THE BRIGHTS (Stark backgrounds with vibrant hues and deep, heavy anchor inks)
      { name: 'marine', bg: '#f0f2f5', category: 'bright', contrast: 'high', temp: 'cool', colors: ['#239de0', '#027fd3', '#5bbcf3', '#11151c', '#7acdf5', '#0a5fa0'] },
      { name: 'amethyst', bg: '#fdfcfb', category: 'bright', contrast: 'high', temp: 'cool', colors: ['#a259ff', '#883fe8', '#661ed9', '#150921', '#cda1ee', '#7a30cc'] },
      { name: 'spruce', bg: '#fdfcfb', category: 'bright', contrast: 'high', temp: 'cool', colors: ['#57c7af', '#228e74', '#44aa94', '#0a1a15', '#6dd4be', '#1a7060'] },
      { name: 'ocean', bg: '#f0f2f5', category: 'bright', contrast: 'high', temp: 'cool', colors: ['#05111c', '#355772', '#64808e', '#adc3ce', '#91acb7', '#1e4060'] },
      { name: 'crimson', bg: '#fdfcfb', category: 'bright', contrast: 'high', temp: 'warm', colors: ['#b50e08', '#c94040', '#de7070', '#1c0808', '#a01010', '#801010'] },
      { name: 'topaz', bg: '#fdfcfb', category: 'bright', contrast: 'high', temp: 'warm', colors: ['#e08f0c', '#ecaf30', '#ffe399', '#1c1408', '#c07a00', '#f5c840'] },
      { name: 'ivy', bg: '#fdfcfb', category: 'bright', contrast: 'high', temp: 'warm', colors: ['#268e1b', '#469d3c', '#76c66d', '#1c1c1a', '#95c190', '#3a8a30'] },

      // 3. THE ATMOSPHERES (Tinted wash backgrounds with tonal layers)
      { name: 'breeze', bg: '#e3eef8', category: 'atmosphere', contrast: 'low', temp: 'cool', colors: ['#b8d9f0', '#7ab8e0', '#3e8ec4', '#c8e4f7', '#daeef9', '#5aaad8'] },
      { name: 'lichen', bg: '#e0edea', category: 'atmosphere', contrast: 'low', temp: 'cool', colors: ['#a8e4d8', '#6dd4be', '#44aa94', '#c4ede6', '#b2dfd5', '#228e74'] },

        return shuffle(deck);
      };

      const colorGrid = Array.from({ length: heightUnits }, () => [null, null]);
      const placementsWithShapes = solution.placements
        .map(p => ({ ...p, shape: SHAPE_CATALOG[p.id] }))
        .sort((a, b) => a.y - b.y || a.x - b.x || a.id.localeCompare(b.id));

      let colorDeck = buildBiasedDeck();

      const placementsWithColors = placementsWithShapes.map(p => {
        const neighborColors = new Set();
        const enforceAdjacency = nextRandom() > 0.25;

        if (enforceAdjacency) {
          p.shape.cells.forEach(cell => {
            const gridX = p.x + cell.x;
            const gridY = p.y + cell.y;

            if (gridY + 1 < heightUnits && colorGrid[gridY + 1][gridX]) neighborColors.add(colorGrid[gridY + 1][gridX]);
            if (gridY - 1 >= 0 && colorGrid[gridY - 1][gridX]) neighborColors.add(colorGrid[gridY - 1][gridX]);
            if (gridX - 1 >= 0 && colorGrid[gridY][gridX - 1]) neighborColors.add(colorGrid[gridY][gridX - 1]);
            if (gridX + 1 < 2 && colorGrid[gridY][gridX + 1]) neighborColors.add(colorGrid[gridY][gridX + 1]);
          });
        }

        let validColors = colorDeck.filter(c => !neighborColors.has(c));

        if (validColors.length === 0) {
          colorDeck = buildBiasedDeck();
          validColors = colorDeck.filter(c => !neighborColors.has(c));

          if (validColors.length === 0) {
            validColors = palette.colors.filter(c => !neighborColors.has(c));
          }
          if (validColors.length === 0) {
            validColors = palette.colors;
          }
        }

        const color = validColors[0];
        const deckIndex = colorDeck.indexOf(color);
        if (deckIndex > -1) colorDeck.splice(deckIndex, 1);

        p.shape.cells.forEach(cell => {
          colorGrid[p.y + cell.y][p.x + cell.x] = color;
        });

        return { ...p, color };
      });

      return {
        placements: placementsWithColors,
        heightUnits,
        palette,
        activeProfile,
        seed: currentSeed
      };
    }

    // --- URL STATE SYNCING ---
    function parseURLToState() {
      const params = new URLSearchParams(window.location.search);

      if (params.has('seed')) appState.seed = params.get('seed');
      else appState.seed = null;

      if (params.has('palettes')) appState.selectedPalettes = params.get('palettes').split(',').filter(Boolean);
      else appState.selectedPalettes = [];

      if (params.has('profiles')) appState.selectedProfiles = params.get('profiles').split(',').filter(Boolean);
      else appState.selectedProfiles = [];

      if (params.has('heights')) {
        const val = params.get('heights');
        if (val.includes('-')) {
          appState.heightMode = 'range';
          const parts = val.split('-').map(Number);
          appState.rangeStart = parts[0];
          appState.rangeEnd = parts[1];
          const min = Math.min(appState.rangeStart, appState.rangeEnd);
          const max = Math.max(appState.rangeStart, appState.rangeEnd);
          appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(h => h >= min && h <= max));
        } else {
          appState.heightMode = 'multi';
          appState.selectedHeights = new Set(val.split(',').filter(Boolean).map(Number));
          appState.rangeStart = null;
          appState.rangeEnd = null;
        }
      } else {
        appState.heightMode = 'multi';
        appState.selectedHeights = new Set();
        appState.rangeStart = null;
        appState.rangeEnd = null;
      }

      if (params.has('outline')) appState.showOutline = params.get('outline') !== 'false';
      else appState.showOutline = true;

      if (params.has('meta')) appState.showMetadata = params.get('meta') !== 'false';
      else appState.showMetadata = true;

      if (params.has('export')) appState.showExport = params.get('export') !== 'false';
      else appState.showExport = true;
    }

    function syncStateToURL() {
      const url = new URL(window.location);
      const sp = url.searchParams;
      // Clean start
      sp.delete('seed'); sp.delete('palettes'); sp.delete('profiles'); sp.delete('heights');
      sp.delete('outline'); sp.delete('meta'); sp.delete('export');

      if (appState.selectedPalettes.length) sp.set('palettes', appState.selectedPalettes.join(','));
      if (appState.selectedProfiles.length) sp.set('profiles', appState.selectedProfiles.join(','));

      if (appState.selectedHeights.size > 0) {
        if (appState.heightMode === 'range' && appState.rangeStart !== null && appState.rangeEnd !== null) {
          const min = Math.min(appState.rangeStart, appState.rangeEnd);
          const max = Math.max(appState.rangeStart, appState.rangeEnd);
          sp.set('heights', `${min}-${max}`);
        } else {
          sp.set('heights', Array.from(appState.selectedHeights).sort((a, b) => a - b).join(','));
        }
      }

      if (!appState.showOutline) sp.set('outline', 'false');
      if (!appState.showMetadata) sp.set('meta', 'false');
      if (!appState.showExport) sp.set('export', 'false');
      if (appState.seed) sp.set('seed', appState.seed);

      // Pretty construct the final string with actual commas
      const searchString = sp.toString().replace(/%2C/g, ',');
      appState.shareUrl = url.origin + url.pathname + (searchString ? '?' + searchString : '');

      try {
        window.history.replaceState(null, '', appState.shareUrl);
      } catch (e) {
        console.warn("Could not update URL history state in this environment.", e);
      }
    }

    function applyStateToDOM() {
      document.querySelectorAll('#palette-filter-list input[type="checkbox"]').forEach(c => {
        c.checked = appState.selectedPalettes.includes(c.value);
      });
      document.querySelectorAll('#profile-filter-list input[type="checkbox"]').forEach(c => {
        c.checked = appState.selectedProfiles.includes(c.value);
      });

      const rangeToggleEl = document.getElementById('toggle-range-mode');
      if (rangeToggleEl) rangeToggleEl.checked = (appState.heightMode === 'range');

      const outlineEl = document.getElementById('toggle-outline');
      if (outlineEl) outlineEl.checked = appState.showOutline;

      const metadataEl = document.getElementById('toggle-metadata');
      if (metadataEl) metadataEl.checked = appState.showMetadata;

      const exportEl = document.getElementById('toggle-export');
      if (exportEl) exportEl.checked = appState.showExport;

      renderHeightList();
    }

    // --- CONTROLLER LAYER ---
    function getActiveHeights() {
      return Array.from(appState.selectedHeights);
    }

    function syncStateFromDOM() {
      appState.selectedPalettes = [...document.querySelectorAll('#palette-filter-list input:checked')].map(i => i.value);
      appState.selectedProfiles = [...document.querySelectorAll('#profile-filter-list input:checked')].map(i => i.value);

      appState.showOutline = document.getElementById('toggle-outline')?.checked ?? true;
      appState.showMetadata = document.getElementById('toggle-metadata')?.checked ?? true;
      appState.showExport = document.getElementById('toggle-export')?.checked ?? true;
    }

    function triggerGeneration() {
      syncStateFromDOM();

      let wasSeedForced = !!appState.seed;

      const params = {
        allowedPalettes: appState.selectedPalettes || [],
        allowedProfiles: appState.selectedProfiles || [],
        allowedHeights: getActiveHeights() || [],
        seed: appState.seed
      };

      let newArtwork = generateStack(params);

      // Automatic failsafe: if a shared seed was mathematically invalid somehow, regenerate cleanly
      if (!newArtwork && appState.seed) {
        params.seed = null;
        appState.seed = null;
        wasSeedForced = false;
        newArtwork = generateStack(params);
      }

      if (newArtwork) {
        appState.artwork = newArtwork;

        // Auto-toggle outline based on palette category for fresh generations
        // only if no specific palettes (colors) are selected.
        if (!wasSeedForced && appState.selectedPalettes.length === 0) {
          appState.showOutline = !(newArtwork.palette.category === 'muted' || newArtwork.palette.category === 'void');
          const toggleBorder = document.getElementById('toggle-outline');
          if (toggleBorder) {
            toggleBorder.checked = appState.showOutline;
          }
        }

        appState.seed = newArtwork.seed;
        renderUI();
        syncStateToURL();
      }
    }

    // --- RENDER LAYER ---
    function buildDotStrip(container, colors) {
      if (!container) return;
      container.innerHTML = '';
      colors.forEach((c, i) => {
        const d = document.createElement('div');
        d.className = 'dot';
        d.style.background = c;
        if (i === 0) d.title = 'background';
        container.appendChild(d);
      });
    }

    function renderUI() {
      if (!appState.artwork) return;
      const { placements, heightUnits, palette, activeProfile } = appState.artwork;

      const svg = document.getElementById('svg-out');
      svg.innerHTML = '';

      const stackHeightPx = (heightUnits * CELL_STEP) + BORDER_WIDTH;
      const offsetX = Math.round((CANVAS_SIZE - COLUMN_WIDTH) / 2);
      const offsetY = Math.round((CANVAS_SIZE - stackHeightPx) / 2);

      // Lock dimensions explicitly for PNG export
      svg.setAttribute('viewBox', `0 0 ${CANVAS_SIZE} ${CANVAS_SIZE}`);
      svg.setAttribute('width', CANVAS_SIZE);
      svg.setAttribute('height', CANVAS_SIZE);

      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('width', CANVAS_SIZE); bg.setAttribute('height', CANVAS_SIZE); bg.setAttribute('fill', palette.bg);
      svg.appendChild(bg);

      placements.forEach(placement => {
        const shape = SHAPE_CATALOG[placement.id];
        const color = placement.color;

        const occupied = new Set(shape.cells.map(cell => `${cell.x},${cell.y}`));
        shape.cells.forEach(cell => {
          const cellX = offsetX + ((placement.x + cell.x) * CELL_STEP);
          const gridY = placement.y + cell.y;
          const cellY = offsetY + ((heightUnits - 1 - gridY) * CELL_STEP);

          const insetLeft = occupied.has(`${cell.x - 1},${cell.y}`) ? 0 : BORDER_WIDTH;
          const insetRight = occupied.has(`${cell.x + 1},${cell.y}`) ? 0 : BORDER_WIDTH;
          const insetTop = occupied.has(`${cell.x},${cell.y + 1}`) ? 0 : BORDER_WIDTH;
          const insetBottom = occupied.has(`${cell.x},${cell.y - 1}`) ? 0 : BORDER_WIDTH;

          const effectiveGapColor = appState.showOutline ? INK_COLOR : palette.bg;

          addRect(svg, cellX, cellY, CELL_SIZE, CELL_SIZE, effectiveGapColor);
          addRect(
            svg,
            cellX + insetLeft,
            cellY + insetTop,
            CELL_SIZE - insetLeft - insetRight,
            CELL_SIZE - insetTop - insetBottom,
            color
          );
        });
      });

      // ADAPT UI COLORS
      const lightBg = isLight(palette.bg);
      const baseRGB = lightBg ? '28, 28, 26' : '240, 238, 232';

      const root = document.documentElement;
      root.style.setProperty('--ui-bg', palette.bg);
      root.style.setProperty('--ui-ink', `rgba(${baseRGB}, 0.9)`);
      root.style.setProperty('--ui-ink-muted', `rgba(${baseRGB}, 0.5)`);
      root.style.setProperty('--ui-rule', `rgba(${baseRGB}, 0.1)`);

      // OVERLAY VISIBILITY
      document.getElementById('metadata-overlay')?.classList.toggle('is-hidden', !appState.showMetadata);
      document.getElementById('export-overlay')?.classList.toggle('is-hidden', !appState.showExport);

      // METADATA TEXT & DOTS
      const seedDisplayEl = document.getElementById('seed-display');
      if (seedDisplayEl) seedDisplayEl.textContent = appState.seed;

      const shapeCountEl = document.getElementById('shape-count');
      if (shapeCountEl) shapeCountEl.textContent = placements.length;

      const stackHeightEl = document.getElementById('stack-height');
      if (stackHeightEl) stackHeightEl.textContent = heightUnits;

      const paletteNameEl = document.getElementById('palette-name');
      if (paletteNameEl) paletteNameEl.textContent = palette.name;

      const profileNameEl = document.getElementById('profile-name');
      if (profileNameEl) profileNameEl.textContent = activeProfile;

      const usedColors = new Set(placements.map(p => p.color));
      const sortedUsedColors = palette.colors.filter(c => usedColors.has(c));

      buildDotStrip(
        document.getElementById('actual-palette-dots'),
        [palette.bg, ...sortedUsedColors]
      );
      buildDotStrip(
        document.getElementById('palette-dots'),
        [palette.bg, ...palette.colors]
      );

      const shapesList = document.getElementById('shapes-list');
      if (shapesList) {
        shapesList.innerHTML = '';
        const counts = placements.reduce((acc, p) => {
          const piece = SHAPE_CATALOG[p.id].piece;
          acc[piece] = (acc[piece] || 0) + 1;
          return acc;
        }, {});
        FAMILY_ORDER.filter(piece => counts[piece]).forEach(piece => {
          const stat = document.createElement('div');
          stat.className = 'stat';
          stat.innerHTML = `<span class="stat-label">${piece}</span><span class="stat-value">${counts[piece]}</span>`;
          shapesList.appendChild(stat);
        });
      }
    }

    function renderHeightList() {
      const hList = document.getElementById('height-filter-container');
      if (!hList) return;
      hList.innerHTML = '';

      POSSIBLE_HEIGHTS.slice().sort((a, b) => a - b).forEach(h => {
        const cell = document.createElement('div');
        cell.className = 'height-cell';

        // Styling purely references the single source of truth: selectedHeights
        if (appState.heightMode === 'multi') {
          if (appState.selectedHeights.has(h)) cell.classList.add('is-selected');
        } else {
          if (appState.selectedHeights.has(h)) {
            cell.classList.add('in-range');
            const min = appState.rangeEnd !== null ? Math.min(appState.rangeStart, appState.rangeEnd) : appState.rangeStart;
            const max = appState.rangeEnd !== null ? Math.max(appState.rangeStart, appState.rangeEnd) : appState.rangeStart;
            if (h === min) cell.classList.add('range-start');
            if (h === max) cell.classList.add('range-end');
          }
        }

        cell.innerHTML = `<span>${h}</span>`;

        // Click logic modifies the single source of truth: selectedHeights
        cell.addEventListener('click', () => {
          if (appState.heightMode === 'multi') {
            if (appState.selectedHeights.has(h)) appState.selectedHeights.delete(h);
            else appState.selectedHeights.add(h);
          } else {
            if (appState.rangeStart === null || (appState.rangeStart !== null && appState.rangeEnd !== null)) {
              appState.rangeStart = h;
              appState.rangeEnd = null;
              appState.selectedHeights = new Set([h]); // Instantly translates UI action to engine data
            } else {
              appState.rangeEnd = h;
              const min = Math.min(appState.rangeStart, appState.rangeEnd);
              const max = Math.max(appState.rangeStart, appState.rangeEnd);
              appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(val => val >= min && val <= max));
            }
          }
          appState.seed = null;
          renderHeightList();
          triggerGeneration();
        });

        hList.appendChild(cell);
      });
    }

    // --- INITIALIZATION & BINDING ---
    function bindParamsPanel() {
      // 2. Height Logic
      const rangeToggle = document.getElementById('toggle-range-mode');
      if (rangeToggle) {
        rangeToggle.addEventListener('change', (e) => {
          appState.heightMode = e.target.checked ? 'range' : 'multi';

          // When switching modes, calculate UI representation from the single source of truth
          if (appState.heightMode === 'range') {
            const arr = Array.from(appState.selectedHeights).sort((a, b) => a - b);
            if (arr.length > 0) {
              appState.rangeStart = arr[0];
              appState.rangeEnd = arr[arr.length - 1];
              const min = Math.min(appState.rangeStart, appState.rangeEnd);
              const max = Math.max(appState.rangeStart, appState.rangeEnd);
              appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(h => h >= min && h <= max));
            } else {
              appState.rangeStart = null;
              appState.rangeEnd = null;
            }
          } else {
            appState.rangeStart = null;
            appState.rangeEnd = null;
          }
          appState.seed = null;
          renderHeightList();
          triggerGeneration();
        });
      }
      renderHeightList();

      // 3. Dynamic Palettes (Restored Checkboxes)
      const pList = document.getElementById('palette-filter-list');
      const groupedPalettes = {};
      PALETTES.forEach(p => {
        if (!groupedPalettes[p.category]) groupedPalettes[p.category] = [];
        groupedPalettes[p.category].push(p);
      });

      Object.keys(groupedPalettes).forEach(category => {
        const header = document.createElement('div');
        header.className = 'params-subsection-title';
        header.textContent = category;
        header.title = `Toggle all ${category} palettes`;

        const categoryInputs = [];

        header.addEventListener('click', () => {
          const allChecked = categoryInputs.every(input => input.checked);
          categoryInputs.forEach(input => input.checked = !allChecked);
          appState.seed = null;
          triggerGeneration();
        });

        pList.appendChild(header);

        groupedPalettes[category].forEach(p => {
          const l = document.createElement('label');
          l.className = 'setting-item';
          l.innerHTML = `<input type="checkbox" value="${p.name}"><code>${p.name}</code>`;
          categoryInputs.push(l.querySelector('input'));
          pList.appendChild(l);
        });
      });

      // Listeners for UI Checkboxes
      pList.addEventListener('change', () => {
        appState.seed = null;
        triggerGeneration();
      });

      document.getElementById('profile-filter-list')?.addEventListener('change', () => {
        appState.seed = null;
        triggerGeneration();
      });

      // 5. Render Mode Listeners (These do NOT clear the seed!)
      document.getElementById('toggle-outline')?.addEventListener('change', (e) => {
        appState.showOutline = e.target.checked;
        renderUI();
        syncStateToURL();
      });

      document.getElementById('toggle-metadata')?.addEventListener('change', (e) => {
        appState.showMetadata = e.target.checked;
        renderUI();
        syncStateToURL();
      });

      document.getElementById('toggle-export')?.addEventListener('change', (e) => {
        appState.showExport = e.target.checked;
        renderUI();
        syncStateToURL();
      });

      // 6. Clear All
      document.getElementById('select-none-btn')?.addEventListener('click', () => {
        document.querySelectorAll('#profile-filter-list input, #palette-filter-list input').forEach(c => c.checked = false);

        const outlineEl = document.getElementById('toggle-outline');
        if (outlineEl) outlineEl.checked = true;

        const metadataEl = document.getElementById('toggle-metadata');
        if (metadataEl) metadataEl.checked = true;

        const exportEl = document.getElementById('toggle-export');
        if (exportEl) exportEl.checked = true;

        const rangeToggleEl = document.getElementById('toggle-range-mode');
        if (rangeToggleEl) rangeToggleEl.checked = false;

        // Reset state
        appState.heightMode = 'multi';
        appState.selectedHeights.clear(); // Clear single source of truth
        appState.rangeStart = null;
        appState.rangeEnd = null;
        appState.showOutline = true;
        appState.showMetadata = true;
        appState.showExport = true;

        appState.seed = null;
        renderHeightList();
        triggerGeneration();
      });
    }

    function bindControls() {
      // Manual shuffle explicitly requests a newly generated seed
      document.getElementById('panel-shuffle-btn')?.addEventListener('click', () => {
        appState.seed = null;
        triggerGeneration();
      });
      document.getElementById('download-png-btn')?.addEventListener('click', downloadPNG);
      document.getElementById('download-svg-btn')?.addEventListener('click', downloadSVG);

      // Copy Link via Seed Display
      document.getElementById('seed-display')?.addEventListener('click', () => {
        if (!appState.seed) return;
        const url = appState.shareUrl || window.location.href;
        const tempInput = document.createElement('input');
        tempInput.value = url;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);

        const display = document.getElementById('seed-display');
        const orig = display.textContent;
        display.innerHTML = '<span style="color: var(--ui-ink-muted);">COPIED</span>';
        setTimeout(() => {
          // Double check the seed hasn't changed while waiting
          if (appState.seed === orig) {
            display.textContent = orig;
          } else {
            display.textContent = appState.seed;
          }
        }, 1500);
      });
    }

    function bindShortcuts() {
      document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey) return;
        const key = e.key.toLowerCase();

        // Manual shuffle explicitly requests a newly generated seed
        if (key === 'r') {
          appState.seed = null;
          triggerGeneration();
        }

        if (key === 'i') {
          const paramsPanel = document.getElementById('params-panel');
          const isHiding = !paramsPanel.classList.contains('is-hidden');

          if (isHiding) {
            ['metadata-overlay', 'logo-overlay', 'export-overlay', 'params-panel'].forEach(id => {
              document.getElementById(id)?.classList.add('is-hidden');
            });
          } else {
            paramsPanel.classList.remove('is-hidden');
            document.getElementById('logo-overlay')?.classList.remove('is-hidden');

            // UI elements sync back to true appState
            document.getElementById('metadata-overlay')?.classList.toggle('is-hidden', !appState.showMetadata);
            document.getElementById('export-overlay')?.classList.toggle('is-hidden', !appState.showExport);
          }
        }
        if (key === 'p') downloadPNG();
        if (key === 's') downloadSVG();
      });
    }

    // --- EXPORT PIPELINE ---

    function getSVGString() {
      const svg = document.getElementById('svg-out');
      const clone = svg.cloneNode(true);

      clone.setAttribute('width', CANVAS_SIZE);
      clone.setAttribute('height', CANVAS_SIZE);
      if (!clone.getAttribute('xmlns')) {
        clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      }

      return new XMLSerializer().serializeToString(clone);
    }

    function downloadSVG() {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([getSVGString()], { type: 'image/svg+xml' }));
      a.download = '4x4rt-stacks.svg';
      a.click();
    }

    function downloadPNG() {
      const svgString = getSVGString();
      const img = new Image();
      const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);

      img.onload = () => {
        const c = document.createElement('canvas');
        const scale = 2;
        c.width = CANVAS_SIZE * scale;
        c.height = CANVAS_SIZE * scale;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, CANVAS_SIZE * scale, CANVAS_SIZE * scale);

        const a = document.createElement('a');
        a.href = c.toDataURL('image/png');
        a.download = '4x4rt-stacks.png';
        a.click();
      };

      img.onerror = (e) => {
        console.error("PNG rendering failed", e);
      };

      img.src = url;
    }

    // --- INIT SEQUENCE ---
    bindControls();
    parseURLToState();    // 1. Read URL configurations shared by a friend
    bindParamsPanel();    // 2. Build DOM structures (Palettes list, heights list)
    bindShortcuts();
    applyStateToDOM();    // 3. Tick checkboxes to match URL parameters

    // 4. Boot engine
    triggerGeneration(); 
  </script>
