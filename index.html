<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4x4rt Stacks Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --page-pad-x: 40px;
      --page-pad-y: 40px;
      --canvas-size: 80vmin;
      --rule-width: 1px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1b1b1b;
      font-family: 'Space Mono', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--page-pad-y) var(--page-pad-x);
      min-height: 100vh;
    }

    .app {
      display: flex;
      gap: calc(var(--canvas-size) * 0.015);
      align-items: flex-start;
      width: fit-content;
      max-width: 100%;
      justify-content: center;
    }

    .canvas-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--canvas-size) * 0.02);
      width: var(--canvas-size);
    }

    .params-panel {
      width: calc(var(--canvas-size) * 0.3);
      max-height: var(--canvas-size);
      overflow: auto;
      padding: calc(var(--canvas-size) * 0.015);
      background: var(--ui-bg);
      color: var(--ui-ink);
    }

    .params-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: calc(var(--canvas-size) * 0.024);
      line-height: 1;
      text-transform: uppercase;
      color: var(--ui-ink);
      margin-bottom: calc(var(--canvas-size) * 0.015);
    }

    .shuffle-btn {
      background: none;
      border: none;
      color: var(--ui-ink);
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shuffle-btn svg {
      width: calc(var(--canvas-size) * 0.032);
      height: calc(var(--canvas-size) * 0.032);
    }

    .params-copy {
      font-size: calc(var(--canvas-size) * 0.018);
      line-height: 1.5;
      color: var(--ui-ink-muted);
      margin-bottom: calc(var(--canvas-size) * 0.015);
    }

    .params-section {
      margin-bottom: calc(var(--canvas-size) * 0.02);
    }

    .params-section-header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: calc(var(--canvas-size) * 0.015);
      margin-bottom: calc(var(--canvas-size) * 0.015);
    }

    .params-section-title {
      font-size: calc(var(--canvas-size) * 0.02);
      text-transform: uppercase;
      color: var(--ui-ink);
      margin-bottom: calc(var(--canvas-size) * 0.01);
    }

    .params-section-header .params-section-title {
      margin-bottom: 0;
    }

    .params-subsection-title {
      font-size: calc(var(--canvas-size) * 0.016);
      text-transform: uppercase;
      color: var(--ui-ink-muted);
      margin-top: calc(var(--canvas-size) * 0.015);
      margin-bottom: calc(var(--canvas-size) * 0.005);
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .params-subsection-title:first-child {
      margin-top: 0;
    }

    /* Range vs Multi Toggle Button */
    .mode-toggle {
      cursor: pointer;
      width: calc(var(--canvas-size) * 0.045);
      display: flex;
      align-items: center;
    }

    .mode-toggle input {
      display: none;
    }

    .mode-toggle svg {
      width: 100%;
      height: auto;
      color: var(--ui-ink);
    }

    .mode-toggle .icon-range {
      display: none;
    }

    .mode-toggle input:checked~.icon-range {
      display: block;
    }

    .mode-toggle input:checked~.icon-multi {
      display: none;
    }

    .height-filter-list {
      display: flex;
      flex-wrap: wrap;
      gap: calc(var(--canvas-size) * 0.01) 0;
    }

    .height-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(var(--canvas-size) * 0.03);
      min-width: calc(var(--canvas-size) * 0.064);
      padding: 0 calc(var(--canvas-size) * 0.025) 0 calc(var(--canvas-size) * 0.015);
      color: var(--ui-ink);
      font-family: 'Space Mono', monospace;
      font-size: calc(var(--canvas-size) * 0.018);
      cursor: pointer;
    }

    .height-cell::before {
      content: '';
      position: absolute;
      inset: 0 calc(var(--canvas-size) * 0.01) 0 0;
      border: 2px solid var(--ui-ink);
      border-radius: 999px;
      z-index: 0;
    }

    .height-cell span {
      position: relative;
      z-index: 1;
    }

    .height-cell.is-selected,
    .height-cell.in-range {
      color: var(--ui-bg);
    }

    .height-cell.is-selected::before,
    .height-cell.in-range::before {
      background-color: var(--ui-ink);
      border-color: transparent;
    }

    .height-cell.in-range::before {
      inset: 0;
      border-radius: 0;
    }

    .height-cell.range-start::before {
      inset: 0;
      border-radius: 999px 0 0 999px;
    }

    .height-cell.range-end::before {
      inset: 0 calc(var(--canvas-size) * 0.01) 0 0;
      border-radius: 0 999px 999px 0;
    }

    .height-cell.range-start.range-end::before {
      inset: 0 calc(var(--canvas-size) * 0.01) 0 0;
      border-radius: 999px;
    }

    .limit-slider {
      position: relative;
      width: 100%;
      height: calc(var(--canvas-size) * 0.03);
      margin-top: calc(var(--canvas-size) * 0.015);
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }
 
    .limit-slider-track {
      position: absolute;
      inset: 0;
      background: var(--ui-rule);
      border-radius: 999px;
    }
 
    .limit-slider-thumb {
      position: absolute;
      height: 100%;
      min-width: calc(var(--canvas-size) * 0.054);
      padding: 0 calc(var(--canvas-size) * 0.015);
      background-color: var(--ui-ink);
      color: var(--ui-bg);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Mono', monospace;
      font-size: calc(var(--canvas-size) * 0.018);
      transform: translateX(0);
      z-index: 2;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }
 
    .limit-slider-thumb.is-dragging {
      transition: none;
    }

    .settings-list {
      display: flex;
      flex-direction: column;
      gap: calc(var(--canvas-size) * 0.01);
    }

    .palette-filter-list {
      display: flex;
      flex-direction: column;
      gap: calc(var(--canvas-size) * 0.01);
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: calc(var(--canvas-size) * 0.012);
      font-size: calc(var(--canvas-size) * 0.018);
      text-transform: uppercase;
      cursor: pointer;
    }

    .setting-item input {
      appearance: none;
      width: calc(var(--canvas-size) * 0.022);
      height: calc(var(--canvas-size) * 0.022);
      flex: 0 0 auto;
      border: 2px solid var(--ui-ink);
      border-radius: 4px;
      background-color: transparent;
      margin: 0;
      cursor: pointer;
    }

    .setting-item input:checked {
      border-color: var(--ui-ink);
      background-color: var(--ui-ink);
      box-shadow: inset 0 0 0 2px var(--ui-bg);
    }

    .setting-item code {
      font-family: 'Space Mono', monospace;
      font-size: calc(var(--canvas-size) * 0.018);
      color: var(--ui-ink);
    }

    .params-actions {
      display: flex;
      gap: calc(var(--canvas-size) * 0.015);
      flex-wrap: wrap;
      font-size: calc(var(--canvas-size) * 0.018);
      text-transform: uppercase;
    }

    .params-link {
      font-family: 'Space Mono', monospace;
      font-size: calc(var(--canvas-size) * 0.018);
      text-transform: uppercase;
      color: var(--ui-ink);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-box-trim: trim-both;
      text-box-edge: cap alphabetic;
    }

    .params-link:hover {
      opacity: 0.7;
    }

    .svg-container {
      position: relative;
      width: var(--canvas-size);
      height: var(--canvas-size);
      background: var(--ui-bg);
    }

    .svg-out {
      display: block;
      width: 100%;
      height: 100%;
    }

    svg,
    path {
      shape-rendering: crispEdges;
    }

    .metadata-overlay {
      position: absolute;
      top: calc(var(--canvas-size) * 0.015);
      left: calc(var(--canvas-size) * 0.015);
      display: flex;
      flex-direction: column;
      gap: calc(var(--canvas-size) * 0.015);
      color: var(--ui-ink);
      z-index: 2;
      text-transform: uppercase;
      width: calc(var(--canvas-size) * 0.375);
    }

    .logo-overlay {
      position: absolute;
      right: calc(var(--canvas-size) * 0.01);
      bottom: calc(var(--canvas-size) * 0.01);
      width: calc(var(--canvas-size) * 0.09);
      height: calc(var(--canvas-size) * 0.03);
      z-index: 3;
      pointer-events: none;
    }

    .logo-overlay svg {
      display: block;
    }

    .export-overlay {
      position: absolute;
      left: calc(var(--canvas-size) * 0.015);
      bottom: calc(var(--canvas-size) * 0.015);
      display: flex;
      flex-direction: row;
      gap: calc(var(--canvas-size) * 0.015);
      z-index: 10;
    }

    .is-hidden {
      display: none !important;
    }

    .download-btn {
      font-family: 'Space Mono', monospace;
      font-weight: 400;
      font-size: calc(var(--canvas-size) * 0.029);
      text-transform: uppercase;
      color: var(--ui-ink);
      white-space: nowrap;
      text-box-trim: trim-both;
      text-box-edge: cap alphabetic;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
    }

    .arrow-symbol {
      font-family: 'Space Grotesk', sans-serif;
      display: inline-block;
      margin-left: 0.3em;
    }

    .stat {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: baseline;
      column-gap: calc(var(--canvas-size) * 0.016);
      width: 100%;
      font-size: calc(var(--canvas-size) * 0.024);
      color: var(--ui-ink-muted);
    }

    .stat+.stat {
      padding-top: calc(var(--canvas-size) * 0.015);
      border-top: var(--rule-width) solid var(--ui-rule);
    }

    .stat-value {
      color: var(--ui-ink);
      justify-self: end;
    }

    .stat-suffix {
      color: var(--ui-ink-muted);
    }

    #seed-display {
      cursor: pointer;
    }

    .shapes-list .stat {
      color: var(--ui-ink-muted);
      padding-top: calc(var(--canvas-size) * 0.015);
      padding-bottom: calc(var(--canvas-size) * 0.015);
      border-top: none;
    }

    .shapes-list .stat:first-child {
      border-top: var(--rule-width) solid var(--ui-rule);
    }

    .shapes-list .stat+.stat {
      border-top: var(--rule-width) solid var(--ui-rule);
    }

    .shapes-list .stat:last-child {
      border-bottom: var(--rule-width) solid var(--ui-rule);
    }

    .palette-dots {
      grid-column: 1 / -1;
      display: flex;
      width: 100%;
      gap: 0;
      flex-wrap: nowrap;
      margin-top: calc(var(--canvas-size) * 0.008);
      border: var(--rule-width) solid var(--ui-rule);
      border-radius: calc(var(--canvas-size) * 0.03);
      overflow: hidden;
    }

    .dot {
      flex: 1 1 0;
      height: calc(var(--canvas-size) * 0.02);
      flex-shrink: 1;
    }

    @media (max-width: 640px) {
      :root {
        --page-pad-x: 16px;
        --page-pad-y: 16px;
      }

      .app {
        flex-direction: column;
        gap: 24px;
      }

      .params-panel {
        width: 100%;
        max-height: none;
      }
    }
  </style>
</head>

<body>
  <div id="app" class="app">
    <div id="canvas-wrap" class="canvas-wrap">
      <div id="svg-container" class="svg-container">
        <svg id="svg-out" class="svg-out" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"></svg>

        <div id="metadata-overlay" class="metadata-overlay">
          <!-- Deterministic Seed Display -->
          <div class="stat">
            <span class="stat-label">Seed</span>
            <span class="stat-value" id="seed-display">—</span>
          </div>

          <div class="stat">
            <span class="stat-label">Palette</span>
            <span class="stat-value" id="palette-name">—</span>
            <div id="palette-dots" class="palette-dots"></div>
          </div>

          <div class="stat">
            <span class="stat-label">Profile</span>
            <span class="stat-value" id="profile-name">—</span>
            <div id="actual-palette-dots" class="palette-dots"></div>
          </div>
          <div id="metadata-limit-stat" class="stat is-hidden">
            <span class="stat-label">Limit</span>
            <span class="stat-value"><span id="limit-display">—</span><span class="stat-suffix"> Blocks</span></span>
          </div>

          <div class="stat">
            <span class="stat-label">Height</span>
            <span class="stat-value"><span id="stack-height">—</span><span class="stat-suffix"> units</span></span>
          </div>
          <div class="stat" id="shapes-heading">
            <span class="stat-label">Shapes</span>
            <span class="stat-value" id="shape-count">—</span>
          </div>
          <div id="shapes-list" class="shapes-list" role="list" aria-labelledby="shapes-heading"></div>
        </div>

        <div id="logo-overlay" class="logo-overlay">
          <svg viewBox="0 0 90 30" preserveAspectRatio="xMaxYMax meet" xmlns="http://www.w3.org/2000/svg">
            <g fill="var(--ui-ink-muted)">
              <rect width="24" height="6" />
              <rect y="16" width="24" height="6" />
              <rect y="24" width="12" height="6" />
              <rect x="12" y="8" width="18" height="6" />

              <rect x="30" y="8" width="24" height="6" />
              <rect x="30" y="24" width="24" height="6" />
              <rect x="36" width="24" height="6" />
              <rect x="36" y="16" width="24" height="6" />

              <rect x="60" width="24" height="6" />
              <rect x="60" y="16" width="24" height="6" />
              <rect x="60" y="24" width="12" height="6" />
              <rect x="72" y="8" width="18" height="6" />
              <rect x="78" y="24" width="12" height="6" />
            </g>
          </svg>
        </div>

        <div id="export-overlay" class="export-overlay">
          <button class="download-btn" id="download-png-btn">PNG<span class="arrow-symbol">↓</span></button>
          <button class="download-btn" id="download-svg-btn">SVG<span class="arrow-symbol">↓</span></button>
        </div>
      </div>
    </div>
    <aside id="params-panel" class="params-panel">
      <div class="params-title">
        <span>Parameters</span>
        <button class="shuffle-btn" id="panel-shuffle-btn" title="Regenerate">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2"
            stroke-miterlimit="10" stroke-linecap="square">
            <path d="M15.625 11.875L17.5 13.75L15.625 15.625" />
            <path d="M15.625 4.375L17.5 6.25L15.625 8.125" />
            <path d="M2.5 13.75H7.5L9.84375 10.1562" />
            <path d="M2.5 6.25H7.5L12.5 13.75H16.25" />
            <path d="M16.25 6.25H12.5L11.25 8.125" />
          </svg>
        </button>
      </div>

      <div class="params-section">
        <div class="params-section-title">Render Mode</div>
        <div class="settings-list">
          <label class="setting-item">
            <input type="checkbox" id="toggle-outline" checked>
            <code>Outline</code>
          </label>
          <label class="setting-item">
            <input type="checkbox" id="toggle-metadata" checked>
            <code>Metadata</code>
          </label>
          <label class="setting-item">
            <input type="checkbox" id="toggle-export" checked>
            <code>Export</code>
          </label>
        </div>
      </div>

      <div class="params-section">
        <div class="params-section-title">Color Profile</div>
        <div id="profile-filter-list" class="settings-list">
          <label class="setting-item">
            <input type="checkbox" value="isolate">
            <code>Isolate</code>
          </label>
          <label class="setting-item">
            <input type="checkbox" value="drift">
            <code>Drift</code>
          </label>
          <label class="setting-item">
            <input type="checkbox" value="spectrum">
            <code>Spectrum</code>
          </label>
        </div>
      </div>
      <div id="params-limit-section" class="params-section is-hidden">
        <div class="params-section-title">Limit</div>
        <div id="limit-slider-container"></div>
      </div>

      <div class="params-section">
        <div class="params-section-header">
          <div class="params-section-title">Height</div>
          <label class="mode-toggle" title="Toggle Range Mode">
            <input type="checkbox" id="toggle-range-mode">
            <svg class="icon-multi" viewBox="0 0 36 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="6" cy="8" r="4" fill="currentColor" />
              <circle cx="18" cy="8" r="4" fill="currentColor" />
              <circle cx="30" cy="8" r="4" fill="currentColor" />
            </svg>
            <svg class="icon-range" viewBox="0 0 36 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="6" y1="8" x2="30" y2="8" stroke="currentColor" stroke-width="2"
                vector-effect="non-scaling-stroke" />
              <circle cx="6" cy="8" r="4" fill="currentColor" />
              <circle cx="30" cy="8" r="4" fill="currentColor" />
            </svg>
          </label>
        </div>
        <div id="height-filter-container" class="height-filter-list"></div>
      </div>

      <div class="params-section">
        <div class="params-section-title">Palettes</div>
        <div id="palette-filter-list" class="palette-filter-list"></div>
      </div>

      <div class="params-actions">
        <button class="params-link" id="select-none-btn" type="button">clear all</button>
      </div>
    </aside>
  </div>
  <script>
    const BORDER_WIDTH = 10;
    const CANVAS_SIZE = 1000;
    const CELL_SIZE = 100;
    const CELL_STEP = CELL_SIZE - BORDER_WIDTH; // Make sure 2 adjacent cells' borders overlap
    const COLUMN_WIDTH = 2 * CELL_STEP + BORDER_WIDTH; // Width of a 2-unit column: two steps + one closing border
    const INK_COLOR = '#1c1c1a'; // Fixed dark ink specifically for the structural artwork outlines

    // A cohesive generative system: Curated, thematic, and distinct.
    const PALETTES = [
      // 1. THE CLASSICS (Anchored to Warm Cotton, Newsprint, and Kraft papers)
      { name: 'spice', bg: '#f4f1ea', category: 'classic', colors: ['#c8a98c', '#0e3f39', '#c08e49', '#e2560b', '#a17073', '#695c54'] },
      { name: 'storm', bg: '#e8e6e1', category: 'classic', colors: ['#1c1a14', '#413819', '#f9cf45', '#fbd78b', '#948572', '#2c2618'] },
      { name: 'flora', bg: '#f4f1ea', category: 'classic', colors: ['#e07809', '#1f6334', '#df79a1', '#bb1009', '#63671b', '#a8b379'] },
      { name: 'earth', bg: '#e3d8c8', category: 'classic', colors: ['#b66b56', '#284571', '#f6b36f', '#da6305', '#6e4354', '#ac9575'] },
      { name: 'sunset', bg: '#f4f1ea', category: 'classic', colors: ['#ee9340', '#133e71', '#e7bc6d', '#d8721e', '#c58583', '#7f9b9e'] },
      { name: 'ember', bg: '#e3d8c8', category: 'classic', colors: ['#dd4a14', '#33644f', '#c00b04', '#4d7d87', '#e08a19', '#23172d'] },
      { name: 'copper', bg: '#e3d8c8', category: 'classic', colors: ['#ed8836', '#362a40', '#53475f', '#cf5100', '#dba778', '#2a1e30'] },
      { name: 'twilight', bg: '#e8e6e1', category: 'classic', colors: ['#132a5e', '#cf445b', '#ef5a70', '#452c56', '#eba2a9', '#8a5370'] },
      { name: 'plum', bg: '#f4f1ea', category: 'classic', colors: ['#e54c3c', '#343c7a', '#a90402', '#938cab', '#6d6789', '#b5aecd'] },
      { name: 'blush', bg: '#f4f1ea', category: 'classic', colors: ['#275a15', '#a16448', '#d47b6d', '#ff8a8b', '#ce4e4b', '#afca97'] },
      { name: 'orchid', bg: '#e8e6e1', category: 'classic', colors: ['#1d4a83', '#c1585d', '#86aac4', '#e4948b', '#427ba6', '#a8c7db'] },

      // 2. THE BRIGHTS (Stark backgrounds with vibrant hues and deep, heavy anchor inks)
      { name: 'marine', bg: '#f0f2f5', category: 'bright', colors: ['#239de0', '#027fd3', '#5bbcf3', '#11151c', '#7acdf5', '#0a5fa0'] },
      { name: 'amethyst', bg: '#fdfcfb', category: 'bright', colors: ['#a259ff', '#883fe8', '#661ed9', '#150921', '#cda1ee', '#7a30cc'] },
      { name: 'spruce', bg: '#fdfcfb', category: 'bright', colors: ['#57c7af', '#228e74', '#44aa94', '#0a1a15', '#6dd4be', '#1a7060'] },
      { name: 'ocean', bg: '#f0f2f5', category: 'bright', colors: ['#05111c', '#355772', '#64808e', '#adc3ce', '#91acb7', '#1e4060'] },
      { name: 'crimson', bg: '#fdfcfb', category: 'bright', colors: ['#b50e08', '#c94040', '#de7070', '#1c0808', '#a01010', '#801010'] },

      stackShapes.forEach(shape => {
        getAllowedOffsets(shape).forEach(x => {
          const minY = Math.max(0, firstEmpty.y - (shape.height - 1));
          const maxY = Math.min(firstEmpty.y, targetHeight - shape.height);
          for (let y = minY; y <= maxY; y += 1) {
            if (!placementCoversCell(shape, x, y, firstEmpty.x, firstEmpty.y)) continue;
            if (!canPlaceShape(grid, shape, x, y)) continue;
            const weight = stackShapeWeights.get(shape.id) || 1;
            for (let count = 0; count < weight; count += 1) {
              placements.push({ shape, x, y });
            }
          }
        });
      });
      return shuffle(placements);
    }

    function solveStackForHeight(targetHeight, targetBlocks) {
      const stackShapes = BASE_STACK_SHAPES.filter(shape => STRICT_SHAPE_IDS.has(shape.id));
      // Weights bias the solver toward taller, more structural shapes.
      // Higher weight = shape appears more times in the shuffled candidate list = chosen more often.
      const curatedWeights = { 'O-4': 6, 'I-4-R0': 6, 'I-3-R0': 5, 'I-2-R90': 4, 'I-2-R0': 3, 'O-1': 1 };
      const stackShapeWeights = new Map(stackShapes.map(shape => [shape.id, curatedWeights[shape.id] || 1]));

      const minBlocksPerUnit = Math.min(...stackShapes.map(shape => shape.blocks / shape.units));
      const maxBlocksPerUnit = Math.max(...stackShapes.map(shape => shape.blocks / shape.units));

      const grid = createGrid(targetHeight);
      const solutions = [];
      const fallbackSolutions = [];

      searchStack(grid, targetHeight, targetBlocks, 0, [], solutions, fallbackSolutions, stackShapes, stackShapeWeights, minBlocksPerUnit, maxBlocksPerUnit);

      const finalSolutions = solutions.length > 0 ? solutions : fallbackSolutions;
      if (finalSolutions.length) {
        return pick(finalSolutions);
      }
      return null;
    }

    // Pre-flight validation: test every candidate height by actually running the solver.
    // Only heights where the solver finds at least one valid solution are included.
    // This replaces the old hardcoded '- 3' floor with a proved-valid set, and correctly
    // handles any height that is geometrically impossible regardless of available area.
    function computeValidHeights(targetBlocks) {
      const validHeights = [];
      for (let h = MAX_STACK_HEIGHT_UNITS; h >= 1; h--) {
        if (solveStackForHeight(h, targetBlocks) !== null) validHeights.push(h);
      }
      return validHeights; // Descending order (tallest first), matching original POSSIBLE_HEIGHTS shape.
    }
    let POSSIBLE_HEIGHTS = computeValidHeights(DEFAULT_LIMIT);


    function generateStack(params) {
      let currentSeed = params.seed;
      let palette;
      let activeProfile;
      let solution;
      let heightUnits;

      const isForcedSeed = !!currentSeed;
      let attempts = 0;

      // Defensive defaults to prevent undefined errors when mapping parameters
      const allowedPalettes = params.allowedPalettes || [];
      const allowedProfiles = params.allowedProfiles || [];
      const allowedHeights = params.allowedHeights || [];

      while (true) {
        attempts++;
        if (attempts > 15000) {
          console.error("Failsafe triggered: Could not find a valid stack matching these specific constraints.");
          return null;
        }

        if (!isForcedSeed) {
          currentSeed = generateRandomSeed();
        }
        setSeed(currentSeed);

        // 1. Pick Palette natively from the PRNG
        palette = pick(PALETTES);
        if (!isForcedSeed && allowedPalettes.length > 0 && !allowedPalettes.includes(palette.name)) continue;

        // 2. Pick Profile natively from the PRNG
        const profileMode = nextRandom();
        if (profileMode < 0.35) activeProfile = 'isolate';
        else if (profileMode < 0.70) activeProfile = 'drift';
        else activeProfile = 'spectrum';

        if (!isForcedSeed && allowedProfiles.length > 0 && !allowedProfiles.includes(activeProfile)) continue;

        // 3. Pick Height natively from the PRNG
        heightUnits = pick(POSSIBLE_HEIGHTS);
        if (!isForcedSeed && allowedHeights.length > 0 && !allowedHeights.includes(heightUnits)) continue;

        // 4. Attempt to mathematically solve the structure with the current PRNG seed
        const placements = solveStackForHeight(heightUnits, params.blockLimit);
        if (!placements) {
          if (isForcedSeed) return null; // If a shared URL seed is mathematically broken, abort cleanly
          continue;
        }

        solution = { placements, heightUnits };
        break; // We found a naturally occurring seed that matches every constraint!
      }

      // --- Biased Deck & Coloring Logic ---
      const colorWeights = new Array(palette.colors.length).fill(0);
      let activeIndices = shuffle([...Array(palette.colors.length).keys()]);
      const numShapes = solution.placements.length;

      if (activeProfile === 'isolate') {
        const keepCount = (numShapes <= 6) ? 2 : (nextRandom() > 0.5 ? 2 : 3);
        if (keepCount === 2) {
          colorWeights[activeIndices[0]] = 10;
          colorWeights[activeIndices[1]] = 10;
        } else {
          colorWeights[activeIndices[0]] = 10;
          colorWeights[activeIndices[1]] = 5;
          colorWeights[activeIndices[2]] = 2;
        }
      } else if (activeProfile === 'drift') {
        const keepCount = nextRandom() > 0.5 ? 4 : 5;
        for (let i = 0; i < keepCount; i++) {
          colorWeights[activeIndices[i]] = keepCount - i + 1;
        }
      } else {
        for (let i = 0; i < palette.colors.length; i++) {
          colorWeights[i] = 1;
        }
      }

      const buildBiasedDeck = () => {
        let deck = [];
        palette.colors.forEach((c, i) => {
          for (let j = 0; j < colorWeights[i]; j++) deck.push(c);
        });
        return shuffle(deck);
      };

      const colorGrid = Array.from({ length: heightUnits }, () => [null, null]);
      const placementsWithShapes = solution.placements
        .map(p => ({ ...p, shape: SHAPE_CATALOG[p.id] }))
        .sort((a, b) => a.y - b.y || a.x - b.x || a.id.localeCompare(b.id));

      let colorDeck = buildBiasedDeck();

      const placementsWithColors = placementsWithShapes.map(p => {
        const neighborColors = new Set();
        const enforceAdjacency = nextRandom() > 0.25;

        if (enforceAdjacency) {
          p.shape.cells.forEach(cell => {
            const gridX = p.x + cell.x;
            const gridY = p.y + cell.y;

            if (gridY + 1 < heightUnits && colorGrid[gridY + 1][gridX]) neighborColors.add(colorGrid[gridY + 1][gridX]);
            if (gridY - 1 >= 0 && colorGrid[gridY - 1][gridX]) neighborColors.add(colorGrid[gridY - 1][gridX]);
            if (gridX - 1 >= 0 && colorGrid[gridY][gridX - 1]) neighborColors.add(colorGrid[gridY][gridX - 1]);
            if (gridX + 1 < 2 && colorGrid[gridY][gridX + 1]) neighborColors.add(colorGrid[gridY][gridX + 1]);
          });
        }

        let validColors = colorDeck.filter(c => !neighborColors.has(c));

        if (validColors.length === 0) {
          colorDeck = buildBiasedDeck();
          validColors = colorDeck.filter(c => !neighborColors.has(c));

          if (validColors.length === 0) {
            validColors = palette.colors.filter(c => !neighborColors.has(c));
          }
          if (validColors.length === 0) {
            validColors = palette.colors;
          }
        }

        const color = validColors[0];
        const deckIndex = colorDeck.indexOf(color);
        if (deckIndex > -1) colorDeck.splice(deckIndex, 1);

        p.shape.cells.forEach(cell => {
          colorGrid[p.y + cell.y][p.x + cell.x] = color;
        });

        return { ...p, color };
      });

      return {
        placements: placementsWithColors,
        heightUnits,
        palette,
        activeProfile,
        seed: currentSeed
      };
    }

    // --- URL STATE SYNCING ---
    function normalizeSeed(value) {
      if (typeof value !== 'string') return null;
      const normalized = value.trim().toUpperCase();
      return /^[A-Z0-9]{6}$/.test(normalized) ? normalized : null;
    }

    function parseCommaList(value) {
      if (typeof value !== 'string') return [];
      return value.split(',').map(item => item.trim()).filter(Boolean);
    }

    function parseHeightsParam(value) {
      if (typeof value !== 'string' || value.trim() === '') {
        return { heightMode: 'multi', selectedHeights: new Set(), rangeStart: null, rangeEnd: null };
      }

      if (value.includes('-')) {
        const [startRaw, endRaw] = value.split('-', 2);
        const start = Number.parseInt(startRaw, 10);
        const end = Number.parseInt(endRaw, 10);
        if (!Number.isFinite(start) || !Number.isFinite(end)) {
          return { heightMode: 'multi', selectedHeights: new Set(), rangeStart: null, rangeEnd: null };
        }
        return { heightMode: 'range', selectedHeights: new Set(), rangeStart: start, rangeEnd: end };
      }

      const parsedHeights = parseCommaList(value)
        .map(item => Number.parseInt(item, 10))
        .filter(height => Number.isFinite(height));
      return {
        heightMode: 'multi',
        selectedHeights: new Set(parsedHeights),
        rangeStart: null,
        rangeEnd: null
      };
    }

    function sanitizeHeightState() {
      const validHeightSet = new Set(POSSIBLE_HEIGHTS);
      const sanitizedHeights = [...appState.selectedHeights].filter(height => validHeightSet.has(height));
      let wasChanged = sanitizedHeights.length !== appState.selectedHeights.size;

      if (appState.heightMode === 'range') {
        const selectedRangeHeights = sanitizedHeights.slice().sort((a, b) => a - b);

        if (selectedRangeHeights.length > 0) {
          const nextStart = selectedRangeHeights[0];
          const nextEnd = selectedRangeHeights[selectedRangeHeights.length - 1];
          if (appState.rangeStart !== nextStart || appState.rangeEnd !== nextEnd) wasChanged = true;
          appState.rangeStart = nextStart;
          appState.rangeEnd = nextEnd === nextStart ? null : nextEnd;
          appState.selectedHeights = new Set(selectedRangeHeights);
        } else if (appState.rangeStart !== null || appState.rangeEnd !== null || appState.selectedHeights.size > 0) {
          appState.rangeStart = null;
          appState.rangeEnd = null;
          appState.selectedHeights = new Set();
          wasChanged = true;
        } else {
          appState.selectedHeights = new Set();
        }
      } else {
        if (appState.rangeStart !== null || appState.rangeEnd !== null) wasChanged = true;
        appState.rangeStart = null;
        appState.rangeEnd = null;
        appState.selectedHeights = new Set(sanitizedHeights.sort((a, b) => a - b));
      }

      return wasChanged;
    }

    // --- STATE MODULE ---
    const State = {
      refreshValidHeights() {
        POSSIBLE_HEIGHTS = computeValidHeights(appState.targetBlocks);
        return POSSIBLE_HEIGHTS;
      },

      sanitizeHeights() {
        return sanitizeHeightState();
      },

      clearSeed() {
        appState.seed = null;
      },

      setSeed(seed) {
        appState.seed = seed;
      },

      setTargetBlocks(value) {
        appState.targetBlocks = clampToAllowedLimit(value);
        this.clearSeed();
        this.refreshValidHeights();
        this.sanitizeHeights();
        return appState.targetBlocks;
      },

      setRenderFlag(flag, value) {
        appState[flag] = value;
      },

      setHeightMode(mode) {
        appState.heightMode = mode;
        if (mode === 'range') {
          const selectedHeights = Array.from(appState.selectedHeights).sort((a, b) => a - b);
          if (selectedHeights.length > 0) {
            appState.rangeStart = selectedHeights[0];
            appState.rangeEnd = selectedHeights[selectedHeights.length - 1];
            const min = Math.min(appState.rangeStart, appState.rangeEnd);
            const max = Math.max(appState.rangeStart, appState.rangeEnd);
            appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(height => height >= min && height <= max));
          } else {
            appState.rangeStart = null;
            appState.rangeEnd = null;
          }
        } else {
          appState.rangeStart = null;
          appState.rangeEnd = null;
        }
        this.sanitizeHeights();
      },

      toggleHeightSelection(height) {
        if (appState.heightMode === 'multi') {
          if (appState.selectedHeights.has(height)) appState.selectedHeights.delete(height);
          else appState.selectedHeights.add(height);
          return;
        }

        if (appState.rangeStart === null || (appState.rangeStart !== null && appState.rangeEnd !== null)) {
          appState.rangeStart = height;
          appState.rangeEnd = null;
          appState.selectedHeights = new Set([height]);
          return;
        }

        appState.rangeEnd = height;
        const min = Math.min(appState.rangeStart, appState.rangeEnd);
        const max = Math.max(appState.rangeStart, appState.rangeEnd);
        appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(value => value >= min && value <= max));
      },

      resetFiltersAndView() {
        appState.heightMode = 'multi';
        appState.selectedHeights.clear();
        appState.rangeStart = null;
        appState.rangeEnd = null;
        appState.showOutline = true;
        appState.showMetadata = true;
        appState.showExport = true;
        this.clearSeed();
      },

      syncFromDOM() {
        appState.selectedPalettes = [...document.querySelectorAll('#palette-filter-list input:checked')].map(input => input.value);
        appState.selectedProfiles = [...document.querySelectorAll('#profile-filter-list input:checked')].map(input => input.value);
        appState.showOutline = document.getElementById('toggle-outline')?.checked ?? true;
        appState.showMetadata = document.getElementById('toggle-metadata')?.checked ?? true;
        appState.showExport = document.getElementById('toggle-export')?.checked ?? true;
      },

      applyToDOM() {
        document.querySelectorAll('#palette-filter-list input[type="checkbox"]').forEach(checkbox => {
          checkbox.checked = appState.selectedPalettes.includes(checkbox.value);
        });
        document.querySelectorAll('#profile-filter-list input[type="checkbox"]').forEach(checkbox => {
          checkbox.checked = appState.selectedProfiles.includes(checkbox.value);
        });

        const rangeToggleEl = document.getElementById('toggle-range-mode');
        if (rangeToggleEl) rangeToggleEl.checked = (appState.heightMode === 'range');

        const outlineEl = document.getElementById('toggle-outline');
        if (outlineEl) outlineEl.checked = appState.showOutline;

        const metadataEl = document.getElementById('toggle-metadata');
        if (metadataEl) metadataEl.checked = appState.showMetadata;

        const exportEl = document.getElementById('toggle-export');
        if (exportEl) exportEl.checked = appState.showExport;

        Render.renderHeightFilter();
      },

      buildGenerationParams() {
        return {
          allowedPalettes: appState.selectedPalettes || [],
          allowedProfiles: appState.selectedProfiles || [],
          allowedHeights: Array.from(appState.selectedHeights),
          seed: appState.seed,
          blockLimit: appState.targetBlocks
        };
      },

      parseURL() {
        const params = new URLSearchParams(window.location.search);

        appState.seed = normalizeSeed(params.get('seed'));
        appState.selectedPalettes = parseCommaList(params.get('palettes')).filter(name => VALID_PALETTE_NAMES.has(name));
        appState.selectedProfiles = parseCommaList(params.get('profiles')).filter(profile => VALID_PROFILE_IDS.has(profile));

        appState.showOutline = params.has('outline') ? params.get('outline') !== 'false' : true;
        appState.showMetadata = params.has('meta') ? params.get('meta') !== 'false' : true;
        appState.showExport = params.has('export') ? params.get('export') !== 'false' : true;

        if (params.has('limit')) {
          appState.targetBlocks = clampToAllowedLimit(parseInt(params.get('limit'), 10));
          appState.isLimitVisible = true;
        } else {
          appState.targetBlocks = DEFAULT_LIMIT;
          appState.isLimitVisible = false;
        }

        this.refreshValidHeights();

        const parsedHeights = parseHeightsParam(params.get('heights'));
        appState.heightMode = parsedHeights.heightMode;
        appState.selectedHeights = parsedHeights.selectedHeights;
        appState.rangeStart = parsedHeights.rangeStart;
        appState.rangeEnd = parsedHeights.rangeEnd;

        if (appState.heightMode === 'range' && appState.rangeStart !== null) {
          const min = appState.rangeEnd === null ? appState.rangeStart : Math.min(appState.rangeStart, appState.rangeEnd);
          const max = appState.rangeEnd === null ? appState.rangeStart : Math.max(appState.rangeStart, appState.rangeEnd);
          appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(height => height >= min && height <= max));
        }

        this.sanitizeHeights();
      },

      syncURL() {
        const url = new URL(window.location);
        const searchParams = url.searchParams;

        searchParams.delete('seed');
        searchParams.delete('palettes');
        searchParams.delete('profiles');
        searchParams.delete('heights');
        searchParams.delete('limit');
        searchParams.delete('outline');
        searchParams.delete('meta');
        searchParams.delete('export');

        if (appState.selectedPalettes.length) searchParams.set('palettes', appState.selectedPalettes.join(','));
        if (appState.selectedProfiles.length) searchParams.set('profiles', appState.selectedProfiles.join(','));

        if (appState.selectedHeights.size > 0) {
          if (appState.heightMode === 'range' && appState.rangeStart !== null && appState.rangeEnd !== null) {
            const min = Math.min(appState.rangeStart, appState.rangeEnd);
            const max = Math.max(appState.rangeStart, appState.rangeEnd);
            searchParams.set('heights', `${min}-${max}`);
          } else {
            searchParams.set('heights', Array.from(appState.selectedHeights).sort((a, b) => a - b).join(','));
          }
        }

        if (appState.isLimitVisible) searchParams.set('limit', appState.targetBlocks);
        if (!appState.showOutline) searchParams.set('outline', 'false');
        if (!appState.showMetadata) searchParams.set('meta', 'false');
        if (!appState.showExport) searchParams.set('export', 'false');
        if (appState.seed) searchParams.set('seed', appState.seed);

        const searchString = searchParams.toString().replace(/%2C/g, ',');
        appState.shareUrl = url.origin + url.pathname + (searchString ? `?${searchString}` : '');

        try {
          window.history.replaceState(null, '', appState.shareUrl);
        } catch (error) {
          console.warn('Could not update URL history state in this environment.', error);
        }
      },

      triggerGeneration() {
        this.syncFromDOM();
        let didMutateHeightState = this.sanitizeHeights();
        let wasSeedForced = !!appState.seed;

        let params = this.buildGenerationParams();
        let newArtwork = generateStack(params);

        if (!newArtwork && appState.seed) {
          this.clearSeed();
          wasSeedForced = false;
          params = this.buildGenerationParams();
          newArtwork = generateStack(params);
        }

        if (!newArtwork && appState.selectedHeights.size > 0) {
          appState.selectedHeights.clear();
          appState.rangeStart = null;
          appState.rangeEnd = null;
          didMutateHeightState = this.sanitizeHeights() || didMutateHeightState;
          params = this.buildGenerationParams();
          newArtwork = generateStack(params);
        }

        if (newArtwork) {
          appState.artwork = newArtwork;

          if (!wasSeedForced && appState.selectedPalettes.length === 0) {
            appState.showOutline = !(newArtwork.palette.category === 'muted' || newArtwork.palette.category === 'void');
            const outlineEl = document.getElementById('toggle-outline');
            if (outlineEl) outlineEl.checked = appState.showOutline;
          }

          appState.seed = newArtwork.seed;
          if (didMutateHeightState) Render.renderHeightFilter();
          Render.render();
          this.syncURL();
          return;
        }

        if (didMutateHeightState) Render.renderHeightFilter();
        this.syncURL();
      }
    };

    // --- RENDER MODULE ---
    const Render = {
      buildDotStrip(container, colors) {
        if (!container) return;
        container.innerHTML = '';
        colors.forEach((color, index) => {
          const dot = document.createElement('div');
          dot.className = 'dot';
          dot.style.background = color;
          if (index === 0) dot.title = 'background';
          container.appendChild(dot);
        });
      },

      renderArtwork() {
        if (!appState.artwork) return;
        const { placements, heightUnits, palette } = appState.artwork;
        const svg = document.getElementById('svg-out');
        svg.innerHTML = '';

        const stackHeightPx = (heightUnits * CELL_STEP) + BORDER_WIDTH;
        const offsetX = Math.round((CANVAS_SIZE - COLUMN_WIDTH) / 2);
        const offsetY = Math.round((CANVAS_SIZE - stackHeightPx) / 2);

        svg.setAttribute('viewBox', `0 0 ${CANVAS_SIZE} ${CANVAS_SIZE}`);
        svg.setAttribute('width', CANVAS_SIZE);
        svg.setAttribute('height', CANVAS_SIZE);

        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('width', CANVAS_SIZE);
        bg.setAttribute('height', CANVAS_SIZE);
        bg.setAttribute('fill', palette.bg);
        svg.appendChild(bg);

        placements.forEach(placement => {
          const shape = SHAPE_CATALOG[placement.id];
          const occupied = new Set(shape.cells.map(cell => `${cell.x},${cell.y}`));

          shape.cells.forEach(cell => {
            const cellX = offsetX + ((placement.x + cell.x) * CELL_STEP);
            const gridY = placement.y + cell.y;
            const cellY = offsetY + ((heightUnits - 1 - gridY) * CELL_STEP);
            const insetLeft = occupied.has(`${cell.x - 1},${cell.y}`) ? 0 : BORDER_WIDTH;
            const insetRight = occupied.has(`${cell.x + 1},${cell.y}`) ? 0 : BORDER_WIDTH;
            const insetTop = occupied.has(`${cell.x},${cell.y + 1}`) ? 0 : BORDER_WIDTH;
            const insetBottom = occupied.has(`${cell.x},${cell.y - 1}`) ? 0 : BORDER_WIDTH;
            const effectiveGapColor = appState.showOutline ? INK_COLOR : palette.bg;

            addRect(svg, cellX, cellY, CELL_SIZE, CELL_SIZE, effectiveGapColor);
            addRect(
              svg,
              cellX + insetLeft,
              cellY + insetTop,
              CELL_SIZE - insetLeft - insetRight,
              CELL_SIZE - insetTop - insetBottom,
              placement.color
            );
          });
        });
      },

      renderMetadata() {
        if (!appState.artwork) return;
        const { placements, heightUnits, palette, activeProfile } = appState.artwork;
        const lightBg = isLight(palette.bg);
        const baseRGB = lightBg ? '28, 28, 26' : '240, 238, 232';
        const root = document.documentElement;
        root.style.setProperty('--ui-bg', palette.bg);
        root.style.setProperty('--ui-ink', `rgba(${baseRGB}, 0.9)`);
        root.style.setProperty('--ui-ink-muted', `rgba(${baseRGB}, 0.5)`);
        root.style.setProperty('--ui-rule', `rgba(${baseRGB}, 0.1)`);

        document.getElementById('metadata-overlay')?.classList.toggle('is-hidden', !appState.showMetadata);
        document.getElementById('export-overlay')?.classList.toggle('is-hidden', !appState.showExport);
        document.getElementById('metadata-limit-stat')?.classList.toggle('is-hidden', !appState.isLimitVisible);
        document.getElementById('params-limit-section')?.classList.toggle('is-hidden', !appState.isLimitVisible);

        const seedDisplayEl = document.getElementById('seed-display');
        if (seedDisplayEl) seedDisplayEl.textContent = appState.seed;

        const shapeCountEl = document.getElementById('shape-count');
        if (shapeCountEl) shapeCountEl.textContent = placements.length;

        const stackHeightEl = document.getElementById('stack-height');
        if (stackHeightEl) stackHeightEl.textContent = heightUnits;

        const paletteNameEl = document.getElementById('palette-name');
        if (paletteNameEl) paletteNameEl.textContent = palette.name;

        const profileNameEl = document.getElementById('profile-name');
        if (profileNameEl) profileNameEl.textContent = activeProfile;

        const limitDisplayEl = document.getElementById('limit-display');
        if (limitDisplayEl) limitDisplayEl.textContent = appState.targetBlocks;

        const usedColors = new Set(placements.map(placement => placement.color));
        const sortedUsedColors = palette.colors.filter(color => usedColors.has(color));
        this.buildDotStrip(document.getElementById('actual-palette-dots'), [palette.bg, ...sortedUsedColors]);
        this.buildDotStrip(document.getElementById('palette-dots'), [palette.bg, ...palette.colors]);

        const shapesList = document.getElementById('shapes-list');
        if (!shapesList) return;

        shapesList.innerHTML = '';
        const counts = placements.reduce((acc, placement) => {
          const piece = SHAPE_CATALOG[placement.id].piece;
          acc[piece] = (acc[piece] || 0) + 1;
          return acc;
        }, {});

        FAMILY_ORDER.filter(piece => counts[piece]).forEach(piece => {
          const stat = document.createElement('div');
          stat.className = 'stat';
          stat.innerHTML = `<span class="stat-label">${piece}</span><span class="stat-value">${counts[piece]}</span>`;
          shapesList.appendChild(stat);
        });
      },

      render() {
        if (!appState.artwork) return;
        this.renderArtwork();
        this.renderMetadata();
      },

      renderLimitSlider() {
      const container = document.getElementById('limit-slider-container');
      if (!container) return;
      container.innerHTML = '';

      const slider = document.createElement('div');
      slider.className = 'limit-slider';
      
      const track = document.createElement('div');
      track.className = 'limit-slider-track';
      
      const thumb = document.createElement('div');
      thumb.className = 'limit-slider-thumb';
      thumb.innerHTML = `<span>${appState.targetBlocks}</span>`;
      
      slider.appendChild(track);
      slider.appendChild(thumb);
      container.appendChild(slider);

      const sortedLimits = getSortedLimits();
      function updateThumbPos(val) {
        const normalizedVal = clampToAllowedLimit(val);
        const valueIndex = sortedLimits.indexOf(normalizedVal);
        const percent = sortedLimits.length > 1 ? valueIndex / (sortedLimits.length - 1) : 0;
        const sliderWidth = slider.offsetWidth;
        const thumbWidth = thumb.offsetWidth;
        // The thumb slides from 0 to (sliderWidth - thumbWidth)
        const maxScroll = Math.max(0, sliderWidth - thumbWidth);
        thumb.style.transform = `translateX(${percent * maxScroll}px)`;
        thumb.querySelector('span').textContent = normalizedVal;
      }

      // Initial pos
      requestAnimationFrame(() => updateThumbPos(appState.targetBlocks));

      let isDragging = false;

      function valFromX(clientX) {
        const rect = slider.getBoundingClientRect();
        const thumbWidth = thumb.offsetWidth;
        const maxScroll = Math.max(0, rect.width - thumbWidth);
        if (maxScroll === 0) return appState.targetBlocks;
        const relativeX = Math.max(0, Math.min(maxScroll, clientX - rect.left - (thumbWidth / 2)));
        const percent = relativeX / maxScroll;
        const index = Math.round(percent * (sortedLimits.length - 1));
        return sortedLimits[Math.max(0, Math.min(sortedLimits.length - 1, index))];
      }

      function onPointerDown(e) {
        const isThumb = e.target.closest('.limit-slider-thumb');
        if (isThumb) {
          isDragging = true;
          thumb.classList.add('is-dragging');
          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
        } else {
          // Stepper behavior: jump to next/prev if clicking track
          const rect = thumb.getBoundingClientRect();
          const clickX = e.clientX;
          const currentIndex = sortedLimits.indexOf(clampToAllowedLimit(appState.targetBlocks));
          let newVal = appState.targetBlocks;
          if (clickX < rect.left) {
            newVal = sortedLimits[Math.max(0, currentIndex - 1)];
          } else if (clickX > rect.right) {
            newVal = sortedLimits[Math.min(sortedLimits.length - 1, currentIndex + 1)];
          }
          if (newVal !== appState.targetBlocks) {
            updateLimit(newVal);
          }
        }
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const newVal = valFromX(e.clientX);
        if (newVal !== appState.targetBlocks) {
          updateLimit(newVal);
        }
      }

      function onPointerUp() {
        isDragging = false;
        thumb.classList.remove('is-dragging');
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
      }

      function updateLimit(val) {
        State.setTargetBlocks(val);
        updateThumbPos(appState.targetBlocks);
        Render.renderHeightFilter();
        State.triggerGeneration();
      }

      slider.addEventListener('pointerdown', onPointerDown);
      // Ensure layout changes don't break position
      window.addEventListener('resize', () => updateThumbPos(appState.targetBlocks));
      },

      renderHeightFilter() {
      const hList = document.getElementById('height-filter-container');
      if (!hList) return;
      hList.innerHTML = '';

      POSSIBLE_HEIGHTS.slice().sort((a, b) => a - b).forEach(h => {
        const cell = document.createElement('div');
        cell.className = 'height-cell';

        // Styling purely references the single source of truth: selectedHeights
        if (appState.heightMode === 'multi') {
          if (appState.selectedHeights.has(h)) cell.classList.add('is-selected');
        } else {
          if (appState.selectedHeights.has(h)) {
            cell.classList.add('in-range');
            const min = appState.rangeEnd !== null ? Math.min(appState.rangeStart, appState.rangeEnd) : appState.rangeStart;
            const max = appState.rangeEnd !== null ? Math.max(appState.rangeStart, appState.rangeEnd) : appState.rangeStart;
            if (h === min) cell.classList.add('range-start');
            if (h === max) cell.classList.add('range-end');
          }
        }

        cell.innerHTML = `<span>${h}</span>`;

        // Click logic modifies the single source of truth: selectedHeights
        cell.addEventListener('click', () => {
          State.toggleHeightSelection(h);
          State.clearSeed();
          Render.renderHeightFilter();
          State.triggerGeneration();
        });

        hList.appendChild(cell);
      });
      }
    };

    // --- CONTROLS MODULE ---
    const Controls = {
      regenerateFromFilters() {
        State.clearSeed();
        State.triggerGeneration();
      },

      syncRenderFlag(flag, checked) {
        State.setRenderFlag(flag, checked);
        Render.render();
        State.syncURL();
      },

      bindParamsPanel() {
        const rangeToggle = document.getElementById('toggle-range-mode');
        if (rangeToggle) {
          rangeToggle.addEventListener('change', event => {
            State.setHeightMode(event.target.checked ? 'range' : 'multi');
            State.clearSeed();
            Render.renderHeightFilter();
            State.triggerGeneration();
          });
        }

        Render.renderLimitSlider();
        Render.renderHeightFilter();

        const paletteList = document.getElementById('palette-filter-list');
        const groupedPalettes = {};
        PALETTES.forEach(palette => {
          if (!groupedPalettes[palette.category]) groupedPalettes[palette.category] = [];
          groupedPalettes[palette.category].push(palette);
        });

        Object.keys(groupedPalettes).forEach(category => {
          const header = document.createElement('div');
          header.className = 'params-subsection-title';
          header.textContent = category;
          header.title = `Toggle all ${category} palettes`;

          const categoryInputs = [];
          header.addEventListener('click', () => {
            const allChecked = categoryInputs.every(input => input.checked);
            categoryInputs.forEach(input => { input.checked = !allChecked; });
            this.regenerateFromFilters();
          });

          paletteList.appendChild(header);
          groupedPalettes[category].forEach(palette => {
            const label = document.createElement('label');
            label.className = 'setting-item';
            label.innerHTML = `<input type="checkbox" value="${palette.name}"><code>${palette.name}</code>`;
            categoryInputs.push(label.querySelector('input'));
            paletteList.appendChild(label);
          });
        });

        paletteList.addEventListener('change', () => this.regenerateFromFilters());
        document.getElementById('profile-filter-list')?.addEventListener('change', () => this.regenerateFromFilters());

        document.getElementById('toggle-outline')?.addEventListener('change', event => {
          this.syncRenderFlag('showOutline', event.target.checked);
        });
        document.getElementById('toggle-metadata')?.addEventListener('change', event => {
          this.syncRenderFlag('showMetadata', event.target.checked);
        });
        document.getElementById('toggle-export')?.addEventListener('change', event => {
          this.syncRenderFlag('showExport', event.target.checked);
        });

        document.getElementById('select-none-btn')?.addEventListener('click', () => {
          document.querySelectorAll('#profile-filter-list input, #palette-filter-list input').forEach(input => {
            input.checked = false;
          });

          const outlineEl = document.getElementById('toggle-outline');
          if (outlineEl) outlineEl.checked = true;

          const metadataEl = document.getElementById('toggle-metadata');
          if (metadataEl) metadataEl.checked = true;

          const exportEl = document.getElementById('toggle-export');
          if (exportEl) exportEl.checked = true;

          const rangeToggleEl = document.getElementById('toggle-range-mode');
          if (rangeToggleEl) rangeToggleEl.checked = false;

          State.resetFiltersAndView();
          Render.renderHeightFilter();
          State.triggerGeneration();
        });
      },

      bindGlobalControls() {
        document.getElementById('panel-shuffle-btn')?.addEventListener('click', () => this.regenerateFromFilters());
        document.getElementById('download-png-btn')?.addEventListener('click', () => ExportActions.downloadPNG());
        document.getElementById('download-svg-btn')?.addEventListener('click', () => ExportActions.downloadSVG());

        document.getElementById('seed-display')?.addEventListener('click', () => {
          if (!appState.seed) return;
          const url = appState.shareUrl || window.location.href;
          const display = document.getElementById('seed-display');
          const original = display.textContent;

          const showCopied = () => {
            display.innerHTML = '<span style="color: var(--ui-ink-muted);">COPIED</span>';
            setTimeout(() => {
              display.textContent = appState.seed === original ? original : appState.seed;
            }, 1500);
          };

          if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(url).then(showCopied).catch(() => {
              console.warn('Clipboard write failed.');
            });
            return;
          }

          const tempInput = document.createElement('input');
          tempInput.value = url;
          document.body.appendChild(tempInput);
          tempInput.select();
          document.execCommand('copy');
          document.body.removeChild(tempInput);
          showCopied();
        });
      },

      bindShortcuts() {
        document.addEventListener('keydown', event => {
          if (event.target.tagName === 'INPUT' || event.metaKey || event.ctrlKey) return;
          const key = event.key.toLowerCase();

          if (key === 'r') this.regenerateFromFilters();

          if (key === 'i') {
            const paramsPanel = document.getElementById('params-panel');
            const isHiding = !paramsPanel.classList.contains('is-hidden');

            if (isHiding) {
              ['metadata-overlay', 'logo-overlay', 'export-overlay', 'params-panel'].forEach(id => {
                document.getElementById(id)?.classList.add('is-hidden');
              });
            } else {
              paramsPanel.classList.remove('is-hidden');
              document.getElementById('logo-overlay')?.classList.remove('is-hidden');
              document.getElementById('metadata-overlay')?.classList.toggle('is-hidden', !appState.showMetadata);
              document.getElementById('export-overlay')?.classList.toggle('is-hidden', !appState.showExport);
            }
          }

          if (key === 'p') ExportActions.downloadPNG();
          if (key === 's') ExportActions.downloadSVG();
        });
      }
    };

    // --- EXPORT MODULE ---
    const ExportActions = {
      getSVGString() {
        const svg = document.getElementById('svg-out');
        const clone = svg.cloneNode(true);
        clone.setAttribute('width', CANVAS_SIZE);
        clone.setAttribute('height', CANVAS_SIZE);
        if (!clone.getAttribute('xmlns')) clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        return new XMLSerializer().serializeToString(clone);
      },

      triggerDownload(dataUrl, fileName) {
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = fileName;
        link.click();
        if (dataUrl.startsWith('blob:')) {
          setTimeout(() => URL.revokeObjectURL(dataUrl), 100);
        }
      },

      downloadSVG() {
        const blob = new Blob([this.getSVGString()], { type: 'image/svg+xml;charset=utf-8' });
        this.triggerDownload(URL.createObjectURL(blob), '4x4rt-stacks.svg');
      },

      async downloadPNG() {
        const scale = 2;
        const url = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(this.getSVGString())}`;

        try {
          const img = await new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = reject;
            image.src = url;
          });

          const canvas = document.createElement('canvas');
          canvas.width = CANVAS_SIZE * scale;
          canvas.height = CANVAS_SIZE * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          this.triggerDownload(canvas.toDataURL('image/png'), '4x4rt-stacks.png');
        } catch (error) {
          console.error('PNG download failed', error);
        }
      }
    };

    // --- INIT SEQUENCE ---
    Controls.bindGlobalControls();
    State.parseURL();
    Controls.bindParamsPanel();
    Controls.bindShortcuts();
    State.applyToDOM();
    State.triggerGeneration();
  </script>
</body>

</html>
