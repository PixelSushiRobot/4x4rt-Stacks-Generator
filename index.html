<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4x4rt Stacks Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & SCOPE MODIFIERS
       ========================================================================== */
    :root {
      --page-pad-x: 64px;
      --page-pad-y: 20px;
      --sidebar-width: 365px;
      --active-sidebar-width: var(--sidebar-width);
      --content-width: calc(100vw - var(--active-sidebar-width));
      --poster-metadata-ratio: 0.17;
      --canvas-size: min(calc(100vh - (var(--page-pad-y) * 2)), calc(var(--content-width) - (var(--page-pad-x) * 2)));
      /* 1:1 default: artwork width tracks the fitted square dimension. (Was hardcoded to
         1000px, which broke the aspect ratio on wide/short viewports — width stuck at 1000
         while height shrank to fit, producing a wide rectangle.) The 9:16 override below
         recomputes this for portrait. */
      --artwork-width: var(--canvas-size);
      /* 9:16 metadata band: 4 stacked rows of (79/576) of --artwork-width each = 316/576 of
         --artwork-width total. Top-down like --poster-metadata-height above — one variable
         for the whole band, individual rows split it via flex-grow (see #poster-metadata-9x16
         below) instead of each computing its own height. JS reads this same ratio (combined
         with the 0.5625 artwork-width factor) for its canvas-size budget reservation, so
         there's one source of truth for the band's true proportions instead of two numbers
         that have to be kept in sync by hand. */
      --poster-metadata-ratio-9x16: calc(316 / 576);
      --poster-metadata-height-9x16: calc(var(--artwork-width) * var(--poster-metadata-ratio-9x16));
      /* Modular Scale System */
      --scale-unit: calc(var(--canvas-size) * 0.001);
      --sz-01: calc(var(--scale-unit) * 1);
      --sz-02: calc(var(--scale-unit) * 2);
      --sz-05: calc(var(--scale-unit) * 5);
      --sz-07: calc(var(--scale-unit) * 7);
      --sz-08: calc(var(--scale-unit) * 8);
      --sz-10: calc(var(--scale-unit) * 10);
      --sz-15: calc(var(--scale-unit) * 15);
      --sz-16: calc(var(--scale-unit) * 16);
      --sz-18: calc(var(--scale-unit) * 18);
      --sz-20: calc(var(--scale-unit) * 20);
      --sz-25: calc(var(--scale-unit) * 25);
      --sz-30: calc(var(--scale-unit) * 30);
      --sz-40: calc(var(--scale-unit) * 40);
      --sz-54: calc(var(--scale-unit) * 54);
      --sz-56: calc(var(--scale-unit) * 56);
      --sz-64: calc(var(--scale-unit) * 64);
      --sz-90: calc(var(--scale-unit) * 90);
      --sz-120: calc(var(--scale-unit) * 120);
      --sz-365: calc(var(--scale-unit) * 365);

      --rule-width: max(1px, var(--sz-01));
      /* Failsafe colors from Spice palette to avoid unstyled content on first paint */
      --ui-bg: #f4f1ea;
      --ui-ink: rgba(28, 28, 26, 0.9);
      --ui-ink-solid: rgb(28, 28, 26);
      --ui-ink-muted: rgba(28, 28, 26, 0.5);
      --ui-rule: rgba(28, 28, 26, 0.1);
      --ui-border-width: max(1px, var(--sz-02));
      --ui-text-size: var(--sz-15);
      --ui-brand-size: var(--sz-30);
      --poster-metadata-height: calc(var(--canvas-size) * var(--poster-metadata-ratio));
      --poster-total-height: calc(var(--canvas-size) + var(--poster-metadata-height) + (var(--ui-border-width) * 2));
    }

    :root[data-sidebar-state="hidden"] {
      --active-sidebar-width: 0px;
    }

    :root[data-aspect-ratio="9:16"] {
      --artwork-width: calc((var(--canvas-size) - var(--ui-border-width) * 2) * 0.5625 + var(--ui-border-width) * 2);
    }

    /* ==========================================================================
       2. BASE RESET
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
      color: inherit;
      font-size: inherit;
      line-height: 1;
    }

    button {
      background: transparent;
      border: none;
    }

    body {
      background: var(--ui-bg);
      color: var(--ui-ink);
      font-family: 'Space Mono', monospace;
      line-height: 1.45;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ==========================================================================
       3. CORE LAYOUT
       ========================================================================== */
    .l-app {
      position: relative;
      width: 100%;
      min-height: 100vh;
    }

    .l-canvas {
      position: fixed;
      inset: 0 var(--active-sidebar-width) 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--content-width);
      height: 100vh;
      padding: var(--page-pad-y) var(--page-pad-x);
    }

    .artwork-container:hover .sidebar-toggle {
      display: flex;
    }

    .l-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: var(--sidebar-width);
      height: 100vh;
      min-height: 100vh;
      max-height: 100vh;
      padding: 0;
      margin-left: 0;
      background: var(--ui-bg);
      border-left: var(--rule-width) solid var(--ui-rule);
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* Pin the sidebar to the 1000px-canvas reference. NOTE: the global --sz-* tokens are
         declared on :root, so their var(--scale-unit) is substituted AT :root and inherited
         as already-computed lengths — overriding --scale-unit alone here does nothing. We
         must re-declare the --sz-* tokens against the fixed unit so they recompute in this
         subtree (1000 * 0.001 = 1px per unit → --sz-N = N px). Artwork/watermark keep the
         fluid :root scale. */
      --scale-unit: 1px;
      --sz-01: 1px;
      --sz-02: 2px;
      --sz-05: 5px;
      --sz-07: 7px;
      --sz-08: 8px;
      --sz-10: 10px;
      --sz-15: 15px;
      --sz-16: 16px;
      --sz-18: 18px;
      --sz-20: 20px;
      --sz-25: 25px;
      --sz-30: 30px;
      --sz-40: 40px;
      --sz-54: 54px;
      --sz-56: 56px;
      --sz-64: 64px;
      --sz-90: 90px;
      --sz-120: 120px;
      --sz-365: 365px;
      --rule-width: 1px;
      --ui-border-width: 2px;
      --ui-text-size: 15px;
      --ui-brand-size: 30px;
      font-size: var(--ui-text-size);
    }

    .l-sidebar[data-state="collapsed"] {
      display: none !important;
    }

    .sidebar-content {
      padding: var(--sz-20);
      padding-bottom: var(--sz-120);
      flex: 1;
      overflow-y: auto;
      overflow-anchor: none;
      /* don't let the browser auto-shift scroll on panel open/close */
    }

    .l-sidebar[data-state="collapsed"] .sidebar-content {
      display: none;
    }

    /* ==========================================================================
       4. SVG & CANVAS UTILITIES
       ========================================================================== */
    .artwork-container {
      position: relative;
      width: var(--artwork-width);
      height: var(--canvas-size);
      background: var(--ui-bg);
      border: var(--ui-border-width) solid var(--ui-ink-solid);
    }

    .artwork-stage {
      position: relative;
      width: 100%;
      height: 100%;
      flex: none;
    }

    .artwork-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    svg,
    path {
      shape-rendering: crispEdges;
    }

    .watermark {
      display: none;
      position: absolute;
      right: var(--sz-20);
      bottom: var(--sz-20);
      width: var(--sz-90);
      height: var(--sz-30);
      z-index: 3;
      pointer-events: none;
    }

    :root[data-layout="poster"] .watermark {
      display: block;
    }

    .watermark svg {
      display: block;
    }

    /* ==========================================================================
       5. SIDEBAR UI COMPONENTS
       ========================================================================== */
    .project-header {
      display: flex;
      flex-direction: column;
      gap: var(--sz-08);
      margin-bottom: var(--sz-40);
      font-size: var(--ui-brand-size);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .artist-name {
      color: var(--ui-ink-muted);
    }



    .project-description {
      font-size: var(--ui-text-size);
      line-height: 1.45;
    }

    .params-section {
      padding-top: var(--sz-40);
    }

    .params-section-title {
      font-size: var(--ui-text-size);
      text-transform: uppercase;
      color: var(--ui-ink);
      padding-bottom: calc(var(--canvas-size) * 0.01);
    }

    .control-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: var(--sz-10);
      width: 100%;
      min-height: var(--sz-56);
      padding: var(--sz-20) 0;
      border: none;
      border-bottom: var(--rule-width) solid var(--ui-rule);
      font-size: var(--ui-text-size);
      text-align: left;
      text-transform: uppercase;
      cursor: default;
    }

    .control-row:hover .icon {
      color: var(--ui-ink);
    }

    .control-row.u-hide-icon {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .control-row[data-interactive="true"] {
      cursor: pointer;
    }

    .control-row[data-interactive="true"]:hover {
      color: var(--ui-ink-muted);
    }

    .control-row[data-interactive="true"]:focus-visible {
      outline: none;
      border-bottom-color: var(--ui-ink-muted);
    }

    .control-label {
      color: var(--ui-ink-muted);
    }

    .control-value {
      justify-self: end;
      white-space: nowrap;
      color: var(--ui-ink);
    }

    .control-suffix {
      color: var(--ui-ink-muted);
    }

    .options-panel {
      display: none;
      margin: 0;
      padding: 0;
      background: var(--ui-rule);
      border-radius: var(--sz-20);
      color: var(--ui-ink);
      font-size: var(--ui-text-size);
      line-height: 1.45;
    }

    .options-panel[data-state="open"] {
      display: block;
      /* Panel fill hugs its rows; the 20px gap below is spacing before the divider that
         precedes the next section. The divider itself is drawn by the next section's
         trigger row (border-top rule below), so it reads as a full-width section line. */
      margin-bottom: var(--sz-20);
    }

    /* A trigger row sitting directly above its open panel drops its own bottom line,
       so there's no rule/space between the heading and the panel. */
    .control-row[data-interactive="true"]:has(+ .options-panel[data-state="open"]) {
      border-bottom: none;
    }

    /* The section AFTER an open panel carries the divider on its top edge. */
    .options-panel[data-state="open"]+.control-row {
      border-top: var(--rule-width) solid var(--ui-rule);
    }

    .option-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .option-group {
      display: flex;
      flex-direction: column;
      gap: var(--sz-02);
      padding-bottom: var(--sz-10);
    }

    .option-group:last-child {
      padding-bottom: 0;
    }

    .option-group-title {
      color: var(--ui-ink-muted);
      font-size: var(--ui-text-size);
      padding: var(--sz-08) var(--sz-10) var(--sz-02);
    }

    .option-row,
    .option-action {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--sz-20);
      min-height: var(--sz-30);
      padding: var(--sz-20);
      border-radius: 0;
      /* Reserve the focus stroke's space up front (transparent) so focusing recolors it
         without shifting layout. */
      border-bottom: var(--rule-width) solid transparent;
      color: var(--ui-ink);
      cursor: pointer;
      text-transform: uppercase;
    }

    /* First/last rows echo the panel's corner radius so their hover/selected fill stays
       inside the rounded panel — no overflow clipping needed. */
    .option-list>.option-row:first-child {
      border-top-left-radius: var(--sz-20);
      border-top-right-radius: var(--sz-20);
    }

    .option-list>.option-row:last-child {
      border-bottom-left-radius: var(--sz-20);
      border-bottom-right-radius: var(--sz-20);
    }

    /* Hover and selected share the same fill; neither adds a border. */
    .option-row:hover,
    .option-action:hover,
    .option-row:has(input:checked) {
      background: var(--ui-rule);
      color: var(--ui-ink);
    }

    /* Hidden checkbox pinned inside its own row. It must be position:absolute within the
       row (row is position:relative) — otherwise it escapes to the scroll container and
       focusing it on click scrolls the sidebar to a stale offset, clipping the panel. */
    .option-row {
      position: relative;
    }

    .option-row input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      margin: 0;
      pointer-events: none;
    }

    /* Tab (keyboard) focus matches the section rows: no outline, just a bottom stroke.
       The transparent border is already reserved above, so this only recolors it —
       no layout shift. :has(:focus-visible) keeps it keyboard-only. */
    .option-row:has(input:focus-visible),
    .option-action:focus-visible {
      outline: none;
      border-bottom-color: var(--ui-ink-muted);
    }

    /* Checkbox marker: 16x16, 4px radius; 2px stroke drawn CENTERED on the edge (1px
       outside + 1px inside) to match Figma's center-aligned stroke, since a CSS border
       would sit fully inside. Filled 10x10 inner square when selected. */
    .option-marker {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      box-shadow: 0 0 0 1px var(--ui-ink), inset 0 0 0 1px var(--ui-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .option-row input:checked~.option-marker::after {
      content: '';
      width: 10px;
      height: 10px;
      background: var(--ui-ink);
      border-radius: 1px;
    }

    .palette-swatch {
      display: grid;
      grid-template-columns: repeat(7, var(--sz-08));
      gap: var(--sz-02);
    }

    .palette-swatch span {
      width: var(--sz-08);
      height: var(--sz-16);
      background: var(--swatch-color);
      border: var(--rule-width) solid rgba(28, 28, 26, 0.2);
    }

    .height-panel-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sz-10);
      margin-bottom: var(--sz-16);
    }

    .height-grid {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sz-08) 0;
    }

    /* ==========================================================================
       6. SPECIFIC CONTROLS
       ========================================================================== */
    #seed-display:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
      border-radius: var(--sz-02);
    }

    .sidebar-toggle {
      position: absolute;
      top: var(--sz-20);
      right: var(--sz-20);
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--sz-16);
      height: var(--sz-16);
      font-size: var(--ui-text-size);
      cursor: pointer;
      z-index: 10;
      display: none;
    }

    .sidebar-toggle:hover .icon {
      color: var(--ui-ink);
    }

    .sidebar-toggle:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
      border-radius: var(--sz-02);
    }

    .action-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--ui-bg);
      padding: var(--sz-20);
      display: flex;
      gap: var(--sz-10);
      align-items: center;
      z-index: 10;
    }

    .button {
      display: flex;
      align-items: center;
      gap: var(--sz-02);
      padding: var(--sz-05) var(--sz-07) var(--sz-05) var(--sz-10);
      border: var(--ui-border-width) solid var(--ui-ink);
      border-radius: var(--sz-30);
      font-size: var(--ui-text-size);
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.1s ease, color 0.1s ease;
    }

    .button .icon {
      color: var(--ui-ink);
    }

    .button:active {
      background: var(--ui-ink);
      color: var(--ui-bg);
    }

    .button:active .icon {
      color: var(--ui-bg);
    }

    .button:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
    }

    :root[data-layout="poster"] #export-svg-btn {
      display: none;
    }

    :root[data-layout="art"] #export-hires-btn {
      display: none;
    }

    @media (min-width: 641px) {
      :root[data-layout="poster"] .l-sidebar {
        min-height: 100vh;
        max-height: 100vh;
      }
    }

    .icon-button {
      margin-left: auto;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-button:hover {
      color: var(--ui-ink-muted);
    }

    .icon-button:hover .icon {
      color: var(--ui-ink);
    }

    .icon-button:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
      border-radius: var(--sz-02);
    }

    .slider {
      position: relative;
      width: 100%;
      height: var(--sz-30);
      margin-top: var(--sz-15);
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }

    .slider-track {
      position: absolute;
      inset: 0;
      background: var(--ui-rule);
      border-radius: 999px;
    }

    .slider-thumb {
      position: absolute;
      height: 100%;
      min-width: var(--sz-54);
      padding: 0 var(--sz-15);
      background-color: var(--ui-ink);
      color: var(--ui-bg);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--sz-18);
      transform: translateX(0);
      z-index: 2;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    .slider-thumb[data-dragging="true"] {
      transition: none;
    }

    .slider-thumb:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
    }

    .toggle-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: var(--sz-30);
      min-width: var(--sz-64);
      padding: 0 var(--sz-25) 0 var(--sz-15);
      font-size: var(--sz-18);
      cursor: pointer;
      background: transparent;
      border: none;
      color: inherit;
    }

    .toggle-cell::before {
      content: '';
      position: absolute;
      inset: 0 var(--sz-10) 0 0;
      border: var(--sz-02) solid var(--ui-ink);
      border-radius: 999px;
      z-index: 0;
    }

    .toggle-cell span {
      position: relative;
      z-index: 1;
    }

    .toggle-cell[data-state="selected"],
    .toggle-cell[data-state="in-range"] {
      color: var(--ui-bg);
    }

    .toggle-cell[data-state="selected"]::before,
    .toggle-cell[data-state="in-range"]::before {
      background-color: var(--ui-ink);
      border-color: transparent;
    }

    .toggle-cell[data-state="in-range"]::before {
      inset: 0;
      border-radius: 0;
    }

    .toggle-cell[data-range-edge="start"]::before {
      inset: 0;
      border-radius: 999px 0 0 999px;
    }

    .toggle-cell[data-range-edge="end"]::before {
      inset: 0 var(--sz-10) 0 0;
      border-radius: 0 999px 999px 0;
    }

    .toggle-cell[data-range-edge="start"].range-end::before {
      inset: 0 var(--sz-10) 0 0;
      border-radius: 999px;
    }

    .toggle-cell:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
      border-radius: 999px;
    }

    #seed-display {
      cursor: pointer;
    }

    /* ==========================================================================
       7. ICONS
       ========================================================================== */
    .icon {
      width: var(--sz-16);
      height: var(--sz-16);
      fill: currentColor;
      color: var(--ui-ink-muted);
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .icon-mobile {
      display: none;
    }

    /* ==========================================================================
       8. MEDIA QUERIES
       ========================================================================== */
    @media (max-width: 640px) {
      :root {
        --page-pad-x: 20px;
        --page-pad-y: 20px;
        --active-sidebar-width: 0px;
        --content-width: 100vw;
        --canvas-size: calc(100vw - (var(--page-pad-x) * 2));
      }

      body {
        padding: var(--page-pad-y) var(--page-pad-x);
        overflow: auto;
      }

      .icon-desktop {
        display: none;
      }

      .icon-mobile {
        display: inline-block;
      }

      .l-app {
        display: flex;
        flex-direction: column;
        gap: 0;
        min-height: auto;
        width: var(--artwork-width);
        margin: 0 auto;
      }

      .l-canvas {
        position: relative;
        inset: auto;
        width: var(--artwork-width);
        height: auto;
        padding: 0;
      }

      .l-sidebar {
        position: relative;
        top: auto;
        right: auto;
        bottom: auto;
        width: 100%;
        min-width: 0;
        max-width: none;
        min-height: auto;
        max-height: none;
        height: auto;
        margin-left: 0;
        border: none;
      }

      .sidebar-content {
        padding: var(--sz-40) 0 var(--sz-120);
      }

      .action-bar {
        padding: var(--sz-20) 0;
      }

      .l-canvas[data-aspect-ratio="9:16"]~.l-sidebar {
        width: calc((var(--canvas-size) - var(--ui-border-width) * 2) * 0.5625 + var(--ui-border-width) * 2);
      }

      .l-sidebar[data-state="collapsed"] {
        display: none !important;
      }
    }

    /* --- Poster Layout Overrides --- */
    :root[data-layout="poster"] .artwork-container {
      height: auto;
      display: flex;
      flex-direction: column;
    }

    :root[data-layout="poster"] .artwork-stage {
      height: var(--canvas-size);
    }

    :root[data-layout="poster"] .poster-title,
    :root[data-layout="poster"] .poster-metadata {
      display: block !important;
    }

    .poster-title {
      position: absolute;
      top: var(--sz-20);
      left: var(--sz-20);
      color: var(--ui-ink);
      text-transform: uppercase;
      z-index: 10;
    }

    .poster-title-label {
      font-size: var(--sz-15);
      line-height: 1.2;
    }

    .poster-title-value {
      font-size: var(--sz-30);
      line-height: 1;
    }

    .poster-metadata {
      height: var(--poster-metadata-height);
      width: 100%;
      border-top: var(--ui-border-width) solid var(--ui-ink-solid);
      background: var(--ui-bg);
      color: var(--ui-ink);
      text-transform: uppercase;
      overflow: hidden;
    }

    .poster-meta-grid {
      display: flex;
      width: 100%;
      height: 100%;
    }


    .poster-data-cols {
      flex: 1 0 0;
      display: flex;
      flex-direction: column;
    }

    .poster-row {
      display: flex;
      flex: 1 0 0;
      width: 100%;
      min-height: 0;
    }

    .poster-row:first-child {
      border-bottom: var(--ui-border-width) solid var(--ui-ink-solid);
    }

    .poster-cell {
      padding: var(--sz-20);
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: var(--ui-border-width) solid var(--ui-ink-solid);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .poster-row>.poster-cell:last-child {
      border-right: none;
    }

    .poster-units-container {
      display: flex;
      flex: 0 0 auto;
    }

    .poster-units-container>.poster-cell:last-child {
      border-right: none;
    }

    .poster-cell.hug {
      flex: 0 0 auto;
    }

    .poster-cell.fill {
      flex: 1 0 0;
    }

    .poster-cell.color-cell {
      width: calc(var(--poster-metadata-height) - var(--ui-border-width));
      flex: 0 0 calc(var(--poster-metadata-height) - var(--ui-border-width));
      flex-direction: row;
      align-items: flex-end;
    }

    .poster-color-bar {
      flex: 1 0 0;
      background: var(--bar-color);
    }

    .poster-color-bar[data-unused="true"] {
      aspect-ratio: 1 / 1;
    }

    /* ================= 9:16 POSTER METADATA (separate structure) =================
       Per the mockup: color bars is a square cell spanning R1+R2 (like a rowspan), with
       seed/palette/profile stacked to its right. Single-direction borders (border-right on
       cells, border-bottom on rows) — no doubling.
         TOP BLOCK (height = 2 row-heights, square bars cell):
           bars(rowspan, hug) | seed(fill)               <- sub-row 1
           bars(cont'd)       | palette(fill) | profile(hug)  <- sub-row 2
         R3: form(hug) | limit(fill) | height(hug)
         R4: shapes(fill) | unit(hug) unit(hug) ...
         Same classes as the 1:1 metadata block (.poster-cell.fill / .poster-cell.hug, etc.) —
         every cell picks one explicitly, same as the square layout does. The two blocks share
         one class vocabulary; #poster-metadata-9x16 + [data-aspect-ratio="9:16"] on the rules
         below is what scopes them apart, so no separate class suffix is needed. */
    #poster-metadata-9x16 {
      display: none;
    }

    :root[data-aspect-ratio="9:16"][data-layout="poster"] #poster-metadata {
      display: none !important;
    }

    :root[data-aspect-ratio="9:16"][data-layout="poster"] #poster-metadata-9x16 {
      display: flex;
      flex-direction: column;
      width: 100%;
      /* Top-down like .poster-metadata's --poster-metadata-height: one total band height,
         set once from --poster-metadata-height-9x16 (defined at :root, see above). Rows below
         split it via flex-grow shares instead of each computing its own explicit height. */
      height: var(--poster-metadata-height-9x16);
      border-top: var(--ui-border-width) solid var(--ui-ink-solid);
      background: var(--ui-bg);
      color: var(--ui-ink);
      text-transform: uppercase;
      overflow: hidden;
      /* Reference unit for typography only (font-size/padding below) — NOT for box layout,
         which now comes entirely from flex-grow shares of --poster-metadata-height-9x16 above.
         This is the same 79/576-of-artwork-width "row" the shares divide the band into (4
         rows: the top block counts as 2, R3 and R4 count as 1 each), kept only so label/
         value/padding can be expressed as the same fraction-of-a-row the 1:1 poster uses
         (15/85, 30/85, 20/85 — see .meta-label/.meta-value/.poster-cell below), so text
         scales with the canvas exactly like the 1:1 poster instead of sitting at a fixed
         px size. */
      --poster-row-height-9x16: calc(var(--poster-metadata-height-9x16) / 4);
    }

    /* --- CSS-only scaling for 9:16 Poster Mode --- */
    :root[data-aspect-ratio="9:16"][data-layout="poster"] .artwork-svg {
      /* Scale down the artwork stage slightly and shift down to clear the title header */
      transform: scale(0.9);
      transform-origin: center center;
    }

    :root[data-aspect-ratio="9:16"][data-layout="poster"] .artwork-container {
      /* Keep overflow hidden so scaled transforms stay cleanly inside the poster frame */
      overflow: hidden;
    }

    /* Rows split --poster-metadata-height-9x16 via flex-grow shares (1 share each; .poster-top
       below takes 2) instead of each declaring its own height — same pattern as the 1:1
       poster's .poster-row { flex: 1 0 0 } splitting --poster-metadata-height in half.
       .poster-row/.poster-cell are the SAME classes the 1:1 block uses; scoping them under
       #poster-metadata-9x16 (rather than a class suffix) is what keeps these rules from
       leaking onto the 1:1 layout. */
    #poster-metadata-9x16 .poster-row {
      display: flex;
      flex-direction: row;
      width: 100%;
      flex: 1 0 0;
      min-height: 0;
      border-bottom: var(--ui-border-width) solid var(--ui-ink-solid);
    }

    #poster-metadata-9x16 .poster-row-last {
      border-bottom: none;
    }

    #poster-metadata-9x16 .poster-cell {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      /* 20/85 of a row — same fraction the 1:1 poster's cell padding (--sz-20) occupies of
         its own row height (poster-metadata-height/2 = 85 sz-units). Scales with the canvas
         like the rest of the 1:1 poster, instead of a fixed px value. */
      padding: calc(var(--poster-row-height-9x16) * 20 / 85);
      border-right: var(--ui-border-width) solid var(--ui-ink-solid);
      overflow: hidden;
    }

    /* Same fill/hug pair as the 1:1 poster-cell — every cell picks one explicitly. */
    #poster-metadata-9x16 .poster-cell.fill {
      flex: 1 1 0;
      min-width: 0;
    }

    #poster-metadata-9x16 .poster-cell.hug {
      flex: 0 0 auto;
    }

    /* Last cell in each row has no right border (frame provides the edge). */
    #poster-metadata-9x16 .poster-row> :last-child {
      border-right: none;
    }

    /* Top block: color-bars cell spans R1+R2, matching the mockup. Takes 2 flex-grow shares
       (double a plain .poster-row's 1 share) instead of an explicit calc(row-h * 2) — the *2
       lives in one place (the flex-grow number) instead of being duplicated in both this
       height and the color-bar square's width below. Draws the full-width divider before R3
       itself, so its two internal sub-rows don't double it up. */
    #poster-metadata-9x16 .poster-top {
      display: flex;
      flex-direction: row;
      width: 100%;
      flex: 2 0 0;
      min-height: 0;
      border-bottom: var(--ui-border-width) solid var(--ui-ink-solid);
    }

    #poster-metadata-9x16 .poster-top-right {
      display: flex;
      flex-direction: column;
      flex: 1 1 0;
      min-width: 0;
    }

    /* Color bars: square top-left cell spanning both sub-rows, bars bottom-aligned like the
       1:1 poster. Reuses the 1:1 block's .color-cell class — sized here from
       --poster-metadata-height-9x16 directly (half of it, since .poster-top itself is 2 of
       the band's 4 shares), same pattern as the 1:1 poster's .color-cell width, which is set
       from --poster-metadata-height directly rather than from a runtime-computed flex size.
       The nested .poster-color-bar rules (fill + square) are already covered by the shared
       rules above — .color-cell here only needs to override sizing. */
    #poster-metadata-9x16 .color-cell {
      flex: 0 0 calc(var(--poster-metadata-height-9x16) / 2 - var(--ui-border-width));
      width: calc(var(--poster-metadata-height-9x16) / 2 - var(--ui-border-width));
      flex-direction: row;
      align-items: flex-end;
      gap: 0;
    }

    /* Units row: SHAPES fills, each unit sub-cell hugs. Reuses the 1:1 block's
       .poster-units-container class. */
    #poster-metadata-9x16 .poster-units-container {
      display: flex;
      flex-direction: row;
      flex: 0 0 auto;
    }

    #poster-metadata-9x16 .poster-units-container> :last-child {
      border-right: none;
    }

    /* Fonts sized as fractions of --poster-row-height-9x16 (15/85 and 30/85 — same fractions
       the 1:1 poster's meta-label/meta-value occupy of ITS row height: --sz-15/--sz-30
       against an 85-sz-unit row). This keeps both the label:value ratio (1:2) AND each one's
       size relative to its own row identical to the 1:1 poster, and — because
       --poster-row-height-9x16 is ultimately derived from --canvas-size — scales down with
       the canvas on small viewports exactly like the 1:1 poster's --sz-* tokens do. */
    #poster-metadata-9x16 .meta-label {
      font-size: calc(var(--poster-row-height-9x16) * 15 / 85);
      line-height: 1.2;
      color: var(--ui-ink);
    }

    #poster-metadata-9x16 .meta-value {
      font-size: calc(var(--poster-row-height-9x16) * 30 / 85);
      line-height: 1;
      color: var(--ui-ink);
    }


    .meta-label {
      font-size: var(--sz-15);
      color: var(--ui-ink);
      line-height: 1.2;
    }

    .meta-value {
      font-size: var(--sz-30);
      color: var(--ui-ink);
      line-height: 1;
    }
  </style>
</head>

  <script>

    // ==========================================================================
    // 1. CONSTANTS & CONFIG
    // ==========================================================================
    const BORDER_WIDTH = 10;
    const CANVAS_SIZE = 1000;
    const CELL_SIZE = 100;
    const CELL_STEP = CELL_SIZE - BORDER_WIDTH; // Make sure 2 adjacent cells' borders overlap
    const COLUMN_WIDTH = 2 * CELL_STEP + BORDER_WIDTH; // Width of a 2-unit column: two steps + one closing border
    const INK_COLOR = '#1c1c1a'; // Fixed dark ink specifically for the structural artwork outlines

    // Every artwork uses a deterministic number of "blocks" (SVG rect counts).
    // This previously fixed 16-block constraint is now a user-controllable parameter.
    // The default 16 blocks limit is the reason for the name 4x4art, every artwork uses exactly 16 blocks. 
    const POSSIBLE_LIMITS = Array.from({ length: 20 }, (_, i) => (i + 1) * 2); // 2, 4, 6... 40
    const DEFAULT_LIMIT = POSSIBLE_LIMITS.includes(16) ? 16 : POSSIBLE_LIMITS[0];
    const VALID_PROFILE_IDS = new Set(['prism', 'fade', 'shift', 'solid', 'split']);

    const STACK_EDGE_MARGIN = CELL_STEP / 2; // Minimum clearance between the stack and the canvas edge.
    const MAX_STACK_HEIGHT_UNITS = Math.floor((CANVAS_SIZE - (STACK_EDGE_MARGIN * 2) - BORDER_WIDTH) / CELL_STEP); // Calculate max units based on the remaining space after margins and closing border.
    const FAMILY_ORDER = ['O', 'I', 'J', 'L', 'T', 'S', 'Z']; // Display order for internal family operations.
    const SHAPE_PRIORITY = { J: 0, L: 1, T: 2, S: 3, Z: 4, I: 5, O: 6 }; // Solver search order within the backtracker (lower = tried first).
    const MAX_SOLUTIONS_PER_HEIGHT = 24; // Per-height solution cap — keeps the solver fast on complex heights.


    // ==========================================================================
    // 2. DESIGN TOKENS
    // ==========================================================================
    // A cohesive generative system: Curated, thematic, and distinct.
    const PALETTES = [
      // 1. THE CLASSICS (Anchored to Warm Cotton, Newsprint, and Kraft papers)
      { name: 'spice', bg: '#f4f1ea', category: 'classic', colors: ['#c8a98c', '#0e3f39', '#c08e49', '#e2560b', '#a17073', '#695c54'] },
      { name: 'storm', bg: '#e8e6e1', category: 'classic', colors: ['#1c1a14', '#413819', '#f9cf45', '#fbd78b', '#948572', '#2c2618'] },

    // --- DETERMINISTIC PRNG (Seed Engine) ---
    // xmur3: string hasher — converts the seed string into a numeric state used to initialize the PRNG.
    function xmur3(str) {
      for (var i = 0, h = 1779033703 ^ str.length; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = h << 13 | h >>> 19;

        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        return (h ^= h >>> 16) >>> 0;

    function mulberry32(a) {

        var t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }

      nextRandom = mulberry32(seedFunc());

      const g = parseInt(c.slice(2, 4), 16) / 255;
      const b = parseInt(c.slice(4, 6), 16) / 255;

      return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
