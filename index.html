      for (const option of options) {
        applyShape(grid, option.shape, option.x, option.y, true);
        placements.push({ id: option.shape.id, x: option.x, y: option.y });
        searchStack(grid, targetHeight, targetBlocks, blocksUsed + option.shape.blocks, placements, solutions, fallbackSolutions, stackShapes, stackShapeWeights, minBlocksPerUnit, maxBlocksPerUnit);
        placements.pop();
        applyShape(grid, option.shape, option.x, option.y, false);

        if (solutions.length >= MAX_SOLUTIONS_PER_HEIGHT) return;
        if (fallbackSolutions.length >= MAX_SOLUTIONS_PER_HEIGHT * 4) return;
      }
    }

    function buildPlacementOptions(grid, targetHeight, firstEmpty, stackShapes, stackShapeWeights) {
      const placements = [];
      stackShapes.forEach(shape => {
        getAllowedOffsets(shape).forEach(x => {
          const minY = Math.max(0, firstEmpty.y - (shape.height - 1));
          const maxY = Math.min(firstEmpty.y, targetHeight - shape.height);
          for (let y = minY; y <= maxY; y += 1) {
            if (!placementCoversCell(shape, x, y, firstEmpty.x, firstEmpty.y)) continue;
            if (!canPlaceShape(grid, shape, x, y)) continue;
            const weight = stackShapeWeights.get(shape.id) || 1;
            for (let count = 0; count < weight; count += 1) {
              placements.push({ shape, x, y });
            }
          }
        });
      });
      return shuffle(placements);
    }

    function solveStackForHeight(targetHeight, targetBlocks) {
      const stackShapes = BASE_STACK_SHAPES.filter(shape => STRICT_SHAPE_IDS.has(shape.id));

      // COARSENESS SPREAD: each piece gets a seed-driven point on a coarse<->fine axis, so
      // the collection spans chunky big-bar monoliths to finer-grained stacks without any
      // discrete trait. t=0 fine (favor O-1 / small), t=1 coarse (favor I-4 / I-3). Uniform
      // roll; the weight floor of 1 keeps every shape available at all t (so height validity
      // is never affected — only which solution is favored). Higher weight = shape appears
      // more times in the shuffled candidate list = chosen more often.
      const t = nextRandom(); // uniform 0..1
      const fine = { 'O-1': 10, 'I-2-R0': 5, 'I-2-R90': 5, 'O-4': 4, 'I-3-R0': 2, 'I-4-R0': 1 };
      const coarse = { 'I-4-R0': 10, 'I-3-R0': 8, 'O-4': 6, 'I-2-R90': 3, 'I-2-R0': 2, 'O-1': 1 };
      const lerp = (a, b) => Math.max(1, Math.round(a + (b - a) * t));
      const curatedWeights = {};
      Object.keys(coarse).forEach(id => { curatedWeights[id] = lerp(fine[id], coarse[id]); });

      const stackShapeWeights = new Map(stackShapes.map(shape => [shape.id, curatedWeights[shape.id] || 1]));

      const minBlocksPerUnit = Math.min(...stackShapes.map(shape => shape.blocks / shape.units));
      const maxBlocksPerUnit = Math.max(...stackShapes.map(shape => shape.blocks / shape.units));

      const grid = createGrid(targetHeight);
      const solutions = [];
      const fallbackSolutions = [];

      searchStack(grid, targetHeight, targetBlocks, 0, [], solutions, fallbackSolutions, stackShapes, stackShapeWeights, minBlocksPerUnit, maxBlocksPerUnit);

      const finalSolutions = solutions.length > 0 ? solutions : fallbackSolutions;
      if (finalSolutions.length) {
        return pick(finalSolutions);
      }
      return null;
    }

    // Pre-flight validation: test every candidate height by actually running the solver.
    // Only heights where the solver finds at least one valid solution are included.
    // This replaces the old hardcoded '- 3' floor with a proved-valid set, and correctly
    // handles any height that is geometrically impossible regardless of available area.
    function computeValidHeights(targetBlocks) {
      const validHeights = [];
      for (let h = MAX_STACK_HEIGHT_UNITS; h >= 1; h--) {
        if (solveStackForHeight(h, targetBlocks) !== null) validHeights.push(h);
      }
      return validHeights; // Descending order (tallest first), matching original POSSIBLE_HEIGHTS shape.
    }
    let POSSIBLE_HEIGHTS = computeValidHeights(DEFAULT_LIMIT);



    // ==========================================================================
    // 5. ENGINE
    // ==========================================================================
    function generateStack(params) {
      let currentSeed = params.seed;
      let palette;
      let activeProfile;
      let solution;
      let heightUnits;

      const isForcedSeed = !!currentSeed;
      let attempts = 0;

      // Defensive defaults to prevent undefined errors when mapping parameters
      const allowedPalettes = params.allowedPalettes || [];
      const allowedProfiles = params.allowedProfiles || [];
      const allowedHeights = params.allowedHeights || [];

      while (true) {
        attempts++;
        if (attempts > 15000) {
          console.error("Failsafe triggered: Could not find a valid stack matching these specific constraints.");
          return null;
        }

        if (!isForcedSeed) {
          currentSeed = generateRandomSeed();
        }
        setSeed(currentSeed);

        // 1. Pick Palette natively from the PRNG
        palette = pick(PALETTES);
        if (!isForcedSeed && allowedPalettes.length > 0 && !allowedPalettes.includes(palette.name)) continue;

        // 2. Pick Profile natively from the PRNG
        const profileMode = nextRandom();
        if (profileMode < 0.40) activeProfile = 'prism';  // chaotic prismatic: adjacency-off + deck refill, guarded to >=3 distinct colors
        else if (profileMode < 0.65) activeProfile = 'fade';  // value gradient by height
        else if (profileMode < 0.81) activeProfile = 'shift'; // ordered hue walk by height
        else if (profileMode < 0.94) activeProfile = 'split'; // two hues, max luminance distance
        else activeProfile = 'solid';                         // single hue (kept rare — a little goes a long way)

        if (!isForcedSeed && allowedProfiles.length > 0 && !allowedProfiles.includes(activeProfile)) continue;

        // 3. Pick Height natively from the PRNG
        heightUnits = pick(POSSIBLE_HEIGHTS);
        if (!isForcedSeed && allowedHeights.length > 0 && !allowedHeights.includes(heightUnits)) continue;

        // 4. Attempt to mathematically solve the structure with the current PRNG seed
        const placements = solveStackForHeight(heightUnits, params.blockLimit);
        if (!placements) {
          if (isForcedSeed) return null; // If a shared URL seed is mathematically broken, abort cleanly
          continue;
        }

        solution = { placements, heightUnits };
        break; // We found a naturally occurring seed that matches every constraint!
      }

      // --- Biased Deck & Coloring Logic ---
      const colorWeights = new Array(palette.colors.length).fill(0);
      // Shuffled color order (seed-driven). Used by Solid to pick a random candidate
      // color; the draw also keeps PRNG order stable so existing seeds render identically.
      let activeIndices = shuffle([...Array(palette.colors.length).keys()]);

      // Positional profiles map color to vertical position instead of drawing from a
      // weighted bag. They share one path (sort palette -> per-shape t -> step -> color)
      // and differ only in the color ORDERING:
      //   fade   - luminance sort (value gradient)
      //   shift  - hue-then-luminance sort (ordered hue progression)
      const POSITIONAL = new Set(['fade', 'shift']);
      const isPositional = POSITIONAL.has(activeProfile);
      // Hue angle for sorting; achromatic colors return -1 and fall back to luminance,
      // so grayscale/low-hue palettes degrade gracefully into a value walk.
      const hueAngle = (hex) => {
        const c = hex.replace('#', '');
        const r = parseInt(c.slice(0, 2), 16) / 255, g = parseInt(c.slice(2, 4), 16) / 255, b = parseInt(c.slice(4, 6), 16) / 255;
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
        if (d < 0.02) return -1;
        let h; if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
        h *= 60; if (h < 0) h += 360; return h;
      };
      let positionalColors = null;
      if (isPositional) {
        if (activeProfile === 'shift') {
          positionalColors = palette.colors.slice().sort((a, b) => {
            const ha = hueAngle(a), hb = hueAngle(b);
            if (ha < 0 && hb < 0) return getLuminance(a) - getLuminance(b); // both achromatic
            if (ha < 0) return -1;                                          // achromatic first
            if (hb < 0) return 1;
            return ha - hb || getLuminance(a) - getLuminance(b);
          });
        } else {
          positionalColors = palette.colors.slice().sort((a, b) => getLuminance(a) - getLuminance(b));
        }
      }
      const rampAscending = isPositional ? nextRandom() > 0.5 : false;

      if (activeProfile === 'solid') {
        // Single hue for the entire monolith, chosen randomly (seed-driven) so the same
        // palette yields different Solids — BUT excluding very-dark near-neutrals, which
        // otherwise make Solids from different palettes look alike (a run of charcoals).
        // Pure-grayscale palettes are exempt: everything in them is neutral, so we keep
        // the full set and let a random gray Solid stand (still varies by seed).
        const chroma = (hex) => {
          const c = hex.replace('#', '');
          const r = parseInt(c.slice(0, 2), 16) / 255, g = parseInt(c.slice(2, 4), 16) / 255, b = parseInt(c.slice(4, 6), 16) / 255;
          return Math.max(r, g, b) - Math.min(r, g, b);
        };
        const maxChroma = Math.max(...palette.colors.map(chroma));
        const isGrayscale = maxChroma < 0.10;
        // Candidate indices: all colors on grayscale palettes; otherwise drop the muddy
        // dark-neutrals. Safety net: if filtering leaves fewer than 2, keep the full set.
        let candidates = palette.colors
          .map((c, i) => ({ c, i }))
          .filter(({ c }) => isGrayscale || !(getLuminance(c) < 0.06 && chroma(c) < 0.10))
          .map(({ i }) => i);
        if (candidates.length < 2) candidates = palette.colors.map((_, i) => i);
        // Pick one candidate using the already-shuffled activeIndices order (no new PRNG
        // draw): the first shuffled index that is a candidate.
        const chosen = activeIndices.find(i => candidates.includes(i));
        colorWeights[chosen != null ? chosen : candidates[0]] = 10;
      } else if (activeProfile === 'split') {
        // Two hues chosen for maximum luminance distance, so the pairing reads as a
        // deliberate duochrome even on low-hue palettes (where random pairs look alike).
        const byLum = palette.colors
          .map((c, i) => ({ i, L: getLuminance(c) }))
          .sort((a, b) => a.L - b.L);
        colorWeights[byLum[0].i] = 10;                        // darkest
        colorWeights[byLum[byLum.length - 1].i] = 10;         // lightest
      } else if (isPositional) {
        // Positional profiles bypass the deck; weights are unused. Balanced as a failsafe.
        for (let i = 0; i < palette.colors.length; i++) colorWeights[i] = 1;
      } else {
        for (let i = 0; i < palette.colors.length; i++) {
          colorWeights[i] = 1;
        }
      }

      const buildBiasedDeck = () => {
        let deck = [];
        palette.colors.forEach((c, i) => {
          for (let j = 0; j < colorWeights[i]; j++) deck.push(c);
        });
        return shuffle(deck);
      };

      const colorGrid = Array.from({ length: heightUnits }, () => [null, null]);
      const placementsWithShapes = solution.placements
        .map(p => ({ ...p, shape: SHAPE_CATALOG[p.id] }))
        .sort((a, b) => a.y - b.y || a.x - b.x || a.id.localeCompare(b.id));

      let colorDeck = buildBiasedDeck();

      const placementsWithColors = placementsWithShapes.map(p => {
        // Positional profiles: color is a function of vertical position, not a deck draw.
        if (isPositional) {
          const shapeCenterY = p.y + (p.shape.height - 1) / 2;
          const denom = Math.max(1, heightUnits - 1);
          let t = shapeCenterY / denom;            // 0 at base, 1 at top
          if (!rampAscending) t = 1 - t;           // flip direction per seed
          const step = Math.round(t * (positionalColors.length - 1));
          const posColor = positionalColors[Math.max(0, Math.min(positionalColors.length - 1, step))];
          p.shape.cells.forEach(cell => {
            colorGrid[p.y + cell.y][p.x + cell.x] = posColor;
          });
          return { ...p, color: posColor };
        }

        const neighborColors = new Set();
        // Adjacency suppression is OFF for Split, Prism, AND Solid. Solid is deck-based
        // (it reaches this loop), and its deck holds only one color — so enforcing
        // "don't match your neighbor" would find no valid color and the fallback would
        // inject OTHER palette colors, breaking the single-hue guarantee. A monochrome
        // piece wants identical neighbors, so Solid must never enforce adjacency.
        // (Positional profiles return early above and never reach here.)
        const noAdjacency = activeProfile === 'split' || activeProfile === 'prism' || activeProfile === 'solid';
        const enforceAdjacency = noAdjacency ? false : nextRandom() > 0.25;

        if (enforceAdjacency) {
          p.shape.cells.forEach(cell => {
            const gridX = p.x + cell.x;
            const gridY = p.y + cell.y;

            if (gridY + 1 < heightUnits && colorGrid[gridY + 1][gridX]) neighborColors.add(colorGrid[gridY + 1][gridX]);
            if (gridY - 1 >= 0 && colorGrid[gridY - 1][gridX]) neighborColors.add(colorGrid[gridY - 1][gridX]);
            if (gridX - 1 >= 0 && colorGrid[gridY][gridX - 1]) neighborColors.add(colorGrid[gridY][gridX - 1]);
            if (gridX + 1 < 2 && colorGrid[gridY][gridX + 1]) neighborColors.add(colorGrid[gridY][gridX + 1]);
          });
        }

        let validColors = colorDeck.filter(c => !neighborColors.has(c));

        if (validColors.length === 0) {
          colorDeck = buildBiasedDeck();
          validColors = colorDeck.filter(c => !neighborColors.has(c));

          if (validColors.length === 0) {
            validColors = palette.colors.filter(c => !neighborColors.has(c));
          }
          if (validColors.length === 0) {
            validColors = palette.colors;
          }
        }

        const color = validColors[0];
        const deckIndex = colorDeck.indexOf(color);
        if (deckIndex > -1) colorDeck.splice(deckIndex, 1);

        // Prism: refill the deck after every pick so any color can recur and
        // cluster (full "prismatic" chaos). Other bag-based profiles consume one-of-each.
        if (activeProfile === 'prism') colorDeck = buildBiasedDeck();

        p.shape.cells.forEach(cell => {
          colorGrid[p.y + cell.y][p.x + cell.x] = color;
        });

        return { ...p, color };
      });

      // Prism guard: independent draws can collapse a sparse (3–4 shape) piece onto
      // 1–2 colors, making it read as Solid/Split. If fewer than 3 distinct colors were
      // used, promote later shapes to as-yet-unused palette colors — in placement order,
      // deterministically — until the piece shows at least 3 (capped by shape count and
      // palette size). Leaves richer pieces untouched.
      if (activeProfile === 'prism') {
        const MIN_DISTINCT = 3;
        const target = Math.min(MIN_DISTINCT, placementsWithColors.length, palette.colors.length);
        const used = new Set(placementsWithColors.map(p => p.color));
        if (used.size < target) {
          const unused = palette.colors.filter(c => !used.has(c));
          for (let i = placementsWithColors.length - 1; i >= 0 && used.size < target && unused.length > 0; i--) {
            const p = placementsWithColors[i];
            // Only recolor a shape whose current color appears more than once, so we
            // never drop an already-distinct color below the count while raising it.
            const dupCount = placementsWithColors.filter(q => q.color === p.color).length;
            if (dupCount <= 1) continue;
            const newColor = unused.shift();
            p.color = newColor;
            p.shape.cells.forEach(cell => {
              colorGrid[p.y + cell.y][p.x + cell.x] = newColor;
            });
            used.add(newColor);
          }
        }
      }

      return {
        placements: placementsWithColors,
        heightUnits,
        palette,
        activeProfile,
        seed: currentSeed
      };
    }


    // ==========================================================================
    // 6. STATE
    // ==========================================================================
    // GLOBAL STATE LAYER
    const appState = {
      heightMode: 'multi',
      targetBlocks: DEFAULT_LIMIT,
      isLimitVisible: false,
      selectedHeights: new Set(),

      rangeStart: null,
      rangeEnd: null,

      selectedPalettes: [],
      selectedProfiles: [],

      formMode: 'native',   // 'native' | 'bound' | 'unbound' — native follows the palette
      showOutline: true,     // resolved from formMode + palette on each generation
      showMetadata: true,
      showExport: true,
      displayLayout: 'art',
      aspectRatio: '1:1',
      renderMode: 'single',  // 'single' | 'grid' — grid shows a 4x4 sheet of independent random pieces
      isRenderModeVisible: false, // control only shows when ?render=single|grid is in the URL
      isSidebarOpen: true,
      openPanels: new Set(), // options panels open independently; all collapsed on load

      seed: null, // The string guaranteeing exact reproduction
      artwork: null, // Holds the output of the generation engine
      shareUrl: null // Safe fallback URL for environments that block replaceState
    };

    // --- STATE MODULE ---
    const State = {
      refreshValidHeights() {
        POSSIBLE_HEIGHTS = computeValidHeights(appState.targetBlocks);
        return POSSIBLE_HEIGHTS;
      },

      sanitizeHeights() {
        return sanitizeHeightState();
      },

      clearSeed() {
        appState.seed = null;
      },

      setSeed(seed) {
        appState.seed = seed;
      },

      setTargetBlocks(value) {
        appState.targetBlocks = clampToAllowedLimit(value);
        this.clearSeed();
        this.refreshValidHeights();
        this.sanitizeHeights();
        return appState.targetBlocks;
      },

      setRenderFlag(flag, value) {
        appState[flag] = value;
      },

      // Resolve showOutline from formMode + the given palette. 'native' follows the palette
      // (muted/void categories read best unbound); 'bound'/'unbound' are explicit overrides.
      // Pure — does not touch appState, so grid pieces can each resolve their own palette
      // without stomping on the single-mode artwork's outline setting.
      computeShowOutline(palette) {
        if (appState.formMode === 'bound') return true;
        if (appState.formMode === 'unbound') return false;
        return !(palette.category === 'muted' || palette.category === 'void');
      },

      // Called on every single-piece generation so 'native' is always current — no context
      // gating. Grid pieces use computeShowOutline directly instead (see renderContactSheet).
      resolveForm(palette) {
        appState.showOutline = this.computeShowOutline(palette);
        return appState.showOutline;
      },

      syncCanvasScale() {
        const root = document.documentElement;
        const styles = getComputedStyle(root);
        const pagePadX = parseFloat(styles.getPropertyValue('--page-pad-x')) || 20;
        const pagePadY = parseFloat(styles.getPropertyValue('--page-pad-y')) || 20;
        const sidebarWidth = parseFloat(styles.getPropertyValue('--sidebar-width')) || 365;
        const metadataRatio = parseFloat(styles.getPropertyValue('--poster-metadata-ratio')) || 0.17;
        // Same ratio the CSS band height itself is built from (--poster-metadata-ratio-9x16,
        // 316/576 — see :root), read here instead of re-approximated, so this reservation
        // and the actual rendered band can't drift out of sync with each other.
        const metadataRatio9x16 = parseFloat(styles.getPropertyValue('--poster-metadata-ratio-9x16')) || (316 / 576);
        const isMobile = window.innerWidth <= 640;
        const activeSidebarWidth = (!isMobile && appState.isSidebarOpen) ? sidebarWidth : 0;
        const availableWidth = Math.max(1, window.innerWidth - activeSidebarWidth - (pagePadX * 2));
        const availableHeight = Math.max(1, window.innerHeight - (pagePadY * 2));
        const artworkRatio = appState.aspectRatio === '9:16' ? 0.5625 : 1;

        // Poster reserves height for the metadata band below the canvas. Ratio is relative
        // to canvas height, so total poster height = canvas * (1 + ratio). 1:1's ratio
        // (--poster-metadata-ratio, 0.17) is already relative to canvas height directly.
        // 9:16's band is defined relative to --artwork-width instead
        // (--poster-metadata-ratio-9x16, 316/576 — 4 stacked rows), so it's converted to a
        // canvas-height-relative ratio via the same artwork-width:canvas-size factor
        // (artworkRatio) used for byWidth below — the exact geometry, not a hand-kept
        // approximation of it.
        let byHeight;
        if (appState.displayLayout === 'poster') {
          const posterMetaRatio = appState.aspectRatio === '9:16' ? (artworkRatio * metadataRatio9x16) : metadataRatio;
          byHeight = availableHeight / (1 + posterMetaRatio);
        } else {
          byHeight = availableHeight;
        }

        const byWidth = availableWidth / artworkRatio;
        const nextCanvasSize = Math.max(1, Math.min(byHeight, byWidth));
        root.style.setProperty('--canvas-size', `${nextCanvasSize}px`);
      },

      toggleDisplayLayout() {
        appState.displayLayout = appState.displayLayout === 'art' ? 'poster' : 'art';
        document.documentElement.setAttribute('data-layout', appState.displayLayout);
        this.syncCanvasScale();
      },

      toggleAspectRatio() {
        appState.aspectRatio = appState.aspectRatio === '1:1' ? '9:16' : '1:1';
        this.syncCanvasScale();
      },

      toggleRenderMode() {
        appState.renderMode = appState.renderMode === 'single' ? 'grid' : 'single';
      },

      toggleSidebar() {
        appState.isSidebarOpen = !appState.isSidebarOpen;
        if (!appState.isSidebarOpen) appState.openPanels.clear();
        this.syncCanvasScale();
      },

      toggleOptionsPanel(panelName) {
        if (appState.openPanels.has(panelName)) appState.openPanels.delete(panelName);
        else appState.openPanels.add(panelName);
      },

      setHeightMode(mode) {
        appState.heightMode = mode;
        if (mode === 'range') {
          const selectedHeights = Array.from(appState.selectedHeights).sort((a, b) => a - b);
          if (selectedHeights.length > 0) {
            appState.rangeStart = selectedHeights[0];
            appState.rangeEnd = selectedHeights[selectedHeights.length - 1];
            const min = Math.min(appState.rangeStart, appState.rangeEnd);
            const max = Math.max(appState.rangeStart, appState.rangeEnd);
            appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(height => height >= min && height <= max));
          } else {
            appState.rangeStart = null;
            appState.rangeEnd = null;
          }
        } else {
          appState.rangeStart = null;
          appState.rangeEnd = null;
        }
        this.sanitizeHeights();
      },

      toggleHeightSelection(height) {
        if (appState.heightMode === 'multi') {
          if (appState.selectedHeights.has(height)) appState.selectedHeights.delete(height);
          else appState.selectedHeights.add(height);
          return;
        }

        if (appState.rangeStart === null || (appState.rangeStart !== null && appState.rangeEnd !== null)) {
          appState.rangeStart = height;
          appState.rangeEnd = null;
          appState.selectedHeights = new Set([height]);
          return;
        }

        appState.rangeEnd = height;
        const min = Math.min(appState.rangeStart, appState.rangeEnd);
        const max = Math.max(appState.rangeStart, appState.rangeEnd);
        appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(value => value >= min && value <= max));
      },

      resetFiltersAndView() {
        appState.heightMode = 'multi';
        appState.selectedHeights.clear();
        appState.rangeStart = null;
        appState.rangeEnd = null;
        appState.selectedPalettes = [];
        appState.selectedProfiles = [];
        appState.formMode = 'native';
        appState.showOutline = true;
        appState.showMetadata = true;
        appState.showExport = true;
        appState.displayLayout = 'art';
        appState.aspectRatio = '1:1';
        appState.renderMode = 'single';
        appState.isRenderModeVisible = false;
        appState.openPanels.clear();
        this.clearSeed();
      },

      syncFromDOM() {
        const paletteInputs = document.querySelectorAll('#palette-filter-list input:checked');
        appState.selectedPalettes = [...paletteInputs].map(input => input.value);

        const profileInputs = document.querySelectorAll('#profile-filter-list input[type="checkbox"]:checked');
        appState.selectedProfiles = [...profileInputs].map(input => input.value).filter(v => VALID_PROFILE_IDS.has(v));

        // Form mode is driven by its own radio handler (formMode is authoritative); nothing
        // to read back here. showOutline is resolved from formMode on each generation.

        const metadataEl = document.getElementById('toggle-metadata');
        if (metadataEl) appState.showMetadata = metadataEl.checked;

        const exportEl = document.getElementById('toggle-export');
        if (exportEl) appState.showExport = exportEl.checked;
      },

      applyToDOM() {
        Render.renderPaletteFilter();
        Render.renderProfileFilter();

        document.querySelectorAll('#palette-filter-list input[type="checkbox"]').forEach(checkbox => {
          checkbox.checked = appState.selectedPalettes.includes(checkbox.value);
        });
        document.querySelectorAll('#profile-filter-list input[type="checkbox"]').forEach(checkbox => {
          checkbox.checked = appState.selectedProfiles.includes(checkbox.value);
        });

        const rangeToggleEl = document.getElementById('toggle-range-mode');
        if (rangeToggleEl) rangeToggleEl.checked = (appState.heightMode === 'range');

        // Check the Form radio matching the current formMode.
        document.querySelectorAll('#form-options-panel input[name="form-mode"]').forEach(radio => {
          radio.checked = (radio.value === appState.formMode);
        });

        const metadataEl = document.getElementById('toggle-metadata');
        if (metadataEl) metadataEl.checked = appState.showMetadata;

        const exportEl = document.getElementById('toggle-export');
        if (exportEl) exportEl.checked = appState.showExport;

        Render.renderHeightFilter();
        this.syncCanvasScale();
        Render.renderDisplayOptions();
        Render.renderSidebarState();
        document.documentElement.setAttribute('data-layout', appState.displayLayout);
      },

      buildGenerationParams() {
        return {
          allowedPalettes: appState.selectedPalettes || [],
          allowedProfiles: appState.selectedProfiles || [],
          allowedHeights: Array.from(appState.selectedHeights),
          seed: appState.seed,
          blockLimit: appState.targetBlocks
        };
      },

      parseURL() {
        const params = new URLSearchParams(window.location.search);

        appState.seed = normalizeSeed(params.get('seed'));
        appState.selectedPalettes = parseCommaList(params.get('palettes')).filter(name => VALID_PALETTE_NAMES.has(name));
        appState.selectedProfiles = parseCommaList(params.get('profiles')).filter(profile => VALID_PROFILE_IDS.has(profile));

        const formParam = params.get('form');
        appState.formMode = (formParam === 'bound' || formParam === 'unbound') ? formParam : 'native';
        appState.showMetadata = params.has('meta') ? params.get('meta') !== 'false' : true;
        appState.showExport = params.has('export') ? params.get('export') !== 'false' : true;
        appState.displayLayout = params.get('layout') === 'poster' ? 'poster' : 'art';
        appState.aspectRatio = params.get('ratio') === '9:16' ? '9:16' : '1:1';

        if (params.has('limit')) {
          appState.targetBlocks = clampToAllowedLimit(parseInt(params.get('limit'), 10));
          appState.isLimitVisible = true;
        } else {
          appState.targetBlocks = DEFAULT_LIMIT;
          appState.isLimitVisible = false;
        }

        const renderParam = params.get('render');
        if (renderParam === 'single' || renderParam === 'grid') {
          appState.renderMode = renderParam;
          appState.isRenderModeVisible = true;
        } else {
          appState.renderMode = 'single';
          appState.isRenderModeVisible = false;
        }

        this.refreshValidHeights();

        const parsedHeights = parseHeightsParam(params.get('heights'));
        appState.heightMode = parsedHeights.heightMode;
        appState.selectedHeights = parsedHeights.selectedHeights;
        appState.rangeStart = parsedHeights.rangeStart;
        appState.rangeEnd = parsedHeights.rangeEnd;

        if (appState.heightMode === 'range' && appState.rangeStart !== null) {
          const min = appState.rangeEnd === null ? appState.rangeStart : Math.min(appState.rangeStart, appState.rangeEnd);
          const max = appState.rangeEnd === null ? appState.rangeStart : Math.max(appState.rangeStart, appState.rangeEnd);
          appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(height => height >= min && height <= max));
        }

        this.sanitizeHeights();
      },

      syncURL() {
        const url = new URL(window.location);
        const searchParams = url.searchParams;

        searchParams.delete('seed');
        searchParams.delete('palettes');
        searchParams.delete('profiles');
        searchParams.delete('heights');
        searchParams.delete('limit');
        searchParams.delete('form');
        searchParams.delete('meta');
        searchParams.delete('export');
        searchParams.delete('layout');
        searchParams.delete('ratio');
        searchParams.delete('render');

        if (appState.selectedPalettes.length) searchParams.set('palettes', appState.selectedPalettes.join(','));
        if (appState.selectedProfiles.length) searchParams.set('profiles', appState.selectedProfiles.join(','));

        if (appState.selectedHeights.size > 0) {
          if (appState.heightMode === 'range' && appState.rangeStart !== null && appState.rangeEnd !== null) {
            const min = Math.min(appState.rangeStart, appState.rangeEnd);
            const max = Math.max(appState.rangeStart, appState.rangeEnd);
            searchParams.set('heights', `${min}-${max}`);
          } else {
            searchParams.set('heights', Array.from(appState.selectedHeights).sort((a, b) => a - b).join(','));
          }
        }

        if (appState.isLimitVisible) searchParams.set('limit', appState.targetBlocks);
        if (appState.formMode !== 'native') searchParams.set('form', appState.formMode);
        if (!appState.showMetadata) searchParams.set('meta', 'false');
        if (!appState.showExport) searchParams.set('export', 'false');
        if (appState.displayLayout !== 'art') searchParams.set('layout', appState.displayLayout);
        if (appState.aspectRatio !== '1:1') searchParams.set('ratio', appState.aspectRatio);
        if (appState.isRenderModeVisible) searchParams.set('render', appState.renderMode);
        if (appState.seed) searchParams.set('seed', appState.seed);

        const searchString = searchParams.toString().replace(/%2C/g, ',');
        appState.shareUrl = url.origin + url.pathname + (searchString ? `?${searchString}` : '');

        try {
          window.history.replaceState(null, '', appState.shareUrl);
        } catch (error) {
          console.warn('Could not update URL history state in this environment.', error);
        }
      },

      triggerGeneration() {
        this.syncFromDOM();
        let didMutateHeightState = this.sanitizeHeights();
        let wasSeedForced = !!appState.seed;

        let params = this.buildGenerationParams();
        let newArtwork = generateStack(params);

        if (!newArtwork && appState.seed) {
          this.clearSeed();
          wasSeedForced = false;
          params = this.buildGenerationParams();
          newArtwork = generateStack(params);
        }

        if (!newArtwork && appState.selectedHeights.size > 0) {
          appState.selectedHeights.clear();
          appState.rangeStart = null;
          appState.rangeEnd = null;
          didMutateHeightState = this.sanitizeHeights() || didMutateHeightState;
          params = this.buildGenerationParams();
          newArtwork = generateStack(params);
        }

        if (newArtwork) {
          appState.artwork = newArtwork;

          // Resolve Form for this palette every time (native follows the palette; explicit
          // bound/unbound stick). Unconditional — fixes the old context-gated flakiness.
          this.resolveForm(newArtwork.palette);

          appState.seed = newArtwork.seed;
          if (didMutateHeightState) Render.renderHeightFilter();
          Render.render();
          this.syncURL();
          return;
        }

        if (didMutateHeightState) Render.renderHeightFilter();
        this.syncURL();
      }
    };


    // ==========================================================================
    // 7. SYNC
    // ==========================================================================
    // --- URL STATE SYNCING ---
    function normalizeSeed(value) {
      if (typeof value !== 'string') return null;
      const normalized = value.trim().toUpperCase();
      return /^[A-Z0-9]{6}$/.test(normalized) ? normalized : null;
    }

    function parseCommaList(value) {
      if (typeof value !== 'string') return [];
      return value.split(',').map(item => item.trim()).filter(Boolean);
    }

    function parseHeightsParam(value) {
      if (typeof value !== 'string' || value.trim() === '') {
        return { heightMode: 'multi', selectedHeights: new Set(), rangeStart: null, rangeEnd: null };
      }

      if (value.includes('-')) {
        const [startRaw, endRaw] = value.split('-', 2);
        const start = Number.parseInt(startRaw, 10);
        const end = Number.parseInt(endRaw, 10);
        if (!Number.isFinite(start) || !Number.isFinite(end)) {
          return { heightMode: 'multi', selectedHeights: new Set(), rangeStart: null, rangeEnd: null };
        }
        return { heightMode: 'range', selectedHeights: new Set(), rangeStart: start, rangeEnd: end };
      }

      const parsedHeights = parseCommaList(value)
        .map(item => Number.parseInt(item, 10))
        .filter(height => Number.isFinite(height));
      return {
        heightMode: 'multi',
        selectedHeights: new Set(parsedHeights),
        rangeStart: null,
        rangeEnd: null
      };
    }

    function sanitizeHeightState() {
      const validHeightSet = new Set(POSSIBLE_HEIGHTS);
      const sanitizedHeights = [...appState.selectedHeights].filter(height => validHeightSet.has(height));
      let wasChanged = sanitizedHeights.length !== appState.selectedHeights.size;

      if (appState.heightMode === 'range') {
        const selectedRangeHeights = sanitizedHeights.slice().sort((a, b) => a - b);

        if (selectedRangeHeights.length > 0) {
          const nextStart = selectedRangeHeights[0];
          const nextEnd = selectedRangeHeights[selectedRangeHeights.length - 1];
          if (appState.rangeStart !== nextStart || appState.rangeEnd !== nextEnd) wasChanged = true;
          appState.rangeStart = nextStart;
          appState.rangeEnd = nextEnd === nextStart ? null : nextEnd;
          appState.selectedHeights = new Set(selectedRangeHeights);
        } else if (appState.rangeStart !== null || appState.rangeEnd !== null || appState.selectedHeights.size > 0) {
          appState.rangeStart = null;
          appState.rangeEnd = null;
          appState.selectedHeights = new Set();
          wasChanged = true;
        } else {
          appState.selectedHeights = new Set();
        }
      } else {
        if (appState.rangeStart !== null || appState.rangeEnd !== null) wasChanged = true;
        appState.rangeStart = null;
        appState.rangeEnd = null;
        appState.selectedHeights = new Set(sanitizedHeights.sort((a, b) => a - b));
      }

      return wasChanged;
    }


    // ==========================================================================
    // 8. RENDER
    // ==========================================================================
    function formatUnitLabel(units) {
      return units > 0 ? '•'.repeat(units) : '';
    }

    // --- RENDER MODULE ---
    const Render = {
      renderDisplayOptions() {
        const renderModeRow = document.getElementById('render-mode-row');
        if (renderModeRow) renderModeRow.style.display = appState.isRenderModeVisible ? '' : 'none';

        const renderModeValue = document.getElementById('render-mode-value');
        const renderModeIcon = document.getElementById('render-mode-icon');
        const isGrid = appState.renderMode === 'grid';
        if (renderModeValue) {
          renderModeValue.textContent = isGrid ? 'Grid' : 'Single';
          if (renderModeIcon) {
            renderModeIcon.querySelector('use').setAttribute('href', isGrid ? '#icon-custom-render-grid' : '#icon-custom-render-single');
          }
        }

        // Layout/Aspect Ratio only apply to a single rendered piece — hide them while
        // Grid is showing a sheet of independent random pieces.
        const layoutRow = document.getElementById('layout-row');
        const aspectRatioRow = document.getElementById('aspect-ratio-row');
        if (layoutRow) layoutRow.style.display = isGrid ? 'none' : '';
        if (aspectRatioRow) aspectRatioRow.style.display = isGrid ? 'none' : '';

        const layoutValue = document.getElementById('layout-value');
        const layoutIcon = document.getElementById('layout-icon');
        if (layoutValue) {
          layoutValue.textContent = appState.displayLayout === 'art' ? 'Art' : 'Poster';
          if (layoutIcon) {
            layoutIcon.querySelector('use').setAttribute('href', appState.displayLayout === 'art' ? '#icon-custom-art-layout' : '#icon-custom-poster-layout');
          }
        }

        const aspectRatioValue = document.getElementById('aspect-ratio-value');
        const aspectIcon = document.getElementById('aspect-ratio-icon');
        const canvasWrap = document.getElementById('canvas');
        if (aspectRatioValue) {
          aspectRatioValue.textContent = appState.aspectRatio;
          if (aspectIcon) {
            aspectIcon.querySelector('use').setAttribute('href', appState.aspectRatio === '1:1' ? '#icon-custom-1-1-ratio' : '#icon-custom-9-16-ratio');
          }
          if (canvasWrap) {
            appState.aspectRatio === '9:16' ? canvasWrap.setAttribute('data-aspect-ratio', '9:16') : canvasWrap.removeAttribute('data-aspect-ratio');
          }
          appState.aspectRatio === '9:16' ? document.documentElement.setAttribute('data-aspect-ratio', '9:16') : document.documentElement.removeAttribute('data-aspect-ratio');
        }
      },

      updateSeedDisplay() {
        const seedDisplayEl = document.getElementById('seed-display');
        if (seedDisplayEl) seedDisplayEl.textContent = appState.renderMode === 'grid' ? 'Random' : appState.seed;
      },

      renderSidebarState() {
        const panel = document.getElementById('sidebar');
        const toggle = document.getElementById('sidebar-toggle');
        if (panel) !appState.isSidebarOpen ? panel.setAttribute('data-state', 'collapsed') : panel.removeAttribute('data-state');
        if (toggle) {
          !appState.isSidebarOpen ? toggle.setAttribute('data-state', 'closed') : toggle.removeAttribute('data-state');
          toggle.setAttribute('aria-label', appState.isSidebarOpen ? 'Close sidebar' : 'Open sidebar');
        }

        !appState.isSidebarOpen ? document.documentElement.setAttribute('data-sidebar-state', 'hidden') : document.documentElement.removeAttribute('data-sidebar-state');

        document.querySelectorAll('.options-panel').forEach(panelEl => {
          appState.openPanels.has(panelEl.dataset.panel) ? panelEl.setAttribute('data-state', 'open') : panelEl.removeAttribute('data-state');
        });
      },

      buildDotStrip(container, colors) {
        if (!container) return;
        container.innerHTML = '';
        colors.forEach((color, index) => {
          const dot = document.createElement('div');
          dot.className = 'dot';
          dot.style.background = color;
          if (index === 0) dot.title = 'background';
          container.appendChild(dot);
        });
      },


      renderArtwork() {
        if (!appState.artwork) return;
        const svg = document.getElementById('artwork-svg');
        this.drawArtworkInto(svg, appState.artwork, appState.aspectRatio, appState.showOutline);
      },

      // Draws a single artwork's rects into the given SVG element. Extracted so the
      // grid render mode can reuse the exact same geometry/inset logic.
      drawArtworkInto(svg, artwork, aspectRatio, showOutline) {
        const { placements, heightUnits, palette } = artwork;
        svg.innerHTML = '';

        const canvasW = aspectRatio === '9:16' ? 562.5 : CANVAS_SIZE;
        const canvasH = CANVAS_SIZE; // Always 1000

        const stackHeightPx = (heightUnits * CELL_STEP) + BORDER_WIDTH;
        const offsetX = Math.round((canvasW - COLUMN_WIDTH) / 2);
        const offsetY = Math.round((canvasH - stackHeightPx) / 2);

        svg.setAttribute('viewBox', `0 0 ${canvasW} ${canvasH}`);
        svg.setAttribute('width', canvasW);
        svg.setAttribute('height', canvasH);

        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('width', canvasW);
        bg.setAttribute('height', canvasH);
        bg.setAttribute('fill', palette.bg);
        svg.appendChild(bg);

        placements.forEach(placement => {
          const shape = SHAPE_CATALOG[placement.id];
          const occupied = new Set(shape.cells.map(cell => `${cell.x},${cell.y}`));

          shape.cells.forEach(cell => {
            const cellX = offsetX + ((placement.x + cell.x) * CELL_STEP);
            const gridY = placement.y + cell.y;
            const cellY = offsetY + ((heightUnits - 1 - gridY) * CELL_STEP);
            const insetLeft = occupied.has(`${cell.x - 1},${cell.y}`) ? 0 : BORDER_WIDTH;
            const insetRight = occupied.has(`${cell.x + 1},${cell.y}`) ? 0 : BORDER_WIDTH;
            const insetTop = occupied.has(`${cell.x},${cell.y + 1}`) ? 0 : BORDER_WIDTH;
            const insetBottom = occupied.has(`${cell.x},${cell.y - 1}`) ? 0 : BORDER_WIDTH;
            const effectiveGapColor = showOutline ? INK_COLOR : palette.bg;

            addRect(svg, cellX, cellY, CELL_SIZE, CELL_SIZE, effectiveGapColor);
            addRect(
              svg,
              cellX + insetLeft,
              cellY + insetTop,
              CELL_SIZE - insetLeft - insetRight,
              CELL_SIZE - insetTop - insetBottom,
              placement.color
            );
          });
        });
      },

      // GRID RENDER MODE: render 16 independent seedless generations in a 4x4 sheet,
      // to see the range of outputs at a glance. Ignores seed/URL entirely.
      renderContactSheet() {
        let overlay = document.getElementById('contact-sheet');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'contact-sheet';
          overlay.style.cssText = 'position:fixed;inset:0 var(--active-sidebar-width) 0 0;z-index:50;background:var(--ui-bg);display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;padding:12px;box-sizing:border-box;';
          document.body.appendChild(overlay);
        }
        overlay.style.display = 'grid';
        overlay.innerHTML = '';

        const params = State.buildGenerationParams();
        for (let i = 0; i < 16; i++) {
          const cell = document.createElement('div');
          cell.style.cssText = 'display:flex;align-items:center;justify-content:center;overflow:hidden;';
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
          svg.style.cssText = 'width:100%;height:100%;display:block;';
          // Seedless generation: force a fresh random piece each time.
          const artwork = generateStack({ ...params, seed: null });
          if (artwork) this.drawArtworkInto(svg, artwork, appState.aspectRatio, State.computeShowOutline(artwork.palette));
          cell.appendChild(svg);
          overlay.appendChild(cell);
        }
      },

      hideContactSheet() {
        const overlay = document.getElementById('contact-sheet');
        if (overlay) overlay.style.display = 'none';
      },

      renderMetadata() {
        if (!appState.artwork) return;
        const { placements, heightUnits, palette, activeProfile } = appState.artwork;
        const lightBg = isLight(palette.bg);
        const baseRGB = lightBg ? '28, 28, 26' : '240, 238, 232';
        const root = document.documentElement;
        root.style.setProperty('--ui-bg', palette.bg);
        root.style.setProperty('--ui-ink', `rgba(${baseRGB}, 0.9)`);
        root.style.setProperty('--ui-ink-solid', `rgb(${baseRGB})`);
        root.style.setProperty('--ui-ink-muted', `rgba(${baseRGB}, 0.5)`);
        root.style.setProperty('--ui-rule', `rgba(${baseRGB}, 0.1)`);

        !appState.showExport ? document.getElementById('export-overlay')?.setAttribute('data-state', 'hidden') : document.getElementById('export-overlay')?.removeAttribute('data-state');

        this.updateSeedDisplay();

        const shapeCountEl = document.getElementById('shape-count');
        if (shapeCountEl) shapeCountEl.textContent = placements.length;

        const stackHeightEl = document.getElementById('stack-height');
        if (stackHeightEl) stackHeightEl.textContent = heightUnits;

        const paletteNameEl = document.getElementById('palette-name');
        if (paletteNameEl) paletteNameEl.textContent = palette.name;

        const profileNameEl = document.getElementById('profile-name');
        if (profileNameEl) profileNameEl.textContent = activeProfile;

        const formNameEl = document.getElementById('form-name');
        if (formNameEl) formNameEl.textContent = appState.showOutline ? 'Bound' : 'Unbound';

        const limitDisplayEl = document.getElementById('limit-display');
        if (limitDisplayEl) limitDisplayEl.textContent = appState.targetBlocks;



        // Populate Poster Metadata (both the 1:1 block and the separate 9:16 block; only
        // one is visible per aspect ratio, but populating both keeps them ready on toggle).
        if (appState.displayLayout === 'poster') {
          const formText = appState.showOutline ? 'bound' : 'unbound';
          const setText = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
          setText('poster-seed', appState.seed); setText('poster-seed-9x16', appState.seed);
          setText('poster-palette', palette.name); setText('poster-palette-9x16', palette.name);
          setText('poster-profile', activeProfile); setText('poster-profile-9x16', activeProfile);
          setText('poster-form', formText); setText('poster-form-9x16', formText);
          setText('poster-limit', appState.targetBlocks + ' blocks'); setText('poster-limit-9x16', appState.targetBlocks + ' blocks');
          setText('poster-height', heightUnits + ' units'); setText('poster-height-9x16', heightUnits + ' units');
          setText('poster-shapes', placements.length); setText('poster-shapes-9x16', placements.length);

          // Color Usage Calculation
          const colorUsage = {};
          palette.colors.forEach(c => colorUsage[c] = 0);
          placements.forEach(p => {
            const units = SHAPE_CATALOG[p.id].units;
            colorUsage[p.color] += units;
          });
          const maxUnits = Math.max(...Object.values(colorUsage), 0);

          const buildColorBars = (container) => {
            if (!container) return;
            container.innerHTML = '';
            palette.colors.forEach(color => {
              const units = colorUsage[color];
              const bar = document.createElement('div');
              bar.className = 'poster-color-bar';
              bar.style.setProperty('--bar-color', color);
              const minHeightRatio = 1 / palette.colors.length;
              const usageRatio = maxUnits > 0 ? (units / maxUnits) : 0;
              const finalRatio = Math.max(usageRatio, minHeightRatio);
              if (units === 0 || maxUnits === 0) bar.dataset.unused = 'true';
              bar.style.height = `${finalRatio * 100}%`;
              container.appendChild(bar);
            });
          };
          buildColorBars(document.getElementById('poster-color-bars'));
          buildColorBars(document.getElementById('poster-color-bars-9x16'));

          // Shape Units breakdown
          const shapeCounts = placements.reduce((acc, p) => {
            const units = SHAPE_CATALOG[p.id].units;
            acc[units] = (acc[units] || 0) + 1;
            return acc;
          }, {});
          const unitsKeys = Object.keys(shapeCounts).map(Number).sort((a, b) => a - b);

          const buildUnits = (container, cellClass) => {
            if (!container) return;
            container.innerHTML = '';
            unitsKeys.forEach(units => {
              const cell = document.createElement('div');
              cell.className = cellClass;
              cell.innerHTML = `<div class="meta-label">${formatUnitLabel(units)}</div><div class="meta-value">${shapeCounts[units]}</div>`;
              container.appendChild(cell);
            });
          };
          buildUnits(document.getElementById('poster-units-container'), 'poster-cell hug');
          buildUnits(document.getElementById('poster-units-container-9x16'), 'poster-cell hug');
        }

        const shapesList = document.getElementById('shapes-list');
        if (!shapesList) return;

        shapesList.innerHTML = '';
        const counts = placements.reduce((acc, placement) => {
          const units = SHAPE_CATALOG[placement.id].units;
          acc[units] = (acc[units] || 0) + 1;
          return acc;
        }, {});

        Object.keys(counts).map(Number).sort((a, b) => a - b).forEach(units => {
          const row = document.createElement('div');
          row.className = 'control-row u-hide-icon';
          row.setAttribute('role', 'listitem');
          row.innerHTML = `<span class="control-label">${formatUnitLabel(units)}</span><span class="control-value">${counts[units]}</span>`;
          shapesList.appendChild(row);
        });
      },

      render() {
        if (!appState.artwork) return;
        this.renderArtwork();
        this.renderMetadata();
        this.renderDisplayOptions();
        this.renderSidebarState();
      },

      renderPaletteFilter() {
        const list = document.getElementById('palette-filter-list');
        if (!list) return;
        list.innerHTML = '';

        const categories = [...new Set(PALETTES.map(palette => palette.category))];
        categories.forEach(category => {

            const row = document.createElement('label');

          list.appendChild(group);

      renderProfileFilter() {
        const list = document.getElementById('profile-filter-list');
        if (!list) return;
        const profiles = [
          ['prism', 'Prism'],
          ['fade', 'Fade'],
          ['shift', 'Shift'],

        ];

        list.innerHTML = '';
        profiles.forEach(([id, label]) => {

          const input = document.createElement('input');

      renderLimitSlider() {
        const container = document.getElementById('limit-slider-container');
        if (!container) return;
        container.innerHTML = '';

        const slider = document.createElement('div');
        slider.className = 'limit-slider';

        const track = document.createElement('div');
        track.className = 'limit-slider-track';

        const thumb = document.createElement('div');
        thumb.className = 'limit-slider-thumb';
        thumb.innerHTML = `<span>${appState.targetBlocks}</span>`;

        slider.appendChild(track);
        slider.appendChild(thumb);
        container.appendChild(slider);

        const sortedLimits = getSortedLimits();
        function updateThumbPos(val) {
          const normalizedVal = clampToAllowedLimit(val);
          const valueIndex = sortedLimits.indexOf(normalizedVal);
          const percent = sortedLimits.length > 1 ? valueIndex / (sortedLimits.length - 1) : 0;
          const sliderWidth = slider.offsetWidth;
          const thumbWidth = thumb.offsetWidth;
          // The thumb slides from 0 to (sliderWidth - thumbWidth)
          const maxScroll = Math.max(0, sliderWidth - thumbWidth);
          thumb.style.transform = `translateX(${percent * maxScroll}px)`;
          thumb.querySelector('span').textContent = normalizedVal;
        }

        // Initial pos
        requestAnimationFrame(() => updateThumbPos(appState.targetBlocks));

        let isDragging = false;

        function valFromX(clientX) {
          const rect = slider.getBoundingClientRect();
          const thumbWidth = thumb.offsetWidth;
          const maxScroll = Math.max(0, rect.width - thumbWidth);
          if (maxScroll === 0) return appState.targetBlocks;
          const relativeX = Math.max(0, Math.min(maxScroll, clientX - rect.left - (thumbWidth / 2)));
          const percent = relativeX / maxScroll;
          const index = Math.round(percent * (sortedLimits.length - 1));
          return sortedLimits[Math.max(0, Math.min(sortedLimits.length - 1, index))];
        }

        function onPointerDown(e) {
          const isThumb = e.target.closest('.slider-thumb');
          if (isThumb) {
            isDragging = true;
            thumb.setAttribute('data-dragging', 'true');
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
          } else {
            // Stepper behavior: jump to next/prev if clicking track
            const rect = thumb.getBoundingClientRect();
            const clickX = e.clientX;
            const currentIndex = sortedLimits.indexOf(clampToAllowedLimit(appState.targetBlocks));
            let newVal = appState.targetBlocks;
            if (clickX < rect.left) {
              newVal = sortedLimits[Math.max(0, currentIndex - 1)];
            } else if (clickX > rect.right) {
              newVal = sortedLimits[Math.min(sortedLimits.length - 1, currentIndex + 1)];
            }
            if (newVal !== appState.targetBlocks) {
              updateLimit(newVal);
            }
          }
        }

        function onPointerMove(e) {
          if (!isDragging) return;
          const newVal = valFromX(e.clientX);
          if (newVal !== appState.targetBlocks) {
            updateLimit(newVal);
          }
        }

        function onPointerUp() {
          isDragging = false;
          thumb.removeAttribute('data-dragging');
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
        }

        function updateLimit(val) {
          State.setTargetBlocks(val);
          updateThumbPos(appState.targetBlocks);
          Render.renderHeightFilter();
          State.triggerGeneration();
        }

        slider.addEventListener('pointerdown', onPointerDown);
        // Ensure layout changes don't break position
        window.addEventListener('resize', () => updateThumbPos(appState.targetBlocks));
      },

      renderHeightFilter() {
        const hList = document.getElementById('height-filter-container');
        if (!hList) return;
        hList.innerHTML = '';

        POSSIBLE_HEIGHTS.slice().sort((a, b) => a - b).forEach(h => {
          const cell = document.createElement('button');
          cell.className = 'toggle-cell';
          cell.type = 'button';

          // Styling purely references the single source of truth: selectedHeights
          if (appState.heightMode === 'multi') {
            if (appState.selectedHeights.has(h)) cell.setAttribute('data-state', 'selected');
          } else {
            if (appState.selectedHeights.has(h)) {
              cell.setAttribute('data-state', 'in-range');
              const min = appState.rangeEnd !== null ? Math.min(appState.rangeStart, appState.rangeEnd) : appState.rangeStart;
              const max = appState.rangeEnd !== null ? Math.max(appState.rangeStart, appState.rangeEnd) : appState.rangeStart;
              if (h === min) cell.setAttribute('data-range-edge', 'start');
              if (h === max) cell.setAttribute('data-range-edge', 'end');
              if (h === min && h === max) {
                cell.setAttribute('data-range-edge', 'start');
                cell.classList.add('range-end');
              }
            }
          }

          cell.innerHTML = `<span>${h}</span>`;

          // Click logic modifies the single source of truth: selectedHeights
          cell.addEventListener('click', () => {
            State.toggleHeightSelection(h);
            State.clearSeed();
            Render.renderHeightFilter();
            State.triggerGeneration();
          });

          hList.appendChild(cell);
        });
      }
    };


    // ==========================================================================
    // 9. CONTROLS
    // ==========================================================================
    // --- CONTROLS MODULE ---
    const Controls = {
      regenerateFromFilters() {
        if (appState.renderMode === 'grid') {
          Render.renderContactSheet();
          return;
        }
        State.clearSeed();
        State.triggerGeneration();
      },

      syncRenderFlag(flag, checked) {
        State.setRenderFlag(flag, checked);
        Render.render();
        State.syncURL();
      },

      bindParamsPanel() {
        document.getElementById('render-mode-row')?.addEventListener('click', () => {
          State.toggleRenderMode();
          Render.renderDisplayOptions();
          Render.updateSeedDisplay();
          State.syncURL();
          if (appState.renderMode === 'grid') {
            Render.renderContactSheet();
          } else {
            Render.hideContactSheet();
            Render.render();
          }
        });

        document.getElementById('layout-row')?.addEventListener('click', () => {
          State.toggleDisplayLayout();
          Render.render();
          State.syncURL();
        });

        document.getElementById('aspect-ratio-row')?.addEventListener('click', () => {
          State.toggleAspectRatio();
          Render.renderDisplayOptions();
          Render.renderArtwork();
          State.syncURL();
        });

        document.querySelectorAll('[data-options-panel]').forEach(row => {
          row.addEventListener('click', () => {
            // Preserve sidebar scroll position across the open/close so the section title
            // stays put under the cursor (opening a panel must not scroll the sidebar).
            const scroller = document.querySelector('.sidebar-content');
            const prevScroll = scroller ? scroller.scrollTop : 0;
            State.toggleOptionsPanel(row.dataset.optionsPanel);
            Render.renderSidebarState();
            if (scroller) scroller.scrollTop = prevScroll;
          });
        });

        document.getElementById('palette-filter-list')?.addEventListener('change', event => {
          if (event.target.type !== 'checkbox') return;
          State.clearSeed();
          State.triggerGeneration();
        });

        document.getElementById('profile-filter-list')?.addEventListener('change', event => {
          if (event.target.type !== 'checkbox') return;
          State.clearSeed();
          State.triggerGeneration();
        });

        document.getElementById('form-options-panel')?.addEventListener('change', event => {
          if (event.target.name !== 'form-mode' || !event.target.checked) return;
          appState.formMode = event.target.value;
          // Re-resolve against the current palette and re-render (no regeneration needed —
          // Form only affects how the existing artwork is drawn).
          if (appState.artwork) State.resolveForm(appState.artwork.palette);
          Render.render();
          State.syncURL();
        });

        document.getElementById('toggle-range-mode')?.addEventListener('change', event => {
          State.setHeightMode(event.target.checked ? 'range' : 'multi');
          State.clearSeed();
          Render.renderHeightFilter();
          State.triggerGeneration();
        });

        document.getElementById('clear-height-filter')?.addEventListener('click', () => {
          appState.selectedHeights.clear();
          appState.rangeStart = null;
          appState.rangeEnd = null;
          State.clearSeed();
          Render.renderHeightFilter();
          State.triggerGeneration();
        });

        document.getElementById('seed-row')?.addEventListener('click', () => this.regenerateFromFilters());
        document.getElementById('seed-row')?.addEventListener('keydown', event => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          this.regenerateFromFilters();
        });
      },

      bindGlobalControls() {
        document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
          State.toggleSidebar();
          Render.renderSidebarState();
        });
        document.getElementById('export-png-btn')?.addEventListener('click', () => ExportActions.downloadPNG(2));
        document.getElementById('export-hires-btn')?.addEventListener('click', () => ExportActions.downloadPNG(6));
        document.getElementById('export-svg-btn')?.addEventListener('click', () => ExportActions.downloadSVG());

        document.getElementById('seed-display')?.addEventListener('click', event => {
          event.stopPropagation();
          if (appState.renderMode === 'grid') return;
          if (!appState.seed) return;
          const url = appState.shareUrl || window.location.href;
          const display = document.getElementById('seed-display');
          const original = display.textContent;

          const showCopied = () => {
            display.innerHTML = '<span style="color: var(--ui-ink-muted);">COPIED</span>';
            setTimeout(() => {
              display.textContent = appState.seed === original ? original : appState.seed;
            }, 1500);
          };

          const fallbackCopy = () => {
            const tempInput = document.createElement('input');
            tempInput.value = url;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showCopied();
          };

          if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(url).then(showCopied).catch(fallbackCopy);
            return;
          }

          fallbackCopy();
        });

        document.getElementById('seed-display')?.addEventListener('keydown', event => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          event.stopPropagation();
          document.getElementById('seed-display')?.click();
        });
      },

      bindShortcuts() {
        document.addEventListener('keydown', event => {
          if (event.target.tagName === 'INPUT' || event.metaKey || event.ctrlKey) return;
          const key = event.key.toLowerCase();

          if (key === 'r') this.regenerateFromFilters();

          if (key === 'i') {
            State.toggleSidebar();
            Render.renderSidebarState();
          }

          if (key === 'p') ExportActions.downloadPNG();
          if (key === 's') ExportActions.downloadSVG();
        });
      }
    };

    // --- EXPORT MODULE ---
    const ExportActions = {
      getSVGString() {
        const svg = document.getElementById('artwork-svg');
        const clone = svg.cloneNode(true);
        const canvasW = appState.aspectRatio === '9:16' ? 562.5 : CANVAS_SIZE;
        const canvasH = CANVAS_SIZE;
        clone.setAttribute('width', canvasW);
        clone.setAttribute('height', canvasH);
        clone.setAttribute('viewBox', `0 0 ${canvasW} ${canvasH}`);
        if (!clone.getAttribute('xmlns')) clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        return new XMLSerializer().serializeToString(clone);
      },

      triggerDownload(dataUrl, fileName) {
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = fileName;
        link.click();
        if (dataUrl.startsWith('blob:')) {
          setTimeout(() => URL.revokeObjectURL(dataUrl), 100);
        }
      },

      async _loadSVGImage() {
        const url = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(this.getSVGString())}`;
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = url;
        });
      },


      downloadSVG() {
        if (appState.displayLayout === 'poster') return;
        const blob = new Blob([this.getSVGString()], { type: 'image/svg+xml;charset=utf-8' });
        this.triggerDownload(URL.createObjectURL(blob), `4x4rt-stacks-${appState.seed || 'export'}.svg`);
      },

      async downloadPNG(pixelRatio = 2) {
        if (appState.displayLayout === 'poster') {
          try {
            const node = document.getElementById('artwork-container');
            const canvasW = appState.aspectRatio === '9:16' ? 562.5 : CANVAS_SIZE;
            const targetWidth = Math.round(canvasW * pixelRatio);
            const rect = node.getBoundingClientRect();
            const targetHeight = Math.round((rect.height / rect.width) * targetWidth);

            const dataUrl = await htmlToImage.toPng(node, {
              width: rect.width,
              height: rect.height,
              canvasWidth: targetWidth,
              canvasHeight: targetHeight,
              pixelRatio: 1,
              backgroundColor: appState.artwork.palette.bg,
              style: {
                transform: 'scale(1)',
                transformOrigin: 'top left'
              }
            });
            this.triggerDownload(dataUrl, `4x4rt-stacks-poster-${appState.seed || 'export'}.png`);
          } catch (error) {
            console.error('Poster PNG download failed', error);
          }
          return;
        }

        const scale = pixelRatio;
        const canvasW = appState.aspectRatio === '9:16' ? 562.5 : CANVAS_SIZE;
        const canvasH = CANVAS_SIZE; // Always 1000
        try {
          const img = await this._loadSVGImage();

          const canvas = document.createElement('canvas');
          canvas.width = canvasW * scale;
          canvas.height = canvasH * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          this.triggerDownload(canvas.toDataURL('image/png'), `4x4rt-stacks-${appState.seed || 'export'}.png`);
        } catch (error) {
          console.error('PNG download failed', error);
        }
      }
    };


    // ==========================================================================
    // 10. INIT
    // ==========================================================================
    // Initialize UI colors from data, not hardcoded CSS
    // Runs synchronously before first paint so there's no flash
    (function initUIColors() {
      const p = PALETTES.find(p => p.name === 'spice') || PALETTES[0];
      const root = document.documentElement;
      root.style.setProperty('--ui-bg', p.bg);
      root.style.setProperty('--ui-ink', 'rgba(28, 28, 26, 0.9)');
      root.style.setProperty('--ui-ink-solid', 'rgb(28, 28, 26)');
      root.style.setProperty('--ui-ink-muted', 'rgba(28, 28, 26, 0.5)');
      root.style.setProperty('--ui-rule', 'rgba(28, 28, 26, 0.1)');
    })();

    // --- INIT SEQUENCE ---
    Controls.bindGlobalControls();
    State.parseURL();
    Controls.bindParamsPanel();
    Controls.bindShortcuts();
    State.applyToDOM();
    document.documentElement.setAttribute('data-layout', appState.displayLayout);
    State.syncCanvasScale();
    window.addEventListener('resize', () => {
      State.syncCanvasScale();
      Render.renderDisplayOptions();
      Render.renderSidebarState();
    });
    State.triggerGeneration();
    // triggerGeneration always produces a single piece (needed as the fallback artwork for
    // when the user later switches back to Single) — if the URL requested grid mode, show
    // the contact sheet on top of that now.
    if (appState.renderMode === 'grid') Render.renderContactSheet();

  </script>
</body>
