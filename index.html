<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4x4rt Stacks Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --page-pad-x: 40px;
      --page-pad-y: 40px;
      --canvas-size: 80vmin;
      --rule-width: 1px;

      /* Unified UI Colors - Dynamically updated by JS based on canvas background */
      --ui-bg: #f4f1ea;
      /* Fallback background color for the UI, will be overridden by JS */
      --ui-ink: rgba(28, 28, 26, 0.9);
      --ui-ink-muted: rgba(28, 28, 26, 0.5);
      --ui-rule: rgba(28, 28, 26, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1b1b1b;
      font-family: 'Space Mono', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--page-pad-y) var(--page-pad-x);
      min-height: 100vh;
    }

    .app {
      display: flex;
      gap: calc(var(--canvas-size) * 0.015);
      align-items: flex-start;
      width: fit-content;
      max-width: 100%;
      justify-content: center;
    }

    .canvas-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--canvas-size) * 0.02);
      width: var(--canvas-size);
    }

    .params-panel {
      width: calc(var(--canvas-size) * 0.3);
      max-height: var(--canvas-size);
      overflow: auto;
      padding: calc(var(--canvas-size) * 0.015);
      background: var(--ui-bg);
      color: var(--ui-ink);
    }

    .params-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: calc(var(--canvas-size) * 0.024);
      line-height: 1;
      /* Removes default text spacing for perfect vertical centering */
      text-transform: uppercase;
      color: var(--ui-ink);
      margin-bottom: calc(var(--canvas-size) * 0.015);
    }

    .shuffle-btn {
      background: none;
      border: none;
      color: var(--ui-ink);
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shuffle-btn svg {
      /* Increased to offset the SVG's internal viewbox padding */
      width: calc(var(--canvas-size) * 0.032);
      height: calc(var(--canvas-size) * 0.032);
    }

    .params-copy {
      font-size: calc(var(--canvas-size) * 0.018);
      line-height: 1.5;
      color: var(--ui-ink-muted);
      margin-bottom: calc(var(--canvas-size) * 0.015);
    }

    .params-section {
      margin-bottom: calc(var(--canvas-size) * 0.02);
    }

    .params-section-header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: calc(var(--canvas-size) * 0.015);
      margin-bottom: calc(var(--canvas-size) * 0.015);
    }

    .params-section-title {
      font-size: calc(var(--canvas-size) * 0.02);
      text-transform: uppercase;
      color: var(--ui-ink);
      margin-bottom: calc(var(--canvas-size) * 0.01);
    }

    .params-section-header .params-section-title {
      margin-bottom: 0;
    }

    .params-subsection-title {
      font-size: calc(var(--canvas-size) * 0.016);
      text-transform: uppercase;
      color: var(--ui-ink-muted);
      margin-top: calc(var(--canvas-size) * 0.015);
      margin-bottom: calc(var(--canvas-size) * 0.005);
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .params-subsection-title:first-child {
      margin-top: 0;
    }

    /* Range vs Multi Toggle Button */
    .mode-toggle {
      cursor: pointer;
      width: calc(var(--canvas-size) * 0.045);
      display: flex;
      align-items: center;
    }

    .mode-toggle input {
      display: none;
    }

    .mode-toggle svg {
      width: 100%;
      height: auto;
      color: var(--ui-ink);
    }

    .mode-toggle .icon-range {
      display: none;
    }

    .mode-toggle input:checked~.icon-range {
      display: block;
    }

    .mode-toggle input:checked~.icon-multi {
      display: none;
    }

    .height-filter-list {
      display: flex;
      flex-wrap: wrap;
      gap: calc(var(--canvas-size) * 0.01) 0;
      /* vertical gap only, horizontal handled natively by cells */
    }

    .height-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(var(--canvas-size) * 0.03);
      min-width: calc(var(--canvas-size) * 0.064);

      /* ASYMMETRICAL PADDING ALIGNMENT FIX */
      /* Left padding matches text centering intent. 
         Right padding is increased to contain the physical visual gap between pills.
         This mathematically locks the visual left edge to 0, aligning it perfectly with checkboxes above!
      */
      padding: 0 calc(var(--canvas-size) * 0.025) 0 calc(var(--canvas-size) * 0.015);

      color: var(--ui-ink);
      font-family: 'Space Mono', monospace;
      font-size: calc(var(--canvas-size) * 0.018);
      cursor: pointer;
    }

    .height-cell::before {
      content: '';
      position: absolute;
      /* Inset only applies to the right, creating the physical gap while keeping the left edge locked at 0 */
      inset: 0 calc(var(--canvas-size) * 0.01) 0 0;
      border: 2px solid var(--ui-ink);
      border-radius: 999px;
      z-index: 0;
    }

    .height-cell span {
      position: relative;
      z-index: 1;
    }

    /* Active Multi-Select & Range States */
    .height-cell.is-selected,
    .height-cell.in-range {
      color: var(--ui-bg);
    }

    .height-cell.is-selected::before,
    .height-cell.in-range::before {
      background-color: var(--ui-ink);
      border-color: transparent;
    }

    /* Calendar Range Extending Logic */
    .height-cell.in-range::before {
      inset: 0;
      /* Bridges right gap completely to touch adjacent cell */
      border-radius: 0;
      /* Squares off corners */
    }

    .height-cell.range-start::before {
      inset: 0;
      /* Bridges right gap completely */
      border-radius: 999px 0 0 999px;
    }

    .height-cell.range-end::before {
      inset: 0 calc(var(--canvas-size) * 0.01) 0 0;
      /* Preserves right gap as this is the end */
      border-radius: 0 999px 999px 0;
    }

    .height-cell.range-start.range-end::before {
      inset: 0 calc(var(--canvas-size) * 0.01) 0 0;
      /* Preserves right gap */
      border-radius: 999px;
    }

    .settings-list {
      display: flex;
      flex-direction: column;
      gap: calc(var(--canvas-size) * 0.01);
    }

    .palette-filter-list {
      display: flex;
      flex-direction: column;
      gap: calc(var(--canvas-size) * 0.01);
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: calc(var(--canvas-size) * 0.012);
      font-size: calc(var(--canvas-size) * 0.018);
      text-transform: uppercase;
      cursor: pointer;
    }

    .setting-item input {
      appearance: none;
      -webkit-appearance: none;
      width: calc(var(--canvas-size) * 0.022);
      height: calc(var(--canvas-size) * 0.022);
      flex: 0 0 auto;
      border: 2px solid var(--ui-ink);
      border-radius: 4px;
      background-color: transparent;
      margin: 0;
      cursor: pointer;
    }

    .setting-item input:checked {
      border-color: var(--ui-ink);
      background-color: var(--ui-ink);
      box-shadow: inset 0 0 0 2px var(--ui-bg);
    }

    .setting-item code {
      font-family: 'Space Mono', monospace;
      font-size: calc(var(--canvas-size) * 0.018);
      color: var(--ui-ink);
    }

    .params-actions {
      display: flex;
      gap: calc(var(--canvas-size) * 0.015);
      flex-wrap: wrap;
      font-size: calc(var(--canvas-size) * 0.018);
      text-transform: uppercase;
    }

    .params-link {
      font-family: 'Space Mono', monospace;
      font-size: calc(var(--canvas-size) * 0.018);
      text-transform: uppercase;
      color: var(--ui-ink);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-box-trim: trim-both;
      text-box-edge: cap alphabetic;
    }

    .svg-container {
      position: relative;
      width: var(--canvas-size);
      height: var(--canvas-size);
      background: #000;
    }

    .svg-out {
      display: block;
      width: 100%;
      height: 100%;
    }

    svg,
    path {
      shape-rendering: crispEdges;
    }

    .metadata-overlay {
      position: absolute;
      top: calc(var(--canvas-size) * 0.015);
      left: calc(var(--canvas-size) * 0.015);
      display: flex;
      flex-direction: column;
      gap: calc(var(--canvas-size) * 0.015);
      color: var(--ui-ink);
      z-index: 2;
      text-transform: uppercase;
      width: calc(var(--canvas-size) * 0.375);
    }

    .logo-overlay {
      position: absolute;
      right: calc(var(--canvas-size) * 0.01);
      bottom: calc(var(--canvas-size) * 0.01);
      width: calc(var(--canvas-size) * 0.09);
      height: calc(var(--canvas-size) * 0.03);
      z-index: 3;
      pointer-events: none;
    }

    .logo-overlay svg {
      display: block;
    }

    .export-overlay {
      position: absolute;
      left: calc(var(--canvas-size) * 0.015);
      bottom: calc(var(--canvas-size) * 0.015);
      display: flex;
      flex-direction: row;
      gap: calc(var(--canvas-size) * 0.015);
      z-index: 10;
    }

    .is-hidden {
      display: none !important;
    }

    .download-btn {
      font-family: 'Space Mono', monospace;
      font-weight: 400;
      font-size: calc(var(--canvas-size) * 0.029);
      text-transform: uppercase;
      color: var(--ui-ink);
      white-space: nowrap;
      text-box-trim: trim-both;
      text-box-edge: cap alphabetic;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
    }

    .arrow-symbol {
      font-family: 'Space Grotesk', sans-serif;
      display: inline-block;
      margin-left: 0.3em;
    }

    .stat {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: baseline;
      column-gap: calc(var(--canvas-size) * 0.016);
      width: 100%;
      font-size: calc(var(--canvas-size) * 0.024);
      color: var(--ui-ink-muted);
    }

    .stat+.stat {
      padding-top: calc(var(--canvas-size) * 0.015);
      border-top: var(--rule-width) solid var(--ui-rule);
    }

    .stat-value {
      color: var(--ui-ink);
      justify-self: end;
    }

    .stat-suffix {
      color: var(--ui-ink-muted);
    }

    .shapes-list .stat {
      color: var(--ui-ink-muted);
      padding-top: calc(var(--canvas-size) * 0.015);
      padding-bottom: calc(var(--canvas-size) * 0.015);
      border-top: none;
    }

    .shapes-list .stat:first-child {
      border-top: var(--rule-width) solid var(--ui-rule);
    }

    .shapes-list .stat+.stat {
      border-top: var(--rule-width) solid var(--ui-rule);
    }

    .shapes-list .stat:last-child {
      border-bottom: var(--rule-width) solid var(--ui-rule);
    }

    .palette-dots {
      grid-column: 1 / -1;
      display: flex;
      width: 100%;
      gap: 0;
      flex-wrap: nowrap;
      margin-top: calc(var(--canvas-size) * 0.008);
      border: var(--rule-width) solid var(--ui-rule);
      border-radius: calc(var(--canvas-size) * 0.03);
      overflow: hidden;
    }

    .dot {
      flex: 1 1 0;
      height: calc(var(--canvas-size) * 0.02);
      flex-shrink: 1;
    }

    @media (max-width: 640px) {
      :root {
        --page-pad-x: 16px;
        --page-pad-y: 16px;
      }

      .app {
        flex-direction: column;
        gap: 24px;
      }

      .params-panel {
        width: 100%;
        max-height: none;
      }
    }
  </style>
</head>

<body>
  <div id="app" class="app">
    <div id="canvas-wrap" class="canvas-wrap">
      <div id="svg-container" class="svg-container">
        <svg id="svg-out" class="svg-out" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"></svg>

        <div id="metadata-overlay" class="metadata-overlay">
          <div class="stat">
            <span class="stat-label">Palette</span>
            <span class="stat-value" id="pal-name">—</span>
            <div id="palette-dots" class="palette-dots"></div>
          </div>

          <div class="stat">
            <span class="stat-label">Height</span>
            <span class="stat-value"><span id="stack-height">—</span><span class="stat-suffix"> units</span></span>
          </div>
          <div class="stat" id="shapes-heading">
            <span class="stat-label">Shapes</span>
            <span class="stat-value" id="shape-count">—</span>
          </div>
          <div id="shapes-list" class="shapes-list" aria-labelledby="shapes-heading"></div>
        </div>

        <div id="logo-overlay" class="logo-overlay">
          <svg viewBox="0 0 90 30" preserveAspectRatio="xMaxYMax meet" xmlns="http://www.w3.org/2000/svg">
            <g fill="var(--ui-ink-muted)">
              <rect width="24" height="6" />
              <rect y="16" width="24" height="6" />
              <rect y="24" width="12" height="6" />
              <rect x="12" y="8" width="18" height="6" />

              <rect x="30" y="8" width="24" height="6" />
              <rect x="30" y="24" width="24" height="6" />
              <rect x="36" width="24" height="6" />
              <rect x="36" y="16" width="24" height="6" />

              <rect x="60" width="24" height="6" />
              <rect x="60" y="16" width="24" height="6" />
              <rect x="60" y="24" width="12" height="6" />
              <rect x="72" y="8" width="18" height="6" />
              <rect x="78" y="24" width="12" height="6" />
            </g>
          </svg>
        </div>

        <div id="export-overlay" class="export-overlay">
          <button class="download-btn" id="download-png-btn">PNG<span class="arrow-symbol">↓</span></button>
          <button class="download-btn" id="download-svg-btn">SVG<span class="arrow-symbol">↓</span></button>
        </div>
      </div>
    </div>
    <aside id="params-panel" class="params-panel">
      <div class="params-title">
        <span>Parameters</span>
        <button class="shuffle-btn" id="panel-shuffle-btn" title="Regenerate">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2"
            stroke-miterlimit="10" stroke-linecap="square">
            <path d="M15.625 11.875L17.5 13.75L15.625 15.625" />
            <path d="M15.625 4.375L17.5 6.25L15.625 8.125" />
            <path d="M2.5 13.75H7.5L9.84375 10.1562" />
            <path d="M2.5 6.25H7.5L12.5 13.75H16.25" />
            <path d="M16.25 6.25H12.5L11.25 8.125" />
          </svg>
        </button>
      </div>

      <div class="params-section">
        <div class="params-section-title">Render Mode</div>
        <div class="settings-list">
          <label class="setting-item">
            <input type="checkbox" id="toggle-outline" checked>
            <code>Outline</code>
          </label>
          <label class="setting-item">
            <input type="checkbox" id="toggle-metadata" checked>
            <code>Metadata</code>
          </label>
          <label class="setting-item">
            <input type="checkbox" id="toggle-export" checked>
            <code>Export</code>
          </label>
        </div>
      </div>
      <div class="params-section">
        <div class="params-section-header">
          <div class="params-section-title">Height</div>
          <label class="mode-toggle" title="Toggle Range Mode">
            <input type="checkbox" id="toggle-range-mode">
            <svg class="icon-multi" viewBox="0 0 36 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="6" cy="8" r="4" fill="currentColor" />
              <circle cx="18" cy="8" r="4" fill="currentColor" />
              <circle cx="30" cy="8" r="4" fill="currentColor" />
            </svg>
            <svg class="icon-range" viewBox="0 0 36 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="6" y1="8" x2="30" y2="8" stroke="currentColor" stroke-width="2"
                vector-effect="non-scaling-stroke" />
              <circle cx="6" cy="8" r="4" fill="currentColor" />
              <circle cx="30" cy="8" r="4" fill="currentColor" />
            </svg>
          </label>
        </div>
        <div id="height-filter-container" class="height-filter-list"></div>
      </div>
      <div class="params-section">
        <div class="params-section-title">Palettes</div>
        <div id="palette-filter-list" class="palette-filter-list"></div>
      </div>
      <div class="params-actions">
        <button class="params-link" id="select-none-btn" type="button">clear all</button>
      </div>
    </aside>
  </div>
  <script>
    const B = 10;
    const CANVAS = 1000;
    const COL_W = 190;
    // The key hex color for the fixed shape borders: #1C1C1A
    const BLACK = 'rgb(28, 28, 26)';

    // A cohesive generative system: Curated, thematic, and distinct.
    const PALETTES = [
      // 1. THE CLASSICS (Anchored to Warm Cotton, Newsprint, and Kraft papers)
      { name: 'spice', bg: '#f4f1ea', category: 'classic', contrast: 'high', temp: 'warm', colors: ['#c8a98c', '#0e3f39', '#c08e49', '#e2560b', '#a17073', '#695c54'] },
      { name: 'storm', bg: '#e8e6e1', category: 'classic', contrast: 'high', temp: 'warm', colors: ['#1c1a14', '#413819', '#f9cf45', '#fbd78b', '#948572', '#2c2618'] },
      { name: 'flora', bg: '#f4f1ea', category: 'classic', contrast: 'high', temp: 'warm', colors: ['#e07809', '#1f6334', '#df79a1', '#bb1009', '#63671b', '#a8b379'] },
      { name: 'earth', bg: '#e3d8c8', category: 'classic', contrast: 'medium', temp: 'warm', colors: ['#b66b56', '#284571', '#f6b36f', '#da6305', '#6e4354', '#ac9575'] },
      { name: 'sunset', bg: '#f4f1ea', category: 'classic', contrast: 'high', temp: 'warm', colors: ['#ee9340', '#133e71', '#e7bc6d', '#d8721e', '#c58583', '#7f9b9e'] },
      { name: 'ember', bg: '#e3d8c8', category: 'classic', contrast: 'high', temp: 'warm', colors: ['#dd4a14', '#33644f', '#c00b04', '#4d7d87', '#e08a19', '#23172d'] },
      { name: 'copper', bg: '#e3d8c8', category: 'classic', contrast: 'high', temp: 'warm', colors: ['#ed8836', '#362a40', '#53475f', '#cf5100', '#dba778', '#2a1e30'] },
      { name: 'twilight', bg: '#e8e6e1', category: 'classic', contrast: 'medium', temp: 'cool', colors: ['#132a5e', '#cf445b', '#ef5a70', '#452c56', '#eba2a9', '#8a5370'] },
      { name: 'plum', bg: '#f4f1ea', category: 'classic', contrast: 'high', temp: 'cool', colors: ['#e54c3c', '#343c7a', '#a90402', '#938cab', '#6d6789', '#b5aecd'] },
      { name: 'blush', bg: '#f4f1ea', category: 'classic', contrast: 'high', temp: 'warm', colors: ['#275a15', '#a16448', '#d47b6d', '#ff8a8b', '#ce4e4b', '#afca97'] },

      // 2. THE BRIGHTS (Stark backgrounds with vibrant hues and deep, heavy anchor inks)

      { name: 'amethyst', bg: '#fdfcfb', category: 'bright', contrast: 'high', temp: 'cool', colors: ['#a259ff', '#883fe8', '#661ed9', '#150921', '#cda1ee', '#7a30cc'] },
      { name: 'spruce', bg: '#fdfcfb', category: 'bright', contrast: 'high', temp: 'cool', colors: ['#57c7af', '#228e74', '#44aa94', '#0a1a15', '#6dd4be', '#1a7060'] },
      { name: 'ocean', bg: '#f0f2f5', category: 'bright', contrast: 'high', temp: 'cool', colors: ['#05111c', '#355772', '#64808e', '#adc3ce', '#91acb7', '#1e4060'] },
      { name: 'crimson', bg: '#fdfcfb', category: 'bright', contrast: 'high', temp: 'warm', colors: ['#b50e08', '#c94040', '#de7070', '#1c0808', '#a01010', '#801010'] },
      { name: 'topaz', bg: '#fdfcfb', category: 'bright', contrast: 'high', temp: 'warm', colors: ['#e08f0c', '#ecaf30', '#ffe399', '#1c1408', '#c07a00', '#f5c840'] },
      { name: 'ivy', bg: '#fdfcfb', category: 'bright', contrast: 'high', temp: 'warm', colors: ['#268e1b', '#469d3c', '#76c66d', '#1c1c1a', '#95c190', '#3a8a30'] },

      // 3. THE ATMOSPHERES (Tinted wash backgrounds with tonal layers)
      { name: 'breeze', bg: '#e3eef8', category: 'atmosphere', contrast: 'low', temp: 'cool', colors: ['#b8d9f0', '#7ab8e0', '#3e8ec4', '#c8e4f7', '#daeef9', '#5aaad8'] },
      { name: 'lichen', bg: '#e0edea', category: 'atmosphere', contrast: 'low', temp: 'cool', colors: ['#a8e4d8', '#6dd4be', '#44aa94', '#c4ede6', '#b2dfd5', '#228e74'] },
      { name: 'bloom', bg: '#fbe8e8', category: 'atmosphere', contrast: 'low', temp: 'warm', colors: ['#f0a0a0', '#de7070', '#c94040', '#f7c8c8', '#f2b6b6', '#b50e08'] },

      { name: 'ash', bg: '#d0ccc6', category: 'mineral', contrast: 'low', temp: 'neutral', colors: ['#1a1816', '#3c3a38', '#606060', '#909090', '#c0c0be', '#f0eee8'] },

      { name: 'ivory', bg: '#ece9df', category: 'mineral', contrast: 'high', temp: 'warm', colors: ['#f9f9f9', '#141414', '#222222', '#3a3a39', '#8a8986', '#c8c6c0'] },
      { name: 'flint', bg: '#f4f4f4', category: 'mineral', contrast: 'high', temp: 'cool', colors: ['#ffffff', '#050505', '#151515', '#2a2a2a', '#73777a', '#b5b8ba'] },
    ];

    const SHAPES = {
      'O-1': { piece: 'O', rotation: 0, blocks: 2, units: 1, width: 1, height: 1, area: 1, mask: ['1'] },
      'O-4': { piece: 'O', rotation: 0, blocks: 2, units: 4, width: 2, height: 2, area: 4, mask: ['11', '11'] },

      'I-3-R90': { piece: 'I', rotation: 90, blocks: 4, units: 3, width: 3, height: 1, area: 3, mask: ['111'] },
      'I-4-R0': { piece: 'I', rotation: 0, blocks: 4, units: 4, width: 1, height: 4, area: 4, mask: ['1', '1', '1', '1'] },
      'I-4-R90': { piece: 'I', rotation: 90, blocks: 4, units: 4, width: 4, height: 1, area: 4, mask: ['1111'] },
      'J-3-R0': { piece: 'J', rotation: 0, blocks: 4, units: 3, width: 2, height: 2, area: 4, mask: ['01', '11'] },
      'J-3-R90': { piece: 'J', rotation: 90, blocks: 4, units: 3, width: 2, height: 2, area: 4, mask: ['10', '11'] },
      'J-3-R180': { piece: 'J', rotation: 180, blocks: 4, units: 3, width: 2, height: 2, area: 4, mask: ['11', '10'] },
      'J-3-R270': { piece: 'J', rotation: 270, blocks: 4, units: 3, width: 2, height: 2, area: 4, mask: ['11', '01'] },
      'J-4-R0': { piece: 'J', rotation: 0, blocks: 6, units: 4, width: 2, height: 3, area: 6, mask: ['01', '01', '11'] },
      'J-4-R90': { piece: 'J', rotation: 90, blocks: 6, units: 4, width: 3, height: 2, area: 6, mask: ['100', '111'] },
      'J-4-R180': { piece: 'J', rotation: 180, blocks: 6, units: 4, width: 2, height: 3, area: 6, mask: ['11', '10', '10'] },
      'J-4-R270': { piece: 'J', rotation: 270, blocks: 6, units: 4, width: 3, height: 2, area: 6, mask: ['111', '001'] },
      'L-4-R0': { piece: 'L', rotation: 0, blocks: 6, units: 4, width: 2, height: 3, area: 6, mask: ['10', '10', '11'] },
      'L-4-R90': { piece: 'L', rotation: 90, blocks: 6, units: 4, width: 3, height: 2, area: 6, mask: ['111', '100'] },
      'L-4-R180': { piece: 'L', rotation: 180, blocks: 6, units: 4, width: 2, height: 3, area: 6, mask: ['11', '01', '01'] },
      'L-4-R270': { piece: 'L', rotation: 270, blocks: 6, units: 4, width: 3, height: 2, area: 6, mask: ['001', '111'] },
      'T-4-R0': { piece: 'T', rotation: 0, blocks: 8, units: 4, width: 3, height: 2, area: 6, mask: ['111', '010'] },
      'T-4-R90': { piece: 'T', rotation: 90, blocks: 8, units: 4, width: 2, height: 3, area: 6, mask: ['01', '11', '01'] },
      'T-4-R180': { piece: 'T', rotation: 180, blocks: 8, units: 4, width: 3, height: 2, area: 6, mask: ['010', '111'] },
      'T-4-R270': { piece: 'T', rotation: 270, blocks: 8, units: 4, width: 2, height: 3, area: 6, mask: ['10', '11', '10'] },
      'S-4-R0': { piece: 'S', rotation: 0, blocks: 8, units: 4, width: 3, height: 2, area: 6, mask: ['011', '110'] },
      'S-4-R90': { piece: 'S', rotation: 90, blocks: 8, units: 4, width: 2, height: 3, area: 6, mask: ['10', '11', '01'] },
      'Z-4-R0': { piece: 'Z', rotation: 0, blocks: 8, units: 4, width: 3, height: 2, area: 6, mask: ['110', '011'] },
      'Z-4-R90': { piece: 'Z', rotation: 90, blocks: 8, units: 4, width: 2, height: 3, area: 6, mask: ['01', '11', '10'] },
    };

    const UNIT_SIZE = 100;
    const UNIT_STEP = UNIT_SIZE - B;
    const TARGET_BLOCKS = 16;
    const STACK_EDGE_MARGIN = 15;
    const MAX_STACK_HEIGHT_UNITS = Math.floor((CANVAS - (STACK_EDGE_MARGIN * 2) - B) / UNIT_STEP);
    const FAMILY_ORDER = ['O', 'I', 'J', 'L', 'T', 'S', 'Z'];
    const SHAPE_PRIORITY = { J: 0, L: 1, T: 2, S: 3, Z: 4, I: 5, O: 6 };
    const MAX_SOLUTIONS = 96;
    const MAX_SOLUTIONS_PER_HEIGHT = 24;

    // GLOBAL STATE
    let currentData = null;
    let heightMode = 'multi';
    let selectedHeightsMulti = new Set();
    let rangeStart = null;
    let rangeEnd = null;

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function shuffle(arr) {
      const copy = arr.slice();
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }
    function randFrom(palette, exclude) {
      const pool = palette.filter(c => !exclude || !exclude.includes(c));
      return pick(pool.length ? pool : palette);
    }
    function getShapeCells(shape) {
      const cells = [];
      shape.mask.forEach((row, rowIndex) => {
        [...row].forEach((cell, columnIndex) => {
          if (cell === '1') {
            cells.push({ x: columnIndex, y: shape.height - 1 - rowIndex });
          }
        });
      });
      return cells;
    }
    function createShapeCatalog() {
      return Object.fromEntries(Object.entries(SHAPES).map(([id, shape]) => [id, { id, ...shape, cells: getShapeCells(shape) }]));
    }
    const SHAPE_CATALOG = createShapeCatalog();
    const BASE_STACK_SHAPES = Object.values(SHAPE_CATALOG)
      .filter(shape => shape.width <= 2)
      .sort((a, b) => {
        if (b.blocks !== a.blocks) return b.blocks - a.blocks;
        if (b.units !== a.units) return b.units - a.units;
        if (SHAPE_PRIORITY[a.piece] !== SHAPE_PRIORITY[b.piece]) return SHAPE_PRIORITY[a.piece] - SHAPE_PRIORITY[b.piece];
        return a.id.localeCompare(b.id);
      });
    const POSSIBLE_HEIGHTS = Array.from({ length: MAX_STACK_HEIGHT_UNITS - 3 }, (_, index) => MAX_STACK_HEIGHT_UNITS - index);
    const STRICT_SHAPE_IDS = new Set(['O-1', 'O-4', 'I-2-R0', 'I-2-R90', 'I-3-R0', 'I-4-R0']);

    function addRect(svg, x, y, w, h, fill) {
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', x); r.setAttribute('y', y);
      r.setAttribute('width', w); r.setAttribute('height', h);
      r.setAttribute('fill', fill);
      svg.appendChild(r);
    }

    function createGrid(height) {
      return Array.from({ length: height }, () => [false, false]);
    }
    function countEmptyCells(grid) {
      return grid.reduce((total, row) => total + row.filter(cell => !cell).length, 0);
    }
    function findFirstEmptyCell(grid) {
      for (let y = 0; y < grid.length; y += 1) {
        for (let x = 0; x < 2; x += 1) {
          if (!grid[y][x]) return { x, y };
        }
      }
      return null;
    }
    function getAllowedOffsets(shape) {
      return shape.width === 1 ? [0, 1] : [0];
    }
    function placementCoversCell(shape, x, y, targetX, targetY) {
      return shape.cells.some(cell => cell.x + x === targetX && cell.y + y === targetY);
    }
    function canPlaceShape(grid, shape, x, y) {
      return shape.cells.every(cell => {
        const gridX = x + cell.x;
        const gridY = y + cell.y;
        return gridX >= 0 && gridX < 2 && gridY >= 0 && gridY < grid.length && !grid[gridY][gridX];
      });
    }
    function applyShape(grid, shape, x, y, value) {
      shape.cells.forEach(cell => {
        grid[y + cell.y][x + cell.x] = value;
      });
    }

    function searchStack(grid, targetHeight, blocksUsed, placements, solutions, requiredShapeIds, stackShapes, stackShapeWeights, minBlocksPerUnit, maxBlocksPerUnit) {
      if (solutions.length >= MAX_SOLUTIONS) return;
      if (blocksUsed > TARGET_BLOCKS) return;
      const remainingUnits = countEmptyCells(grid);
      if (blocksUsed + (remainingUnits * minBlocksPerUnit) > TARGET_BLOCKS) return;
      if (blocksUsed + (remainingUnits * maxBlocksPerUnit) < TARGET_BLOCKS) return;

      const firstEmpty = findFirstEmptyCell(grid);
      if (!firstEmpty) {
        if (blocksUsed === TARGET_BLOCKS && includesRequiredShapes(placements, requiredShapeIds)) {
          solutions.push(placements.map(placement => ({ id: placement.id, x: placement.x, y: placement.y })));
        }
        return;
      }

      const options = buildPlacementOptions(grid, targetHeight, firstEmpty, stackShapes, stackShapeWeights);
      for (const option of options) {
        applyShape(grid, option.shape, option.x, option.y, true);
        placements.push({ id: option.shape.id, x: option.x, y: option.y });
        searchStack(grid, targetHeight, blocksUsed + option.shape.blocks, placements, solutions, requiredShapeIds, stackShapes, stackShapeWeights, minBlocksPerUnit, maxBlocksPerUnit);
        placements.pop();
        applyShape(grid, option.shape, option.x, option.y, false);
        if (solutions.length >= MAX_SOLUTIONS) return;
      }
    }

    function buildPlacementOptions(grid, targetHeight, firstEmpty, stackShapes, stackShapeWeights) {
      const placements = [];
      stackShapes.forEach(shape => {
        getAllowedOffsets(shape).forEach(x => {
          const minY = Math.max(0, firstEmpty.y - (shape.height - 1));
          const maxY = Math.min(firstEmpty.y, targetHeight - shape.height);
          for (let y = minY; y <= maxY; y += 1) {
            if (!placementCoversCell(shape, x, y, firstEmpty.x, firstEmpty.y)) continue;
            if (!canPlaceShape(grid, shape, x, y)) continue;
            const weight = stackShapeWeights.get(shape.id) || 1;
            for (let count = 0; count < weight; count += 1) {
              placements.push({ shape, x, y });
            }
          }
        });
      });
      return shuffle(placements);
    }

    function includesRequiredShapes(placements, requiredShapeIds) {
      if (!requiredShapeIds.length) return true;
      const used = new Set(placements.map(placement => placement.id));
      return requiredShapeIds.every(id => used.has(id));
    }

    function solveStack(requiredShapeIds = [], selectedHeights = []) {
      const stackShapes = BASE_STACK_SHAPES.filter(shape => STRICT_SHAPE_IDS.has(shape.id));
      const stackShapeWeights = new Map(stackShapes.map(shape => [shape.id, 1]));
      const minBlocksPerUnit = Math.min(...stackShapes.map(shape => shape.blocks / shape.units));
      const maxBlocksPerUnit = Math.max(...stackShapes.map(shape => shape.blocks / shape.units));
      const allSolutions = [];
      const heights = selectedHeights.length ? selectedHeights : POSSIBLE_HEIGHTS;
      for (const targetHeight of shuffle(heights)) {
        const grid = createGrid(targetHeight);
        const solutions = [];
        searchStack(grid, targetHeight, 0, [], solutions, requiredShapeIds, stackShapes, stackShapeWeights, minBlocksPerUnit, maxBlocksPerUnit);
        if (solutions.length) {
          solutions.slice(0, MAX_SOLUTIONS_PER_HEIGHT).forEach(placements => {
            allSolutions.push({ placements, heightUnits: targetHeight });
          });
          if (allSolutions.length >= MAX_SOLUTIONS) break;
        }
      }
      return allSolutions.length ? pick(allSolutions) : null;
    }

    function getLuminance(hex) {
      const c = hex.replace('#', '');
      const r = parseInt(c.slice(0, 2), 16) / 255;
      const g = parseInt(c.slice(2, 4), 16) / 255;
      const b = parseInt(c.slice(4, 6), 16) / 255;
      const toLinear = x => x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
      return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function isLight(hex) { return getLuminance(hex) > 0.35; }

    function render() {
      if (!currentData) return;
      const { placements, heightUnits, pal } = currentData;
      const showInkBorder = document.getElementById('toggle-outline')?.checked;

      const svg = document.getElementById('svg-out');
      svg.innerHTML = '';

      const stackHeightPx = (heightUnits * UNIT_STEP) + B;
      const offsetX = Math.round((CANVAS - COL_W) / 2);
      const offsetY = Math.round((CANVAS - stackHeightPx) / 2);

      // Lock dimensions explicitly for PNG export
      svg.setAttribute('viewBox', `0 0 ${CANVAS} ${CANVAS}`);
      svg.setAttribute('width', CANVAS);
      svg.setAttribute('height', CANVAS);

      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('width', CANVAS); bg.setAttribute('height', CANVAS); bg.setAttribute('fill', pal.bg);
      svg.appendChild(bg);

      placements.forEach(placement => {
        const shape = SHAPE_CATALOG[placement.id];
        const color = placement.color; // Using pre-assigned color

        const occupied = new Set(shape.cells.map(cell => `${cell.x},${cell.y}`));
        shape.cells.forEach(cell => {
          const cellX = offsetX + ((placement.x + cell.x) * UNIT_STEP);
          const gridY = placement.y + cell.y;
          const cellY = offsetY + ((heightUnits - 1 - gridY) * UNIT_STEP);

          const insetLeft = occupied.has(`${cell.x - 1},${cell.y}`) ? 0 : B;
          const insetRight = occupied.has(`${cell.x + 1},${cell.y}`) ? 0 : B;
          const insetTop = occupied.has(`${cell.x},${cell.y + 1}`) ? 0 : B;
          const insetBottom = occupied.has(`${cell.x},${cell.y - 1}`) ? 0 : B;

          // If ink borders are OFF, show background color in the gaps (floating look)
          const effectiveGapColor = showInkBorder ? BLACK : pal.bg;

          addRect(svg, cellX, cellY, UNIT_SIZE, UNIT_SIZE, effectiveGapColor);
          addRect(
            svg,
            cellX + insetLeft,
            cellY + insetTop,
            UNIT_SIZE - insetLeft - insetRight,
            UNIT_SIZE - insetTop - insetBottom,
            color
          );
        });
      });

      // ADAPT UI COLORS (Unifying all UI elements & Parameters Panel)
      const lightBg = isLight(pal.bg);
      const baseRGB = lightBg ? '28, 28, 26' : '240, 238, 232';

      const root = document.documentElement;
      root.style.setProperty('--ui-bg', pal.bg);
      root.style.setProperty('--ui-ink', `rgba(${baseRGB}, 0.9)`);
      root.style.setProperty('--ui-ink-muted', `rgba(${baseRGB}, 0.5)`);
      root.style.setProperty('--ui-rule', `rgba(${baseRGB}, 0.1)`);

      // Info panel updates
      const shapeCountEl = document.getElementById('shape-count');
      if (shapeCountEl) shapeCountEl.textContent = placements.length;

      const stackHeightEl = document.getElementById('stack-height');
      if (stackHeightEl) stackHeightEl.textContent = heightUnits;

      const palNameEl = document.getElementById('pal-name');
      if (palNameEl) palNameEl.textContent = pal.name;

      const dots = document.getElementById('palette-dots');
      if (dots) {
        dots.innerHTML = '';
        [pal.bg, ...pal.colors].forEach((c, i) => {
          const d = document.createElement('div');
          d.className = 'dot'; d.style.background = c;
          if (i === 0) d.title = 'background';
          dots.appendChild(d);
        });
      }

      const shapesList = document.getElementById('shapes-list');
      if (shapesList) {
        shapesList.innerHTML = '';
        const counts = placements.reduce((acc, p) => {
          const piece = SHAPE_CATALOG[p.id].piece;
          acc[piece] = (acc[piece] || 0) + 1;
          return acc;
        }, {});
        FAMILY_ORDER.filter(piece => counts[piece]).forEach(piece => {
          const stat = document.createElement('div');
          stat.className = 'stat';
          stat.innerHTML = `<span class="stat-label">${piece}</span><span class="stat-value">${counts[piece]}</span>`;
          shapesList.appendChild(stat);
        });
      }
    }

    function generate(preservePalette = false) {
      const selectedPaletteNames = [...document.querySelectorAll('#palette-filter-list input:checked')].map(i => i.value);
      const availablePalettes = selectedPaletteNames.length ? PALETTES.filter(p => selectedPaletteNames.includes(p.name)) : PALETTES;

      let pal;
      if (preservePalette && currentData && availablePalettes.some(p => p.name === currentData.pal.name)) {
        pal = currentData.pal;
      } else {
        pal = pick(availablePalettes);
      }

      const toggleBorder = document.getElementById('toggle-outline');
      // Only auto-toggle outline if NO palettes are explicitly selected (full random mode).
      // If the user has filtered to specific palettes, respect their current Outline toggle state.
      if (!preservePalette && toggleBorder) {
        if (selectedPaletteNames.length === 0) {
          toggleBorder.checked = !(pal.category === 'muted' || pal.category === 'void');
        }
      }

      const requiredShapeIds = []; // Shape filters removed
      const selectedHeights = getActiveHeights();

      const solution = solveStack(requiredShapeIds, selectedHeights);
      if (!solution) return;

      let prevColor = null;
      const placementsWithColors = solution.placements
        .map(p => ({ ...p, shape: SHAPE_CATALOG[p.id] }))
        .sort((a, b) => a.y - b.y || a.x - b.x || a.id.localeCompare(b.id))
        .map(p => {
          const color = randFrom(pal.colors, prevColor ? [prevColor] : []);
          prevColor = color;
          return { ...p, color };
        });

      currentData = {
        placements: placementsWithColors,
        heightUnits: solution.heightUnits,
        pal
      };

      render();
    }

    function getActiveHeights() {
      if (heightMode === 'multi') {
        return Array.from(selectedHeightsMulti);
      } else {
        if (rangeStart !== null && rangeEnd !== null) {
          const min = Math.min(rangeStart, rangeEnd);
          const max = Math.max(rangeStart, rangeEnd);
          return POSSIBLE_HEIGHTS.filter(h => h >= min && h <= max);
        } else if (rangeStart !== null) {
          return [rangeStart];
        } else {
          return []; // Fallback 
        }
      }
    }

    function renderHeightList() {
      const hList = document.getElementById('height-filter-container');
      if (!hList) return;
      hList.innerHTML = '';

      POSSIBLE_HEIGHTS.slice().sort((a, b) => a - b).forEach(h => {
        const cell = document.createElement('div');
        cell.className = 'height-cell';

        // Determine interaction classes
        if (heightMode === 'multi') {
          if (selectedHeightsMulti.has(h)) cell.classList.add('is-selected');
        } else {
          if (rangeStart !== null && rangeEnd !== null) {
            const min = Math.min(rangeStart, rangeEnd);
            const max = Math.max(rangeStart, rangeEnd);
            if (h >= min && h <= max) {
              cell.classList.add('in-range');
              if (h === min) cell.classList.add('range-start');
              if (h === max) cell.classList.add('range-end');
            }
          } else if (rangeStart !== null && h === rangeStart) {
            cell.classList.add('in-range', 'range-start', 'range-end');
          }
        }

        cell.innerHTML = `<span>${h}</span>`;

        cell.addEventListener('click', () => {
          if (heightMode === 'multi') {
            if (selectedHeightsMulti.has(h)) selectedHeightsMulti.delete(h);
            else selectedHeightsMulti.add(h);
          } else {
            // Range logic: Click 1 = start, Click 2 = end, Click 3 = reset start
            if (rangeStart === null || (rangeStart !== null && rangeEnd !== null)) {
              rangeStart = h;
              rangeEnd = null;
            } else {
              rangeEnd = h;
            }
          }
          renderHeightList();
          generate(true); // Preserve palette when editing height parameters
        });

        hList.appendChild(cell);
      });
    }

    // INITIALIZATION & BINDING
    function bindParamsPanel() {
      // Range toggle smart listener
      const rangeToggle = document.getElementById('toggle-range-mode');
      if (rangeToggle) {
        rangeToggle.addEventListener('change', (e) => {
          heightMode = e.target.checked ? 'range' : 'multi';

          // Smart state transfer between modes
          if (heightMode === 'range') {
            const arr = Array.from(selectedHeightsMulti).sort((a, b) => a - b);
            if (arr.length > 0) {
              rangeStart = arr[0];
              rangeEnd = arr[arr.length - 1];
            } else {
              rangeStart = null;
              rangeEnd = null;
            }
          } else {
            if (rangeStart !== null && rangeEnd !== null) {
              const min = Math.min(rangeStart, rangeEnd);
              const max = Math.max(rangeStart, rangeEnd);
              selectedHeightsMulti = new Set(POSSIBLE_HEIGHTS.filter(h => h >= min && h <= max));
            } else if (rangeStart !== null) {
              selectedHeightsMulti = new Set([rangeStart]);
            } else {
              selectedHeightsMulti = new Set();
            }
          }
          renderHeightList();
          // Toggling mode no longer regenerates the stack
        });
      }

      renderHeightList();

      const pList = document.getElementById('palette-filter-list');

      // Group palettes visually by category
      const groupedPalettes = {};
      PALETTES.forEach(p => {
        if (!groupedPalettes[p.category]) groupedPalettes[p.category] = [];
        groupedPalettes[p.category].push(p);
      });

      Object.keys(groupedPalettes).forEach(category => {
        const header = document.createElement('div');
        header.className = 'params-subsection-title';
        header.textContent = category;
        header.title = `Toggle all ${category} palettes`;

        const categoryInputs = [];

        header.addEventListener('click', () => {
          const allChecked = categoryInputs.every(input => input.checked);
          categoryInputs.forEach(input => input.checked = !allChecked);
          generate(false);
        });

        pList.appendChild(header);

        groupedPalettes[category].forEach(p => {
          const l = document.createElement('label'); l.className = 'setting-item';
          l.innerHTML = `<input type="checkbox" value="${p.name}"><code>${p.name}</code>`;
          categoryInputs.push(l.querySelector('input'));
          pList.appendChild(l);
        });
      });

      // Palette changes explicitly request a new palette
      pList.addEventListener('change', () => generate(false));

      document.getElementById('toggle-outline')?.addEventListener('change', render);

      document.getElementById('toggle-metadata')?.addEventListener('change', (e) => {
        document.getElementById('metadata-overlay')?.classList.toggle('is-hidden', !e.target.checked);
      });

      document.getElementById('toggle-export')?.addEventListener('change', (e) => {
        document.getElementById('export-overlay')?.classList.toggle('is-hidden', !e.target.checked);
      });

      document.getElementById('select-none-btn')?.addEventListener('click', () => {
        document.querySelectorAll('#params-panel input[type="checkbox"]').forEach(i => i.checked = false);

        // Restore render mode defaults so UI doesn't disappear on clear
        document.getElementById('toggle-outline').checked = true;
        document.getElementById('toggle-metadata').checked = true;
        document.getElementById('toggle-export').checked = true;
        document.getElementById('metadata-overlay')?.classList.remove('is-hidden');
        document.getElementById('export-overlay')?.classList.remove('is-hidden');

        // Reset height state
        heightMode = 'multi';
        selectedHeightsMulti.clear();
        rangeStart = null;
        rangeEnd = null;

        // Reset the mode toggle switch UI visually back to multi
        const rangeToggleEl = document.getElementById('toggle-range-mode');
        if (rangeToggleEl) rangeToggleEl.checked = false;

        renderHeightList();

        // Clearing explicitly requests a new default palette
        generate(false);
      });
    }

    function bindControls() {
      // Manual regeneration explicitly requests a new palette
      document.getElementById('panel-shuffle-btn')?.addEventListener('click', () => generate(false));
      document.getElementById('download-png-btn')?.addEventListener('click', downloadPNG);
      document.getElementById('download-svg-btn')?.addEventListener('click', downloadSVG);
    }

    function bindShortcuts() {
      document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey) return;
        const key = e.key.toLowerCase();
        if (key === 'r') generate(false);
        if (key === 'i') {
          const paramsPanel = document.getElementById('params-panel');
          const isHiding = !paramsPanel.classList.contains('is-hidden');

          if (isHiding) {
            // Hide all UI elements to enter clean presentation mode
            ['metadata-overlay', 'logo-overlay', 'export-overlay', 'params-panel'].forEach(id => {
              document.getElementById(id)?.classList.add('is-hidden');
            });
          } else {
            // Show core UI elements
            paramsPanel.classList.remove('is-hidden');
            document.getElementById('logo-overlay')?.classList.remove('is-hidden');

            // Conditionally show toggleable elements based strictly on their checkbox states
            const metadataOverlay = document.getElementById('metadata-overlay');
            const exportOverlay = document.getElementById('export-overlay');

            const showMetadata = document.getElementById('toggle-metadata')?.checked;
            metadataOverlay?.classList.toggle('is-hidden', !showMetadata);

            const showExport = document.getElementById('toggle-export')?.checked;
            exportOverlay?.classList.toggle('is-hidden', !showExport);
          }
        }
        if (key === 'p') downloadPNG();
        if (key === 's') downloadSVG();
      });
    }

    function getSVGString() {
      const svg = document.getElementById('svg-out');
      const clone = svg.cloneNode(true);

      // Ensure explicit dimensions are in the string
      clone.setAttribute('width', CANVAS);
      clone.setAttribute('height', CANVAS);
      if (!clone.getAttribute('xmlns')) {
        clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      }

      return new XMLSerializer().serializeToString(clone);
    }

    function downloadSVG() {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([getSVGString()], { type: 'image/svg+xml' }));
      a.download = '4x4rt-stacks.svg';
      a.click();
    }

    function downloadPNG() {
      const svgString = getSVGString();
      const img = new Image();
      // Using encodeURIComponent is highly reliable for rendering SVGs to Canvas across all browsers
      const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);

      img.onload = () => {
        const c = document.createElement('canvas');
        const scale = 2;
        // Export at 2x resolution
        c.width = CANVAS * scale;
        c.height = CANVAS * scale;
        const ctx = c.getContext('2d');

        // Safari/WebKit Fix: Do NOT use ctx.scale() for SVGs, as it double-scales internal drawing
        // operations against the viewBox, causing shapes to shift to the bottom right and clip.
        // Instead, explicitly draw the image at the scaled destination dimensions.
        ctx.drawImage(img, 0, 0, CANVAS * scale, CANVAS * scale);

        const a = document.createElement('a');
        a.href = c.toDataURL('image/png');
        a.download = '4x4rt-stacks.png';
        a.click();

        URL.revokeObjectURL(url);
      };

      img.onerror = (e) => {
        console.error("PNG rendering failed", e);
        URL.revokeObjectURL(url);
      };

      img.src = url;
    }

    bindControls();
    bindParamsPanel();
    bindShortcuts();
    generate(false);
  </script>
</body>
