<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4x4rt Stacks Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & SCOPE MODIFIERS
       ========================================================================== */
    :root {
      --page-pad-x: 20px;
      --page-pad-y: 20px;
      --app-width-ratio: 1.365;
      --canvas-size: min(100vh - (var(--page-pad-y) * 2), (100vw - (var(--page-pad-x) * 2)) / var(--app-width-ratio));
      /* Modular Scale System */
      --scale-unit: calc(var(--canvas-size) * 0.001);
      --sz-01: calc(var(--scale-unit) * 1);
      --sz-02: calc(var(--scale-unit) * 2);
      --sz-05: calc(var(--scale-unit) * 5);
      --sz-07: calc(var(--scale-unit) * 7);
      --sz-08: calc(var(--scale-unit) * 8);
      --sz-10: calc(var(--scale-unit) * 10);
      --sz-15: calc(var(--scale-unit) * 15);
      --sz-16: calc(var(--scale-unit) * 16);
      --sz-18: calc(var(--scale-unit) * 18);
      --sz-20: calc(var(--scale-unit) * 20);
      --sz-25: calc(var(--scale-unit) * 25);
      --sz-30: calc(var(--scale-unit) * 30);
      --sz-40: calc(var(--scale-unit) * 40);
      --sz-54: calc(var(--scale-unit) * 54);
      --sz-56: calc(var(--scale-unit) * 56);
      --sz-64: calc(var(--scale-unit) * 64);
      --sz-90: calc(var(--scale-unit) * 90);
      --sz-120: calc(var(--scale-unit) * 120);
      --sz-365: calc(var(--scale-unit) * 365);

      --rule-width: max(1px, var(--sz-01));
      --ui-bg: #f4f1ea;
      --ui-ink: rgba(28, 28, 26, 0.9);
      --ui-ink-solid: rgb(28, 28, 26);
      --ui-ink-muted: rgba(28, 28, 26, 0.5);
      --ui-rule: rgba(28, 28, 26, 0.1);
      --ui-border-width: max(1px, var(--sz-02));
      --ui-text-size: var(--sz-15);
      --ui-brand-size: var(--sz-30);
    }

    :root[data-sidebar-state="hidden"] {
      --app-width-ratio: 1;
    }

    :root[data-aspect-ratio="9:16"] {
      --app-width-ratio: 0.9275;
    }

    :root[data-sidebar-state="hidden"][data-aspect-ratio="9:16"] {
      --app-width-ratio: 0.5625;
    }

    /* ==========================================================================
       2. BASE RESET
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
      font-size: inherit;
      line-height: 1;
    }

    button {
      background: transparent;
      border: none;
    }

    body {
      background: var(--ui-bg);
      color: var(--ui-ink);
      font-family: 'Space Mono', monospace;
      line-height: 1.45;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--page-pad-y) var(--page-pad-x);
      min-height: 100vh;
    }

    /* ==========================================================================
       3. CORE LAYOUT
       ========================================================================== */
    .l-app {
      display: flex;
      gap: 0;
      align-items: flex-start;
      width: 100%;
      max-width: 100%;
      justify-content: center;
    }

    .l-canvas {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sz-20);
      width: var(--canvas-size);
    }

    .l-canvas[data-aspect-ratio="9:16"] {
      width: calc((var(--canvas-size) - var(--ui-border-width) * 2) * 0.5625 + var(--ui-border-width) * 2);
    }

    .l-canvas:hover .sidebar-toggle {
      display: flex;
    }

    .l-sidebar {
      position: relative;
      flex: none;
      width: var(--sz-365);
      min-height: var(--canvas-size);
      max-height: var(--canvas-size);
      padding: 0;
      margin-left: calc(var(--ui-border-width) * -1);
      background: var(--ui-bg);
      border: var(--ui-border-width) solid var(--ui-ink-solid);
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .l-sidebar[data-state="collapsed"] {
      display: none !important;
    }

    .sidebar-content {
      padding: var(--sz-20);
      padding-bottom: var(--sz-120);
      flex: 1;
      overflow-y: auto;
    }

    .l-sidebar[data-state="collapsed"] .sidebar-content {
      display: none;
    }

    /* ==========================================================================
       4. SVG & CANVAS UTILITIES
       ========================================================================== */
    .artwork-container {
      position: relative;
      width: 100%;
      height: var(--canvas-size);
      background: var(--ui-bg);
      border: var(--ui-border-width) solid var(--ui-ink-solid);
    }

    .artwork-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    svg,
    path {
      shape-rendering: crispEdges;
    }

    .watermark {
      position: absolute;
      right: var(--sz-20);
      bottom: var(--sz-20);
      width: var(--sz-90);
      height: var(--sz-30);
      z-index: 3;
      pointer-events: none;
    }

    .watermark svg {
      display: block;
    }

    /* ==========================================================================
       5. SIDEBAR UI COMPONENTS
       ========================================================================== */
    .project-header {
      display: flex;
      flex-direction: column;
      gap: var(--sz-08);
      margin-bottom: var(--sz-40);
      font-size: var(--ui-brand-size);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .artist-name {
      color: var(--ui-ink-muted);
    }



    .project-description {
      font-size: var(--ui-text-size);
      line-height: 1.45;
    }

    .params-section {
      padding-top: var(--sz-40);
    }

    .control-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: var(--sz-10);
      width: 100%;
      min-height: var(--sz-56);
      padding: var(--sz-20) 0;
      border: none;
      border-bottom: var(--rule-width) solid var(--ui-rule);
      font-size: var(--ui-text-size);
      text-align: left;
      text-transform: uppercase;
      cursor: default;
    }

    .control-row:hover .icon {
      color: var(--ui-ink);
    }

    .control-row.u-hide-icon {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .control-row[data-interactive="true"] {
      cursor: pointer;
    }

    .control-row[data-interactive="true"]:hover {
      color: var(--ui-ink-muted);
    }

    .control-row[data-interactive="true"]:focus-visible {
      outline: none;
      border-bottom-color: var(--ui-ink-muted);
    }

    .control-label {
      color: var(--ui-ink-muted);
    }

    .control-value {
      justify-self: end;
      white-space: nowrap;
      color: var(--ui-ink);
    }

    .control-suffix {
      color: var(--ui-ink-muted);
    }

    .options-panel {
      display: none;
      padding: var(--sz-16) 0 var(--sz-20);
      border-bottom: var(--rule-width) solid var(--ui-rule);
      color: var(--ui-ink-muted);
      font-size: var(--ui-text-size);
      line-height: 1.45;
    }

    .options-panel[data-state="open"] {
      display: block;
    }

    /* ==========================================================================
       6. SPECIFIC CONTROLS
       ========================================================================== */
    #seed-display:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
      border-radius: var(--sz-02);
    }

    .sidebar-toggle {
      position: absolute;
      top: var(--sz-20);
      right: var(--sz-20);
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--sz-16);
      height: var(--sz-16);
      font-size: var(--ui-text-size);
      cursor: pointer;
      z-index: 10;
      display: none;
    }

    .sidebar-toggle:hover .icon {
      color: var(--ui-ink);
    }

    .sidebar-toggle:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
      border-radius: var(--sz-02);
    }

    .action-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--ui-bg);
      padding: var(--sz-20);
      display: flex;
      gap: var(--sz-10);
      align-items: center;
      z-index: 10;
    }

    .button {
      display: flex;
      align-items: center;
      gap: var(--sz-02);
      padding: var(--sz-05) var(--sz-07) var(--sz-05) var(--sz-10);
      border: var(--ui-border-width) solid var(--ui-ink);
      border-radius: var(--sz-30);
      font-size: var(--ui-text-size);
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.1s ease, color 0.1s ease;
    }

    .button .icon {
      color: var(--ui-ink);
    }

    .button:active {
      background: var(--ui-ink);
      color: var(--ui-bg);
    }

    .button:active .icon {
      color: var(--ui-bg);
    }

    .button:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
    }

    .icon-button {
      margin-left: auto;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-button:hover {
      color: var(--ui-ink-muted);
    }

    .icon-button:hover .icon {
      color: var(--ui-ink);
    }

    .icon-button:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
      border-radius: var(--sz-02);
    }

    .slider {
      position: relative;
      width: 100%;
      height: var(--sz-30);
      margin-top: var(--sz-15);
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }

    .slider-track {
      position: absolute;
      inset: 0;
      background: var(--ui-rule);
      border-radius: 999px;
    }

    .slider-thumb {
      position: absolute;
      height: 100%;
      min-width: var(--sz-54);
      padding: 0 var(--sz-15);
      background-color: var(--ui-ink);
      color: var(--ui-bg);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--sz-18);
      transform: translateX(0);
      z-index: 2;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    .slider-thumb[data-dragging="true"] {
      transition: none;
    }

    .slider-thumb:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
    }

    .toggle-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: var(--sz-30);
      min-width: var(--sz-64);
      padding: 0 var(--sz-25) 0 var(--sz-15);
      font-size: var(--sz-18);
      cursor: pointer;
    }

    .toggle-cell::before {
      content: '';
      position: absolute;
      inset: 0 var(--sz-10) 0 0;
      border: var(--sz-02) solid var(--ui-ink);
      border-radius: 999px;
      z-index: 0;
    }

    .toggle-cell span {
      position: relative;
      z-index: 1;
    }

    .toggle-cell[data-state="selected"],
    .toggle-cell[data-state="in-range"] {
      color: var(--ui-bg);
    }

    .toggle-cell[data-state="selected"]::before,
    .toggle-cell[data-state="in-range"]::before {
      background-color: var(--ui-ink);
      border-color: transparent;
    }

    .toggle-cell[data-state="in-range"]::before {
      inset: 0;
      border-radius: 0;
    }

    .toggle-cell[data-range-edge="start"]::before {
      inset: 0;
      border-radius: 999px 0 0 999px;
    }

    .toggle-cell[data-range-edge="end"]::before {
      inset: 0 var(--sz-10) 0 0;
      border-radius: 0 999px 999px 0;
    }

    .toggle-cell[data-range-edge="start"].range-end::before {
      inset: 0 var(--sz-10) 0 0;
      border-radius: 999px;
    }

    .toggle-cell:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
      border-radius: 999px;
    }

    #seed-display {
      cursor: pointer;
    }

    /* ==========================================================================
       7. ICONS
       ========================================================================== */
    .icon {
      width: var(--sz-16);
      height: var(--sz-16);
      fill: currentColor;
      color: var(--ui-ink-muted);
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .icon-mobile {
      display: none;
    }

    /* ==========================================================================
       8. MEDIA QUERIES
       ========================================================================== */
    @media (max-width: 640px) {
      :root {
        --page-pad-x: 20px;
        --page-pad-y: 20px;
        --canvas-size: calc(100vw - (var(--page-pad-x) * 2));
      }

      .icon-desktop {
        display: none;
      }

      .icon-mobile {
        display: inline-block;
      }

      .l-app {
        flex-direction: column;
        gap: 0;
      }

      .l-sidebar {
        width: 100%;
        min-width: 0;
        max-width: none;
        min-height: auto;
        max-height: none;
        margin-top: calc(var(--ui-border-width) * -1);
        margin-left: 0;
        border: var(--ui-border-width) solid var(--ui-ink-solid);
      }

      .l-canvas[data-aspect-ratio="9:16"]~.l-sidebar {
        width: calc((var(--canvas-size) - var(--ui-border-width) * 2) * 0.5625 + var(--ui-border-width) * 2);
      }

      .l-sidebar[data-state="collapsed"] {
        display: none !important;
      }
    }
  </style>
</head>

    const VALID_PALETTE_NAMES = new Set(PALETTES.map(palette => palette.name));
    // Initialize UI colors from data, not hardcoded CSS
    // Runs synchronously before first paint so there's no flash
    (function initUIColors() {
      const p = PALETTES.find(p => p.name === 'spice') || PALETTES[0];
      const root = document.documentElement;
      root.style.setProperty('--ui-bg', p.bg);
      root.style.setProperty('--ui-ink', 'rgba(28, 28, 26, 0.9)');
      root.style.setProperty('--ui-ink-solid', 'rgb(28, 28, 26)');
      root.style.setProperty('--ui-ink-muted', 'rgba(28, 28, 26, 0.5)');
      root.style.setProperty('--ui-rule', 'rgba(28, 28, 26, 0.1)');
    })();

    // --- DETERMINISTIC PRNG (Seed Engine) ---
    // xmur3: string hasher — converts the seed string into a numeric state used to initialize the PRNG.
    function xmur3(str) {
      for (var i = 0, h = 1779033703 ^ str.length; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = h << 13 | h >>> 19;
      } return function () {
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        return (h ^= h >>> 16) >>> 0;
      }
    }

    // mulberry32: fast 32-bit PRNG — produces deterministic floats in [0, 1) from a numeric seed state.
    function mulberry32(a) {
      return function () {
        var t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
    }

    // Hot function pointer — replaced by setSeed() to switch between seeded and unseeded modes.
    let nextRandom = Math.random;

    function setSeed(seedStr) {
      if (!seedStr) {
        nextRandom = Math.random;
        return;
      }
      const seedFunc = xmur3(seedStr);
      nextRandom = mulberry32(seedFunc());
    }

    function generateRandomSeed() {
      const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let result = '';
      for (let i = 0; i < 6; i++) result += chars[Math.floor(Math.random() * 36)];
      return result;
    }

    // WCAG relative luminance — determines whether to apply light or dark UI ink over a palette background.
    function getLuminance(hex) {
      const c = hex.replace('#', '');
      const r = parseInt(c.slice(0, 2), 16) / 255;
      const g = parseInt(c.slice(2, 4), 16) / 255;
      const b = parseInt(c.slice(4, 6), 16) / 255;
      const toLinear = x => x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
      return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }

    // Threshold of 0.35 is slightly lower than the WCAG midpoint (0.5), biased toward
    // treating mid-tones as 'dark' so the UI renders lighter ink — avoiding muddy mid-tone text.
    function isLight(hex) { return getLuminance(hex) > 0.35; }

    // --- SHAPE CATALOG ---
    // Shape fields:
    //   piece    — internal family code (O, I, J, L, T, S, Z); mapped to UI-facing trait labels in PIECE_TRAIT_LABELS

    //   blocks   — SVG rect count drawn per shape
    //   units    — number of grid cells this shape occupies
    //   width    — bounding box width in grid units
    //   height   — bounding box height in grid units
    //   area     — bounding box area (width × height, includes any empty cells in the bounding box)
    //   mask     — row strings, top-to-bottom: '1' = occupied cell, '0' = empty cell
    //
    // NOTE: J, L, T, S, Z entries are kept here for reference and future projects.
    //       Only O and I shapes are active in this generator (see STRICT_SHAPE_IDS).

    function isPreferredSolution(placements) {

    function searchStack(grid, targetHeight, targetBlocks, blocksUsed, placements, solutions, fallbackSolutions, stackShapes, stackShapeWeights, minBlocksPerUnit, maxBlocksPerUnit) {

        appState.rangeEnd = null;
        appState.selectedHeights = new Set(sanitizedHeights.sort((a, b) => a - b));
      }

      return wasChanged;
    }

    // --- STATE MODULE ---
    const State = {
      refreshValidHeights() {
        POSSIBLE_HEIGHTS = computeValidHeights(appState.targetBlocks);
        return POSSIBLE_HEIGHTS;
      },

      sanitizeHeights() {
        return sanitizeHeightState();
      },

      clearSeed() {
        appState.seed = null;
      },

      setSeed(seed) {
        appState.seed = seed;
      },

      setTargetBlocks(value) {
        appState.targetBlocks = clampToAllowedLimit(value);
        this.clearSeed();
        this.refreshValidHeights();
        this.sanitizeHeights();
        return appState.targetBlocks;
      },

      setRenderFlag(flag, value) {
        appState[flag] = value;
      },

      toggleDisplayLayout() {
        appState.displayLayout = appState.displayLayout === 'art' ? 'poster' : 'art';
      },

      toggleAspectRatio() {
        appState.aspectRatio = appState.aspectRatio === '1:1' ? '9:16' : '1:1';
      },

      toggleSidebar() {
        appState.isSidebarOpen = !appState.isSidebarOpen;
        if (!appState.isSidebarOpen) appState.activeOptionsPanel = null;
      },

      toggleOptionsPanel(panelName) {
        appState.activeOptionsPanel = appState.activeOptionsPanel === panelName ? null : panelName;
      },

      setHeightMode(mode) {
        appState.heightMode = mode;
        if (mode === 'range') {
          const selectedHeights = Array.from(appState.selectedHeights).sort((a, b) => a - b);
          if (selectedHeights.length > 0) {
            appState.rangeStart = selectedHeights[0];
            appState.rangeEnd = selectedHeights[selectedHeights.length - 1];
            const min = Math.min(appState.rangeStart, appState.rangeEnd);
            const max = Math.max(appState.rangeStart, appState.rangeEnd);
            appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(height => height >= min && height <= max));
          } else {
            appState.rangeStart = null;
            appState.rangeEnd = null;
          }
        } else {
          appState.rangeStart = null;
          appState.rangeEnd = null;
        }
        this.sanitizeHeights();
      },

      toggleHeightSelection(height) {
        if (appState.heightMode === 'multi') {
          if (appState.selectedHeights.has(height)) appState.selectedHeights.delete(height);
          else appState.selectedHeights.add(height);
          return;
        }

        if (appState.rangeStart === null || (appState.rangeStart !== null && appState.rangeEnd !== null)) {
          appState.rangeStart = height;
          appState.rangeEnd = null;
          appState.selectedHeights = new Set([height]);
          return;
        }

        appState.rangeEnd = height;
        const min = Math.min(appState.rangeStart, appState.rangeEnd);
        const max = Math.max(appState.rangeStart, appState.rangeEnd);
        appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(value => value >= min && value <= max));
      },

      resetFiltersAndView() {
        appState.heightMode = 'multi';
        appState.selectedHeights.clear();
        appState.rangeStart = null;
        appState.rangeEnd = null;
        appState.showOutline = true;
        appState.showMetadata = true;
        appState.showExport = true;
        appState.displayLayout = 'art';
        appState.aspectRatio = '1:1';
        appState.activeOptionsPanel = null;
        this.clearSeed();
      },

      syncFromDOM() {
        const paletteInputs = document.querySelectorAll('#palette-filter-list input:checked');
        if (paletteInputs.length) appState.selectedPalettes = [...paletteInputs].map(input => input.value);

        const profileInputs = document.querySelectorAll('#profile-filter-list input:checked');
        if (profileInputs.length) appState.selectedProfiles = [...profileInputs].map(input => input.value);

        const outlineEl = document.getElementById('toggle-outline');
        if (outlineEl) appState.showOutline = outlineEl.checked;

        const metadataEl = document.getElementById('toggle-metadata');
        if (metadataEl) appState.showMetadata = metadataEl.checked;

        const exportEl = document.getElementById('toggle-export');
        if (exportEl) appState.showExport = exportEl.checked;
      },

      applyToDOM() {
        document.querySelectorAll('#palette-filter-list input[type="checkbox"]').forEach(checkbox => {
          checkbox.checked = appState.selectedPalettes.includes(checkbox.value);
        });
        document.querySelectorAll('#profile-filter-list input[type="checkbox"]').forEach(checkbox => {
          checkbox.checked = appState.selectedProfiles.includes(checkbox.value);
        });

        const rangeToggleEl = document.getElementById('toggle-range-mode');
        if (rangeToggleEl) rangeToggleEl.checked = (appState.heightMode === 'range');

        const outlineEl = document.getElementById('toggle-outline');
        if (outlineEl) outlineEl.checked = appState.showOutline;

        const metadataEl = document.getElementById('toggle-metadata');
        if (metadataEl) metadataEl.checked = appState.showMetadata;

        const exportEl = document.getElementById('toggle-export');
        if (exportEl) exportEl.checked = appState.showExport;

        Render.renderHeightFilter();
        Render.renderDisplayOptions();
        Render.renderSidebarState();
      },

      buildGenerationParams() {
        return {
          allowedPalettes: appState.selectedPalettes || [],
          allowedProfiles: appState.selectedProfiles || [],
          allowedHeights: Array.from(appState.selectedHeights),
          seed: appState.seed,
          blockLimit: appState.targetBlocks
        };
      },

      parseURL() {
        const params = new URLSearchParams(window.location.search);

        appState.seed = normalizeSeed(params.get('seed'));
        appState.selectedPalettes = parseCommaList(params.get('palettes')).filter(name => VALID_PALETTE_NAMES.has(name));
        appState.selectedProfiles = parseCommaList(params.get('profiles')).filter(profile => VALID_PROFILE_IDS.has(profile));

        appState.showOutline = params.has('outline') ? params.get('outline') !== 'false' : true;
        appState.showMetadata = params.has('meta') ? params.get('meta') !== 'false' : true;
        appState.showExport = params.has('export') ? params.get('export') !== 'false' : true;
        appState.displayLayout = params.get('layout') === 'poster' ? 'poster' : 'art';
        appState.aspectRatio = params.get('ratio') === '9:16' ? '9:16' : '1:1';

        if (params.has('limit')) {
          appState.targetBlocks = clampToAllowedLimit(parseInt(params.get('limit'), 10));
          appState.isLimitVisible = true;
        } else {
          appState.targetBlocks = DEFAULT_LIMIT;
          appState.isLimitVisible = false;
        }

        this.refreshValidHeights();

        const parsedHeights = parseHeightsParam(params.get('heights'));
        appState.heightMode = parsedHeights.heightMode;
        appState.selectedHeights = parsedHeights.selectedHeights;
        appState.rangeStart = parsedHeights.rangeStart;
        appState.rangeEnd = parsedHeights.rangeEnd;

        if (appState.heightMode === 'range' && appState.rangeStart !== null) {
          const min = appState.rangeEnd === null ? appState.rangeStart : Math.min(appState.rangeStart, appState.rangeEnd);
          const max = appState.rangeEnd === null ? appState.rangeStart : Math.max(appState.rangeStart, appState.rangeEnd);
          appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(height => height >= min && height <= max));
        }

        this.sanitizeHeights();
      },

      syncURL() {
        const url = new URL(window.location);
        const searchParams = url.searchParams;

        searchParams.delete('seed');
        searchParams.delete('palettes');
        searchParams.delete('profiles');
        searchParams.delete('heights');
        searchParams.delete('limit');
        searchParams.delete('outline');
        searchParams.delete('meta');
        searchParams.delete('export');
        searchParams.delete('layout');
        searchParams.delete('ratio');

        if (appState.selectedPalettes.length) searchParams.set('palettes', appState.selectedPalettes.join(','));
        if (appState.selectedProfiles.length) searchParams.set('profiles', appState.selectedProfiles.join(','));

        if (appState.selectedHeights.size > 0) {
          if (appState.heightMode === 'range' && appState.rangeStart !== null && appState.rangeEnd !== null) {
            const min = Math.min(appState.rangeStart, appState.rangeEnd);
            const max = Math.max(appState.rangeStart, appState.rangeEnd);
            searchParams.set('heights', `${min}-${max}`);
          } else {
            searchParams.set('heights', Array.from(appState.selectedHeights).sort((a, b) => a - b).join(','));
          }
        }

        if (appState.isLimitVisible) searchParams.set('limit', appState.targetBlocks);
        if (!appState.showOutline) searchParams.set('outline', 'false');
        if (!appState.showMetadata) searchParams.set('meta', 'false');
        if (!appState.showExport) searchParams.set('export', 'false');
        if (appState.displayLayout !== 'art') searchParams.set('layout', appState.displayLayout);
        if (appState.aspectRatio !== '1:1') searchParams.set('ratio', appState.aspectRatio);
        if (appState.seed) searchParams.set('seed', appState.seed);

        const searchString = searchParams.toString().replace(/%2C/g, ',');
        appState.shareUrl = url.origin + url.pathname + (searchString ? `?${searchString}` : '');

        try {
          window.history.replaceState(null, '', appState.shareUrl);
        } catch (error) {
          console.warn('Could not update URL history state in this environment.', error);
        }
      },

      triggerGeneration() {
        this.syncFromDOM();
        let didMutateHeightState = this.sanitizeHeights();
        let wasSeedForced = !!appState.seed;

        let params = this.buildGenerationParams();
        let newArtwork = generateStack(params);

        if (!newArtwork && appState.seed) {
          this.clearSeed();
          wasSeedForced = false;
          params = this.buildGenerationParams();
          newArtwork = generateStack(params);
        }

        if (!newArtwork && appState.selectedHeights.size > 0) {
          appState.selectedHeights.clear();
          appState.rangeStart = null;
          appState.rangeEnd = null;
          didMutateHeightState = this.sanitizeHeights() || didMutateHeightState;
          params = this.buildGenerationParams();
          newArtwork = generateStack(params);
        }

        if (newArtwork) {
          appState.artwork = newArtwork;

          if (!wasSeedForced && appState.selectedPalettes.length === 0) {
            appState.showOutline = !(newArtwork.palette.category === 'muted' || newArtwork.palette.category === 'void');
            const outlineEl = document.getElementById('toggle-outline');
            if (outlineEl) outlineEl.checked = appState.showOutline;
          }

          appState.seed = newArtwork.seed;
          if (didMutateHeightState) Render.renderHeightFilter();
          Render.render();
          this.syncURL();
          return;
        }

        if (didMutateHeightState) Render.renderHeightFilter();
        this.syncURL();
      }
    };

    // --- RENDER MODULE ---
    const Render = {
      renderDisplayOptions() {
        const layoutValue = document.getElementById('layout-value');
        const layoutIcon = document.getElementById('layout-icon');
        if (layoutValue) {
          layoutValue.textContent = appState.displayLayout === 'art' ? 'Art' : 'Poster';
          if (layoutIcon) {
            layoutIcon.querySelector('use').setAttribute('href', appState.displayLayout === 'art' ? '#icon-custom-art-layout' : '#icon-custom-poster-layout');
          }
        }

        const aspectRatioValue = document.getElementById('aspect-ratio-value');
        const aspectIcon = document.getElementById('aspect-ratio-icon');
        const canvasWrap = document.getElementById('canvas');
        if (aspectRatioValue) {
          aspectRatioValue.textContent = appState.aspectRatio;
          if (aspectIcon) {
            aspectIcon.querySelector('use').setAttribute('href', appState.aspectRatio === '1:1' ? '#icon-custom-1-1-ratio' : '#icon-custom-9-16-ratio');
          }
          if (canvasWrap) {
            appState.aspectRatio === '9:16' ? canvasWrap.setAttribute('data-aspect-ratio', '9:16') : canvasWrap.removeAttribute('data-aspect-ratio');
          }
          appState.aspectRatio === '9:16' ? document.documentElement.setAttribute('data-aspect-ratio', '9:16') : document.documentElement.removeAttribute('data-aspect-ratio');
        }
      },

      renderSidebarState() {
        const panel = document.getElementById('sidebar');
        const toggle = document.getElementById('sidebar-toggle');
        if (panel) !appState.isSidebarOpen ? panel.setAttribute('data-state', 'collapsed') : panel.removeAttribute('data-state');
        if (toggle) {
          !appState.isSidebarOpen ? toggle.setAttribute('data-state', 'closed') : toggle.removeAttribute('data-state');
          toggle.setAttribute('aria-label', appState.isSidebarOpen ? 'Close sidebar' : 'Open sidebar');
        }

        !appState.isSidebarOpen ? document.documentElement.setAttribute('data-sidebar-state', 'hidden') : document.documentElement.removeAttribute('data-sidebar-state');

        document.querySelectorAll('.sidebar-panel').forEach(panelEl => {
          panelEl.dataset.panel === appState.activeOptionsPanel ? panelEl.setAttribute('data-state', 'open') : panelEl.removeAttribute('data-state');
        });
      },

      buildDotStrip(container, colors) {
        if (!container) return;
        container.innerHTML = '';
        colors.forEach((color, index) => {
          const dot = document.createElement('div');
          dot.className = 'dot';
          dot.style.background = color;
          if (index === 0) dot.title = 'background';
          container.appendChild(dot);
        });
      },

      renderArtwork() {
        if (!appState.artwork) return;
        const { placements, heightUnits, palette } = appState.artwork;
        const svg = document.getElementById('artwork-svg');
        svg.innerHTML = '';

        const canvasW = appState.aspectRatio === '9:16' ? 562.5 : CANVAS_SIZE;
        const canvasH = CANVAS_SIZE; // Always 1000

        const stackHeightPx = (heightUnits * CELL_STEP) + BORDER_WIDTH;
        const offsetX = Math.round((canvasW - COLUMN_WIDTH) / 2);
        const offsetY = Math.round((canvasH - stackHeightPx) / 2);

        svg.setAttribute('viewBox', `0 0 ${canvasW} ${canvasH}`);
        svg.setAttribute('width', canvasW);
        svg.setAttribute('height', canvasH);

        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('width', canvasW);
        bg.setAttribute('height', canvasH);
        bg.setAttribute('fill', palette.bg);
        svg.appendChild(bg);

        placements.forEach(placement => {
          const shape = SHAPE_CATALOG[placement.id];
          const occupied = new Set(shape.cells.map(cell => `${cell.x},${cell.y}`));

          shape.cells.forEach(cell => {
            const cellX = offsetX + ((placement.x + cell.x) * CELL_STEP);
            const gridY = placement.y + cell.y;
            const cellY = offsetY + ((heightUnits - 1 - gridY) * CELL_STEP);
            const insetLeft = occupied.has(`${cell.x - 1},${cell.y}`) ? 0 : BORDER_WIDTH;
            const insetRight = occupied.has(`${cell.x + 1},${cell.y}`) ? 0 : BORDER_WIDTH;
            const insetTop = occupied.has(`${cell.x},${cell.y + 1}`) ? 0 : BORDER_WIDTH;
            const insetBottom = occupied.has(`${cell.x},${cell.y - 1}`) ? 0 : BORDER_WIDTH;
            const effectiveGapColor = appState.showOutline ? INK_COLOR : palette.bg;

            addRect(svg, cellX, cellY, CELL_SIZE, CELL_SIZE, effectiveGapColor);
            addRect(
              svg,
              cellX + insetLeft,
              cellY + insetTop,
              CELL_SIZE - insetLeft - insetRight,
              CELL_SIZE - insetTop - insetBottom,
              placement.color
            );
          });
        });
      },

      renderMetadata() {
        if (!appState.artwork) return;
        const { placements, heightUnits, palette, activeProfile } = appState.artwork;
        const lightBg = isLight(palette.bg);
        const baseRGB = lightBg ? '28, 28, 26' : '240, 238, 232';
        const root = document.documentElement;
        root.style.setProperty('--ui-bg', palette.bg);
        root.style.setProperty('--ui-ink', `rgba(${baseRGB}, 0.9)`);
        root.style.setProperty('--ui-ink-solid', `rgb(${baseRGB})`);
        root.style.setProperty('--ui-ink-muted', `rgba(${baseRGB}, 0.5)`);
        root.style.setProperty('--ui-rule', `rgba(${baseRGB}, 0.1)`);

        !appState.showExport ? document.getElementById('export-overlay')?.setAttribute('data-state', 'hidden') : document.getElementById('export-overlay')?.removeAttribute('data-state');

        const seedDisplayEl = document.getElementById('seed-display');
        if (seedDisplayEl) seedDisplayEl.textContent = appState.seed;

        const shapeCountEl = document.getElementById('shape-count');
        if (shapeCountEl) shapeCountEl.textContent = placements.length;

        const stackHeightEl = document.getElementById('stack-height');
        if (stackHeightEl) stackHeightEl.textContent = heightUnits;

        const paletteNameEl = document.getElementById('palette-name');
        if (paletteNameEl) paletteNameEl.textContent = palette.name;

        const profileNameEl = document.getElementById('profile-name');
        if (profileNameEl) profileNameEl.textContent = activeProfile;

        const limitDisplayEl = document.getElementById('limit-display');
        if (limitDisplayEl) limitDisplayEl.textContent = appState.targetBlocks;

        const shapesList = document.getElementById('shapes-list');
        if (!shapesList) return;

        shapesList.innerHTML = '';
        const counts = placements.reduce((acc, placement) => {
          const units = SHAPE_CATALOG[placement.id].units;
          acc[units] = (acc[units] || 0) + 1;
          return acc;
        }, {});

        Object.keys(counts).map(Number).sort((a, b) => a - b).forEach(units => {
          const row = document.createElement('div');
          row.className = 'control-row u-hide-icon';
          row.setAttribute('role', 'listitem');
          row.innerHTML = `<span class="control-label">${formatUnitLabel(units)}</span><span class="control-value">${counts[units]}</span>`;
          shapesList.appendChild(row);
        });
      },

      render() {
        if (!appState.artwork) return;
        this.renderArtwork();
        this.renderDisplayOptions();
        this.renderSidebarState();
        this.renderMetadata();
      },

      renderLimitSlider() {
        const container = document.getElementById('limit-slider-container');
        if (!container) return;
        container.innerHTML = '';

        const slider = document.createElement('div');
        slider.className = 'limit-slider';

        const track = document.createElement('div');
        track.className = 'limit-slider-track';

        const thumb = document.createElement('div');
        thumb.className = 'limit-slider-thumb';
        thumb.innerHTML = `<span>${appState.targetBlocks}</span>`;

        slider.appendChild(track);
        slider.appendChild(thumb);
        container.appendChild(slider);

        const sortedLimits = getSortedLimits();
        function updateThumbPos(val) {
          const normalizedVal = clampToAllowedLimit(val);
          const valueIndex = sortedLimits.indexOf(normalizedVal);
          const percent = sortedLimits.length > 1 ? valueIndex / (sortedLimits.length - 1) : 0;
          const sliderWidth = slider.offsetWidth;
          const thumbWidth = thumb.offsetWidth;
          // The thumb slides from 0 to (sliderWidth - thumbWidth)
          const maxScroll = Math.max(0, sliderWidth - thumbWidth);
          thumb.style.transform = `translateX(${percent * maxScroll}px)`;
          thumb.querySelector('span').textContent = normalizedVal;
        }

        // Initial pos
        requestAnimationFrame(() => updateThumbPos(appState.targetBlocks));

        let isDragging = false;

        function valFromX(clientX) {
          const rect = slider.getBoundingClientRect();
          const thumbWidth = thumb.offsetWidth;
          const maxScroll = Math.max(0, rect.width - thumbWidth);
          if (maxScroll === 0) return appState.targetBlocks;
          const relativeX = Math.max(0, Math.min(maxScroll, clientX - rect.left - (thumbWidth / 2)));
          const percent = relativeX / maxScroll;
          const index = Math.round(percent * (sortedLimits.length - 1));
          return sortedLimits[Math.max(0, Math.min(sortedLimits.length - 1, index))];
        }

        function onPointerDown(e) {
          const isThumb = e.target.closest('.slider-thumb');
          if (isThumb) {
            isDragging = true;
            thumb.setAttribute('data-dragging', 'true');
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
          } else {
            // Stepper behavior: jump to next/prev if clicking track
            const rect = thumb.getBoundingClientRect();
            const clickX = e.clientX;
            const currentIndex = sortedLimits.indexOf(clampToAllowedLimit(appState.targetBlocks));
            let newVal = appState.targetBlocks;
            if (clickX < rect.left) {
              newVal = sortedLimits[Math.max(0, currentIndex - 1)];
            } else if (clickX > rect.right) {
              newVal = sortedLimits[Math.min(sortedLimits.length - 1, currentIndex + 1)];
            }
            if (newVal !== appState.targetBlocks) {
              updateLimit(newVal);
            }
          }
        }

        function onPointerMove(e) {
          if (!isDragging) return;
          const newVal = valFromX(e.clientX);
          if (newVal !== appState.targetBlocks) {
            updateLimit(newVal);
          }
        }

        function onPointerUp() {
          isDragging = false;
          thumb.removeAttribute('data-dragging');
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
        }

        function updateLimit(val) {
          State.setTargetBlocks(val);
          updateThumbPos(appState.targetBlocks);
          Render.renderHeightFilter();
          State.triggerGeneration();
        }

        slider.addEventListener('pointerdown', onPointerDown);
        // Ensure layout changes don't break position
        window.addEventListener('resize', () => updateThumbPos(appState.targetBlocks));
      },

      renderHeightFilter() {
        const hList = document.getElementById('height-filter-container');
        if (!hList) return;
        hList.innerHTML = '';

        POSSIBLE_HEIGHTS.slice().sort((a, b) => a - b).forEach(h => {
          const cell = document.createElement('div');
          cell.className = 'toggle-cell';

          // Styling purely references the single source of truth: selectedHeights
          if (appState.heightMode === 'multi') {
            if (appState.selectedHeights.has(h)) cell.setAttribute('data-state', 'selected');
          } else {
            if (appState.selectedHeights.has(h)) {
              cell.setAttribute('data-state', 'in-range');
              const min = appState.rangeEnd !== null ? Math.min(appState.rangeStart, appState.rangeEnd) : appState.rangeStart;
              const max = appState.rangeEnd !== null ? Math.max(appState.rangeStart, appState.rangeEnd) : appState.rangeStart;
              if (h === min) cell.setAttribute('data-range-edge', 'start');
              if (h === max) cell.setAttribute('data-range-edge', 'end');
            }
          }

          cell.innerHTML = `<span>${h}</span>`;

          // Click logic modifies the single source of truth: selectedHeights
          cell.addEventListener('click', () => {
            State.toggleHeightSelection(h);
            State.clearSeed();
            Render.renderHeightFilter();
            State.triggerGeneration();
          });

          hList.appendChild(cell);
        });
      }
    };

    // --- CONTROLS MODULE ---
    const Controls = {
      regenerateFromFilters() {
        State.clearSeed();
        State.triggerGeneration();
      },

      syncRenderFlag(flag, checked) {
        State.setRenderFlag(flag, checked);
        Render.render();
        State.syncURL();
      },

      bindParamsPanel() {
        document.getElementById('layout-row')?.addEventListener('click', () => {
          State.toggleDisplayLayout();
          Render.renderDisplayOptions();
          State.syncURL();
        });

        document.getElementById('aspect-ratio-row')?.addEventListener('click', () => {
          State.toggleAspectRatio();
          Render.renderDisplayOptions();
          Render.renderArtwork();
          State.syncURL();
        });

        document.querySelectorAll('[data-options-panel]').forEach(row => {
          row.addEventListener('click', () => {
            State.toggleOptionsPanel(row.dataset.optionsPanel);
            Render.renderSidebarState();
          });
        });

        document.getElementById('seed-row')?.addEventListener('click', () => this.regenerateFromFilters());
        document.getElementById('seed-row')?.addEventListener('keydown', event => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          this.regenerateFromFilters();
        });
      },

      bindGlobalControls() {
        document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
          State.toggleSidebar();
          Render.renderSidebarState();
        });
        document.getElementById('export-png-btn')?.addEventListener('click', () => ExportActions.downloadPNG());
        document.getElementById('export-svg-btn')?.addEventListener('click', () => ExportActions.downloadSVG());

        document.getElementById('seed-display')?.addEventListener('click', event => {
          event.stopPropagation();
          if (!appState.seed) return;
          const url = appState.shareUrl || window.location.href;
          const display = document.getElementById('seed-display');
          const original = display.textContent;

          const showCopied = () => {
            display.innerHTML = '<span style="color: var(--ui-ink-muted);">COPIED</span>';
            setTimeout(() => {
              display.textContent = appState.seed === original ? original : appState.seed;
            }, 1500);
          };

          const fallbackCopy = () => {
            const tempInput = document.createElement('input');
            tempInput.value = url;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showCopied();
          };

          if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(url).then(showCopied).catch(fallbackCopy);
            return;
          }

          fallbackCopy();
        });

        document.getElementById('seed-display')?.addEventListener('keydown', event => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          event.stopPropagation();
          document.getElementById('seed-display')?.click();
        });
      },

      bindShortcuts() {
        document.addEventListener('keydown', event => {
          if (event.target.tagName === 'INPUT' || event.metaKey || event.ctrlKey) return;
          const key = event.key.toLowerCase();

          if (key === 'r') this.regenerateFromFilters();

          if (key === 'i') {
            State.toggleSidebar();
            Render.renderSidebarState();
          }

          if (key === 'p') ExportActions.downloadPNG();
          if (key === 's') ExportActions.downloadSVG();
        });
      }
    };

    // --- EXPORT MODULE ---
    const ExportActions = {
      getSVGString() {
        const svg = document.getElementById('artwork-svg');
        const clone = svg.cloneNode(true);
        clone.setAttribute('width', CANVAS_SIZE);
        clone.setAttribute('height', CANVAS_SIZE);
        if (!clone.getAttribute('xmlns')) clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        return new XMLSerializer().serializeToString(clone);
      },

      triggerDownload(dataUrl, fileName) {
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = fileName;
        link.click();
        if (dataUrl.startsWith('blob:')) {
          setTimeout(() => URL.revokeObjectURL(dataUrl), 100);
        }
      },

      downloadSVG() {
        const blob = new Blob([this.getSVGString()], { type: 'image/svg+xml;charset=utf-8' });
        this.triggerDownload(URL.createObjectURL(blob), '4x4rt-stacks.svg');
      },

      async downloadPNG() {
        const scale = 2;
        const canvasW = appState.aspectRatio === '9:16' ? 562.5 : CANVAS_SIZE;
        const canvasH = CANVAS_SIZE; // Always 1000
        const url = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(this.getSVGString())}`;

        try {
          const img = await new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = reject;
            image.src = url;
          });

          const canvas = document.createElement('canvas');
          canvas.width = canvasW * scale;
          canvas.height = canvasH * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          this.triggerDownload(canvas.toDataURL('image/png'), '4x4rt-stacks.png');
        } catch (error) {
          console.error('PNG download failed', error);
        }
      }
    };

    // --- INIT SEQUENCE ---
    Controls.bindGlobalControls();
    State.parseURL();
    Controls.bindParamsPanel();
    Controls.bindShortcuts();
    State.applyToDOM();
    State.triggerGeneration();
  </script>
</body>
