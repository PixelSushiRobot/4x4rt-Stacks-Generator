<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4x4rt Stacks Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & SCOPE MODIFIERS
       ========================================================================== */
    :root {
      --page-pad-x: 64px;
      --page-pad-y: 20px;
      --sidebar-width: 365px;
      --active-sidebar-width: var(--sidebar-width);
      --content-width: calc(100vw - var(--active-sidebar-width));
      --poster-metadata-ratio: 0.17;
      --canvas-size: min(calc(100vh - (var(--page-pad-y) * 2)), calc(var(--content-width) - (var(--page-pad-x) * 2)));
      --artwork-width: var(--canvas-size);

      /* Portrait (9:16) metadata band: 4 stacked rows of (79/576) of --artwork-width each = 316/576 of --artwork-width total. */
      --poster-metadata-ratio-portrait: calc(316 / 576);
      --poster-metadata-height-portrait: calc(var(--artwork-width) * var(--poster-metadata-ratio-portrait));

      /* Modular Scale System */
      --scale-unit: calc(var(--canvas-size) * 0.001);
      --sz-01: calc(var(--scale-unit) * 1);
      --sz-02: calc(var(--scale-unit) * 2);
      --sz-05: calc(var(--scale-unit) * 5);
      --sz-07: calc(var(--scale-unit) * 7);
      --sz-08: calc(var(--scale-unit) * 8);
      --sz-10: calc(var(--scale-unit) * 10);
      --sz-15: calc(var(--scale-unit) * 15);
      --sz-16: calc(var(--scale-unit) * 16);
      --sz-18: calc(var(--scale-unit) * 18);
      --sz-20: calc(var(--scale-unit) * 20);
      --sz-25: calc(var(--scale-unit) * 25);
      --sz-30: calc(var(--scale-unit) * 30);
      --sz-40: calc(var(--scale-unit) * 40);
      --sz-54: calc(var(--scale-unit) * 54);
      --sz-56: calc(var(--scale-unit) * 56);
      --sz-64: calc(var(--scale-unit) * 64);
      --sz-90: calc(var(--scale-unit) * 90);
      --sz-120: calc(var(--scale-unit) * 120);
      --sz-365: calc(var(--scale-unit) * 365);

      --rule-width: max(1px, var(--sz-01));
      /* Failsafe colors from Spice palette */
      --ui-bg: #f4f1ea;
      --ui-ink: rgba(28, 28, 26, 0.9);
      --ui-ink-solid: rgb(28, 28, 26);
      --ui-ink-muted: rgba(28, 28, 26, 0.5);
      --ui-ink-20: rgba(28, 28, 26, 0.2);
      --ui-rule: rgba(28, 28, 26, 0.1);
      --ui-border-width: max(1px, var(--sz-02));
      --ui-text-size: var(--sz-15);
      --ui-brand-size: var(--sz-30);
      --poster-metadata-height: calc(var(--canvas-size) * var(--poster-metadata-ratio));
      --poster-total-height: calc(var(--canvas-size) + var(--poster-metadata-height) + (var(--ui-border-width) * 2));
    }

    :root[data-sidebar-state="hidden"] {
      --active-sidebar-width: 0px;
    }

    :root[data-aspect-ratio="portrait"] {
      --artwork-width: calc((var(--canvas-size) - var(--ui-border-width) * 2) * 0.5625 + var(--ui-border-width) * 2);
    }

    /* ==========================================================================
       2. BASE RESET
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
      color: inherit;
      font-size: inherit;
      line-height: 1;
    }

    button {
      background: transparent;
      border: none;
    }

    body {
      background: var(--ui-bg);
      color: var(--ui-ink);
      font-family: 'Space Mono', monospace;
      line-height: 1.45;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ==========================================================================
       3. CORE LAYOUT
       ========================================================================== */
    .l-app {
      position: relative;
      width: 100%;
      min-height: 100vh;
    }

    .l-canvas {
      position: fixed;
      inset: 0 var(--active-sidebar-width) 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--content-width);
      height: 100vh;
      padding: var(--page-pad-y) var(--page-pad-x);
    }

    .artwork-container:hover .sidebar-toggle {
      display: flex;
    }

    .l-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: var(--sidebar-width);
      height: 100vh;
      min-height: 100vh;
      max-height: 100vh;
      padding: 0;
      margin-left: 0;
      background: var(--ui-bg);
      border-left: var(--rule-width) solid var(--ui-rule);
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      --scale-unit: 1px;
      --sz-01: 1px;
      --sz-02: 2px;
      --sz-05: 5px;
      --sz-07: 7px;
      --sz-08: 8px;
      --sz-10: 10px;
      --sz-15: 15px;
      --sz-16: 16px;
      --sz-18: 18px;
      --sz-20: 20px;
      --sz-25: 25px;
      --sz-30: 30px;
      --sz-40: 40px;
      --sz-54: 54px;
      --sz-56: 56px;
      --sz-64: 64px;
      --sz-90: 90px;
      --sz-120: 120px;
      --sz-365: 365px;
      --rule-width: 1px;
      --ui-border-width: 2px;
      --ui-text-size: 15px;
      --ui-brand-size: 30px;
      font-size: var(--ui-text-size);
    }

    .l-sidebar[data-state="collapsed"] {
      display: none !important;
    }

    .sidebar-content {
      padding: var(--sz-20);
      padding-bottom: var(--sz-120);
      flex: 1;
      overflow-y: auto;
      overflow-anchor: none;
    }

    .l-sidebar[data-state="collapsed"] .sidebar-content {
      display: none;
    }

    /* ==========================================================================
       4. SVG & CANVAS UTILITIES
       ========================================================================== */
    .poster-mat {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    :root[data-layout="poster"] .poster-mat {
      padding: var(--sz-20);
      background-color: var(--ui-bg);
    }

    .artwork-container {
      position: relative;
      width: var(--artwork-width);
      height: var(--canvas-size);
      background: var(--ui-bg);
      border: var(--ui-border-width) solid var(--ui-ink-solid);
    }

    .artwork-stage {
      position: relative;
      width: 100%;
      height: 100%;
      flex: none;
    }

    .artwork-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    svg,
    path {
      shape-rendering: crispEdges;
    }

    .watermark {
      display: none;
      position: absolute;
      right: var(--sz-20);
      bottom: var(--sz-20);
      width: var(--sz-90);
      height: var(--sz-30);
      z-index: 3;
      pointer-events: none;
    }

    :root[data-layout="poster"] .watermark {
      display: block;
    }

    .watermark svg {
      display: block;
    }

    /* ==========================================================================
       5. SIDEBAR UI COMPONENTS
       ========================================================================== */
    .project-header {
      display: flex;
      flex-direction: column;
      gap: var(--sz-08);
      margin-bottom: var(--sz-40);
      font-size: var(--ui-brand-size);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .artist-name {
      color: var(--ui-ink-muted);
    }

    .project-description {
      font-size: var(--ui-text-size);
      line-height: 1.45;
    }

    .params-section {
      padding-top: var(--sz-40);
    }

    .params-section-title {
      font-size: var(--ui-text-size);
      text-transform: uppercase;
      color: var(--ui-ink);
      padding-bottom: calc(var(--canvas-size) * 0.01);
    }

    .control-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: var(--sz-10);
      width: 100%;
      min-height: var(--sz-56);
      padding: var(--sz-20) 0;
      border: none;
      border-bottom: var(--rule-width) solid var(--ui-rule);
      font-size: var(--ui-text-size);
      text-align: left;
      text-transform: uppercase;
      cursor: default;
    }

    .control-row:hover .icon {
      color: var(--ui-ink);
    }

    .control-row.u-hide-icon {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .control-row[data-interactive="true"] {
      cursor: pointer;
    }

    .control-row[data-interactive="true"]:hover {
      color: var(--ui-ink-muted);
    }

    .control-row[data-interactive="true"]:focus-visible {
      outline: none;
      border-bottom-color: var(--ui-ink-muted);
    }

    .control-label {
      color: var(--ui-ink-muted);
    }

    .control-value {
      justify-self: end;
      white-space: nowrap;
      color: var(--ui-ink);
    }

    .control-suffix {
      color: var(--ui-ink-muted);
    }

    .options-panel {
      display: none;
      margin: 0;
      padding: 0;
      background: var(--ui-rule);
      border-radius: var(--sz-20);
      color: var(--ui-ink);
      font-size: var(--ui-text-size);
      line-height: 1.45;
    }

    .options-panel[data-state="open"] {
      display: block;
      margin-bottom: var(--sz-20);
    }

    .control-row[data-interactive="true"]:has(+ .options-panel[data-state="open"]) {
      border-bottom: none;
    }

    .options-panel[data-state="open"]+.control-row {
      border-top: var(--rule-width) solid var(--ui-rule);
    }

    .option-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .option-group {
      display: flex;
      flex-direction: column;
      gap: var(--sz-02);
      padding-bottom: var(--sz-10);
    }

    .option-group:last-child {
      padding-bottom: 0;
    }

    .option-group-title {
      color: var(--ui-ink-muted);
      font-size: var(--ui-text-size);
      padding: var(--sz-08) var(--sz-10) var(--sz-02);
    }

    .option-row,
    .option-action {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--sz-20);
      min-height: var(--sz-30);
      padding: var(--sz-20);
      border-radius: 0;
      border-bottom: var(--rule-width) solid transparent;
      color: var(--ui-ink);
      cursor: pointer;
      text-transform: uppercase;
    }

    .option-list>.option-row:first-child {
      border-top-left-radius: var(--sz-20);
      border-top-right-radius: var(--sz-20);
    }

    .option-list>.option-row:last-child {
      border-bottom-left-radius: var(--sz-20);
      border-bottom-right-radius: var(--sz-20);
    }

    .option-row:hover,
    .option-action:hover,
    .option-row:has(input:checked) {
      background: var(--ui-rule);
      color: var(--ui-ink);
    }

    .option-row {
      position: relative;
    }

    .option-row input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      margin: 0;
      pointer-events: none;
    }

    .option-row:has(input:focus-visible),
    .option-action:focus-visible {
      outline: none;
      border-bottom-color: var(--ui-ink-muted);
    }

    .option-marker {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      box-shadow: 0 0 0 1px var(--ui-ink), inset 0 0 0 1px var(--ui-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .option-row input:checked~.option-marker::after {
      content: '';
      width: 10px;
      height: 10px;
      background: var(--ui-ink);
      border-radius: 1px;
    }

    /* ---- Palette panel: each category is its OWN rounded panel group ---- */
    /* The palette's options-panel wrapper is transparent — the per-category panels below
       provide the rounded --ui-rule boxes (avoids a panel-in-panel double box). */
    #palette-options-panel {
      background: transparent;
      border-radius: 0;
    }

    .palette-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
      /* gap between category panels */
    }

    /* One category = its own rounded --ui-rule panel with 20px padding. */
    .palette-category {
      background: var(--ui-rule);
      border-radius: var(--sz-20);
      padding: 20px;
    }

    /* Category label styled like a section title, muted. Clickable: toggles the whole
       category. Hit area hugs the label text so its focus ring wraps just the label
       (matching the seed focus state), not the full panel width. */
    .palette-category-title {
      display: inline-block;
      text-align: left;
      font-family: inherit;
      font-size: var(--ui-text-size);
      text-transform: uppercase;
      color: var(--ui-ink-muted);
      margin-bottom: 13px;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
    }

    .palette-category-title:hover {
      color: var(--ui-ink);
    }

    .palette-category-title:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
      border-radius: var(--sz-02);
    }

    /* Grid: 4 columns of 63px units, 11px column gap, 13px row gap (fits 285px inner). */
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(4, 63px);
      column-gap: 11px;
      row-gap: 13px;
    }

    /* Each unit fills its grid cell (63px on desktop; flexes wider at small breakpoints);
       the fixed-width pill stays centered. */
    .palette-unit {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      cursor: pointer;
    }

    .palette-unit input {
      position: absolute;
      inset: 0;
      opacity: 0;
      margin: 0;
      pointer-events: none;
    }

    /* Color pill: 43x16, holds 7 vertical stripes (bg + 6 colors) filling the full capsule.
       The 2px ink@20% ring is drawn INSIDE, on top of the stripes, tracing the capsule. */
    .palette-pill {
      position: relative;
      box-sizing: border-box;
      width: 43px;
      height: 16px;
      display: flex;
      overflow: hidden;
      border-radius: 999px;
    }

    .palette-pill span {
      flex: 1 0 0;
      background: var(--swatch-color);
    }

    .palette-pill::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid var(--ui-ink-20);
      border-radius: 999px;
      pointer-events: none;
    }

    /* Selected: 2px gap then a 2px ink outline ring around the pill. */
    .palette-unit:has(input:checked) .palette-pill {
      outline: 2px solid var(--ui-ink);
      outline-offset: 2px;
    }

    .palette-unit-label {
      margin-top: 8px;
      font-size: 13px;
      text-transform: uppercase;
      color: var(--ui-ink);
      text-align: center;
    }

    /* Focus ring only on keyboard focus (Tab), not on mouse select/deselect. */
    .palette-unit:has(input:focus-visible) .palette-pill {
      outline: 2px solid var(--ui-ink-muted);
      outline-offset: 2px;
    }

    /* Height panel: 3-dots mode toggle above a wrapping grid of selection pills. */
    .height-panel {
      padding: 20px;
    }

    /* Mode toggle: three 6px dots, 3px gaps (individual mode). Range mode hides the middle
       dot and connects the outer two with a 2px bar. */
    .height-mode-toggle {
      position: relative;
      display: flex;
      align-items: center;
      gap: 3px;
      width: 24px;
      /* 6 + 3 + 6 + 3 + 6 — fixed so the range-mode bar has a span to fill */
      height: 6px;
      padding: 0;
      margin-bottom: 16px;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .height-mode-toggle .hmt-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--ui-ink);
      flex: 0 0 auto;
    }

    /* Range mode: middle dot becomes a 2px connecting bar butting against the outer dots
       (no gap), so it reads as two dots joined by a continuous line. */
    :root[data-height-mode="range"] .height-mode-toggle {
      gap: 0;
    }

    :root[data-height-mode="range"] .height-mode-toggle .hmt-dot-2 {
      height: 2px;
      border-radius: 0;
      flex: 1 1 auto;
    }

    .height-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Selection pill: 63x26, 2px border, 15px number, all --ui-ink. */
    .toggle-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 63px;
      height: 26px;
      padding: 0;
      font-size: 15px;
      cursor: pointer;
      background: transparent;
      border: none;
      color: var(--ui-ink);
    }

    .toggle-cell::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid var(--ui-ink);
      border-radius: 999px;
      z-index: 0;
    }

    .toggle-cell span {
      position: relative;
      z-index: 1;
    }

    /* Selected (individual) and in-range (range) share the filled dark look with light text. */
    .toggle-cell[data-state="selected"],
    .toggle-cell[data-state="in-range"] {
      color: var(--ui-bg);
    }

    .toggle-cell[data-state="selected"]::before,
    .toggle-cell[data-state="in-range"]::before {
      background-color: var(--ui-ink-solid);
      border-color: var(--ui-ink-solid);
    }

    /* Range pills merge into a continuous capsule within a row. Interior pills are square
       and extend across the 8px grid gap to join neighbors; the capsule is capped with a
       rounded end wherever it's the range start/end OR a row edge (so a range that wraps to
       the next row shows normal rounded pills per row, not flat dangling edges). */
    .toggle-cell[data-state="in-range"]::before {
      inset: 0 -8px;
      /* default interior: square, extend both sides across the gap */
      border-radius: 0;
    }

    /* Left cap: rounded and flush when this pill starts the range or starts a row. */
    .toggle-cell[data-state="in-range"][data-range-edge="start"]::before,
    .toggle-cell[data-state="in-range"][data-range-edge="both"]::before,
    .toggle-cell[data-state="in-range"][data-row-edge="left"]::before {
      left: 0;
      border-top-left-radius: 999px;
      border-bottom-left-radius: 999px;
    }

    /* Right cap: rounded and flush when this pill ends the range or ends a row. */
    .toggle-cell[data-state="in-range"][data-range-edge="end"]::before,
    .toggle-cell[data-state="in-range"][data-range-edge="both"]::before,
    .toggle-cell[data-state="in-range"][data-row-edge="right"]::before {
      right: 0;
      border-top-right-radius: 999px;
      border-bottom-right-radius: 999px;
    }

    .toggle-cell:focus-visible {
      outline: 2px solid var(--ui-ink-muted);
      outline-offset: 2px;
      border-radius: 999px;
    }

    /* ==========================================================================
       6. SPECIFIC CONTROLS
       ========================================================================== */
    #seed-display:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
      border-radius: var(--sz-02);
    }

    .sidebar-toggle {
      position: absolute;
      top: var(--sz-20);
      right: var(--sz-20);
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--sz-16);
      height: var(--sz-16);
      font-size: var(--ui-text-size);
      cursor: pointer;
      z-index: 10;
      display: none;
    }

    .sidebar-toggle:hover .icon {
      color: var(--ui-ink);
    }

    .sidebar-toggle:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
      border-radius: var(--sz-02);
    }

    .action-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--ui-bg);
      padding: var(--sz-20);
      display: flex;
      gap: var(--sz-10);
      align-items: center;
      z-index: 10;
    }

    .button {
      display: flex;
      align-items: center;
      gap: var(--sz-02);
      padding: var(--sz-05) var(--sz-07) var(--sz-05) var(--sz-10);
      border: var(--ui-border-width) solid var(--ui-ink);
      border-radius: var(--sz-30);
      font-size: var(--ui-text-size);
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.1s ease, color 0.1s ease;
    }

    .button .icon {
      color: var(--ui-ink);
    }

    .button:active {
      background: var(--ui-ink);
      color: var(--ui-bg);
    }

    .button:active .icon {
      color: var(--ui-bg);
    }

    .button:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
    }

    :root[data-layout="poster"] #export-svg-btn {
      display: none;
    }

    :root[data-layout="art"] #export-hires-btn {
      display: none;
    }

    @media (min-width: 641px) {
      :root[data-layout="poster"] .l-sidebar {
        min-height: 100vh;
        max-height: 100vh;
      }
    }

    .icon-button {
      margin-left: auto;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-button:hover {
      color: var(--ui-ink-muted);
    }

    .icon-button:hover .icon {
      color: var(--ui-ink);
    }

    .icon-button:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
      border-radius: var(--sz-02);
    }

    .slider {
      position: relative;
      width: 100%;
      height: var(--sz-30);
      margin-top: var(--sz-15);
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }

    .slider-track {
      position: absolute;
      inset: 0;
      background: var(--ui-rule);
      border-radius: 999px;
    }

    .slider-thumb {
      position: absolute;
      height: 100%;
      min-width: var(--sz-54);
      padding: 0 var(--sz-15);
      background-color: var(--ui-ink);
      color: var(--ui-bg);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--sz-18);
      transform: translateX(0);
      z-index: 2;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    .slider-thumb[data-dragging="true"] {
      transition: none;
    }

    .slider-thumb:focus-visible {
      outline: var(--sz-02) solid var(--ui-ink-muted);
      outline-offset: var(--sz-02);
    }

    #seed-display {
      cursor: pointer;
    }

    /* ==========================================================================
       7. ICONS
       ========================================================================== */
    .icon {
      width: var(--sz-16);
      height: var(--sz-16);
      fill: currentColor;
      color: var(--ui-ink-muted);
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .icon-mobile {
      display: none;
    }

    /* ==========================================================================
       8. MEDIA QUERIES
       ========================================================================== */
    @media (max-width: 640px) {
      :root {
        --page-pad-x: 20px;
        --page-pad-y: 20px;
        --active-sidebar-width: 0px;
        --content-width: 100vw;
        --canvas-size: calc(100vw - (var(--page-pad-x) * 2));
      }

      body {
        padding: var(--page-pad-y) var(--page-pad-x);
        overflow: auto;
      }

      .icon-desktop {
        display: none;
      }

      .icon-mobile {
        display: inline-block;
      }

      .l-app {
        display: flex;
        flex-direction: column;
        gap: 0;
        min-height: auto;
        width: var(--artwork-width);
        margin: 0 auto;
      }

      .l-canvas {
        position: relative;
        inset: auto;
        width: var(--artwork-width);
        height: auto;
        padding: 0;
      }

      .l-sidebar {
        position: relative;
        top: auto;
        right: auto;
        bottom: auto;
        width: 100%;
        min-width: 0;
        max-width: none;
        min-height: auto;
        max-height: none;
        height: auto;
        margin-left: 0;
        border: none;
      }

      .sidebar-content {
        padding: var(--sz-40) 0 var(--sz-120);
      }

      .action-bar {
        padding: var(--sz-20) 0;
      }

      .l-canvas[data-aspect-ratio="portrait"]~.l-sidebar {
        width: calc((var(--canvas-size) - var(--ui-border-width) * 2) * 0.5625 + var(--ui-border-width) * 2);
      }

      .l-sidebar[data-state="collapsed"] {
        display: none !important;
      }

      /* Palette grid fills the wider width instead of locking to 4 columns — pills wrap to
         fill each row like the height pills do. */
      .palette-grid {
        grid-template-columns: repeat(auto-fill, minmax(63px, 1fr));
      }
    }

    /* --- Poster Layout Overrides --- */
    :root[data-layout="poster"] .artwork-container {
      height: auto;
      display: flex;
      flex-direction: column;
      border: var(--ui-border-width) solid var(--ui-ink-solid);
    }

    :root[data-layout="poster"] .artwork-stage {
      height: var(--canvas-size);
    }

    :root[data-layout="poster"] .poster-title,
    :root[data-layout="poster"] .poster-metadata {
      display: block !important;
    }

    .poster-title {
      position: absolute;
      top: var(--sz-20);
      left: var(--sz-20);
      color: var(--ui-ink);
      text-transform: uppercase;
      z-index: 10;
    }

    .poster-title-label {
      font-size: var(--sz-15);
      line-height: 1.2;
    }

    .poster-title-value {
      font-size: var(--sz-30);
      line-height: 1;
    }

    .poster-metadata {
      height: var(--poster-metadata-height);
      width: 100%;
      border-top: var(--ui-border-width) solid var(--ui-ink-solid);
      background: var(--ui-bg);
      color: var(--ui-ink);
      text-transform: uppercase;
      overflow: hidden;
    }

    .poster-meta-grid {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .poster-data-cols {
      flex: 1 0 0;
      display: flex;
      flex-direction: column;
    }

    .poster-row {
      display: flex;
      flex: 1 0 0;
      width: 100%;
      min-height: 0;
    }

    .poster-row:first-child {
      border-bottom: var(--ui-border-width) solid var(--ui-ink-solid);
    }

    .poster-cell {
      padding: var(--sz-20);
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: var(--ui-border-width) solid var(--ui-ink-solid);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .poster-row>.poster-cell:last-child {
      border-right: none;
    }

    .poster-units-container {
      display: flex;
      flex: 0 0 auto;
    }

    .poster-units-container>.poster-cell:last-child {
      border-right: none;
    }

    .poster-cell.hug {
      flex: 0 0 auto;
    }

    .poster-cell.fill {
      flex: 1 0 0;
    }

    .poster-cell.color-cell {
      width: calc(var(--poster-metadata-height) - var(--ui-border-width));
      flex: 0 0 calc(var(--poster-metadata-height) - var(--ui-border-width));
      flex-direction: row;
      align-items: flex-end;
    }

    .poster-color-bar {
      flex: 1 0 0;
      background: var(--bar-color);
    }

    .poster-color-bar[data-unused="true"] {
      aspect-ratio: 1 / 1;
    }

    /* ================= PORTRAIT (9:16) POSTER METADATA ================= */
    #poster-metadata-portrait {
      display: none;
    }

    :root[data-aspect-ratio="portrait"][data-layout="poster"] #poster-metadata {
      display: none !important;
    }

    :root[data-aspect-ratio="portrait"][data-layout="poster"] #poster-metadata-portrait {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: var(--poster-metadata-height-portrait);
      border-top: var(--ui-border-width) solid var(--ui-ink-solid);
      background: var(--ui-bg);
      color: var(--ui-ink);
      text-transform: uppercase;
      overflow: hidden;
      --poster-row-height-portrait: calc(var(--poster-metadata-height-portrait) / 4);
    }

    :root[data-aspect-ratio="portrait"][data-layout="poster"] .artwork-svg {
      transform: scale(0.9);
      transform-origin: center center;
    }

    :root[data-aspect-ratio="portrait"][data-layout="poster"] .artwork-container {
      overflow: hidden;
    }

    #poster-metadata-portrait .poster-row {
      display: flex;
      flex-direction: row;
      width: 100%;
      flex: 1 0 0;
      min-height: 0;
      border-bottom: var(--ui-border-width) solid var(--ui-ink-solid);
    }

    #poster-metadata-portrait .poster-row-last {
      border-bottom: none;
    }

    #poster-metadata-portrait .poster-cell {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: calc(var(--poster-row-height-portrait) * 20 / 85);
      border-right: var(--ui-border-width) solid var(--ui-ink-solid);
      overflow: hidden;
    }

    #poster-metadata-portrait .poster-cell.fill {
      flex: 1 1 0;
      min-width: 0;
    }

    #poster-metadata-portrait .poster-cell.hug {
      flex: 0 0 auto;
    }

    #poster-metadata-portrait .poster-row> :last-child {
      border-right: none;
    }

    #poster-metadata-portrait .poster-top {
      display: flex;
      flex-direction: row;
      width: 100%;
      flex: 2 0 0;
      min-height: 0;
      border-bottom: var(--ui-border-width) solid var(--ui-ink-solid);
    }

    #poster-metadata-portrait .poster-top-right {
      display: flex;
      flex-direction: column;
      flex: 1 1 0;
      min-width: 0;
    }

    #poster-metadata-portrait .color-cell {
      flex: 0 0 calc(var(--poster-metadata-height-portrait) / 2 - var(--ui-border-width));
      width: calc(var(--poster-metadata-height-portrait) / 2 - var(--ui-border-width));
      flex-direction: row;
      align-items: flex-end;
      gap: 0;
    }

    #poster-metadata-portrait .poster-units-container {
      display: flex;
      flex-direction: row;
      flex: 0 0 auto;
    }

    #poster-metadata-portrait .poster-units-container> :last-child {
      border-right: none;
    }

    #poster-metadata-portrait .meta-label {
      font-size: calc(var(--poster-row-height-portrait) * 15 / 85);
      line-height: 1.2;
      color: var(--ui-ink);
    }

    #poster-metadata-portrait .meta-value {
      font-size: calc(var(--poster-row-height-portrait) * 30 / 85);
      line-height: 1;
      color: var(--ui-ink);
    }

    .meta-label {
      font-size: var(--sz-15);
      color: var(--ui-ink);
      line-height: 1.2;
    }

    .meta-value {
      font-size: var(--sz-30);
      color: var(--ui-ink);
      line-height: 1;
    }
  </style>
</head>

      if (isPositional) {
        if (activeProfile === 'shift') {
          positionalColors = palette.colors.slice().sort((a, b) => {
            const ha = hueAngle(a), hb = hueAngle(b);
            if (ha < 0 && hb < 0) return getLuminance(a) - getLuminance(b);
            if (ha < 0) return -1;
            if (hb < 0) return 1;
            return ha - hb || getLuminance(a) - getLuminance(b);
          });
        } else {
          positionalColors = palette.colors.slice().sort((a, b) => getLuminance(a) - getLuminance(b));
        }
      }
      const rampAscending = isPositional ? nextRandom() > 0.5 : false;

      if (activeProfile === 'solid') {
        const chroma = (hex) => {
          const c = hex.replace('#', '');
          const r = parseInt(c.slice(0, 2), 16) / 255, g = parseInt(c.slice(2, 4), 16) / 255, b = parseInt(c.slice(4, 6), 16) / 255;
          return Math.max(r, g, b) - Math.min(r, g, b);
        };
        const maxChroma = Math.max(...palette.colors.map(chroma));
        const isGrayscale = maxChroma < 0.10;

        let candidates = palette.colors
          .map((c, i) => ({ c, i }))
          .filter(({ c }) => isGrayscale || !(getLuminance(c) < 0.06 && chroma(c) < 0.10))
          .map(({ i }) => i);
        if (candidates.length < 2) candidates = palette.colors.map((_, i) => i);

        const chosen = activeIndices.find(i => candidates.includes(i));
        colorWeights[chosen != null ? chosen : candidates[0]] = 10;
      } else if (activeProfile === 'split') {
        const byLum = palette.colors
          .map((c, i) => ({ i, L: getLuminance(c) }))
          .sort((a, b) => a.L - b.L);
        colorWeights[byLum[0].i] = 10;
        colorWeights[byLum[byLum.length - 1].i] = 10;
      } else if (isPositional) {
        for (let i = 0; i < palette.colors.length; i++) colorWeights[i] = 1;
      } else {
        for (let i = 0; i < palette.colors.length; i++) {
          colorWeights[i] = 1;
        }
      }

      const buildBiasedDeck = () => {
        let deck = [];
        palette.colors.forEach((c, i) => {
          for (let j = 0; j < colorWeights[i]; j++) deck.push(c);
        });
        return shuffle(deck);
      };

      const colorGrid = Array.from({ length: heightUnits }, () => [null, null]);
      const placementsWithShapes = solution.placements
        .map(p => ({ ...p, shape: SHAPE_CATALOG[p.id] }))
        .sort((a, b) => a.y - b.y || a.x - b.x || a.id.localeCompare(b.id));

      let colorDeck = buildBiasedDeck();

      const placementsWithColors = placementsWithShapes.map(p => {
        if (isPositional) {
          const shapeCenterY = p.y + (p.shape.height - 1) / 2;
          const denom = Math.max(1, heightUnits - 1);
          let t = shapeCenterY / denom;
          if (!rampAscending) t = 1 - t;
          const step = Math.round(t * (positionalColors.length - 1));
          const posColor = positionalColors[Math.max(0, Math.min(positionalColors.length - 1, step))];
          p.shape.cells.forEach(cell => {
            colorGrid[p.y + cell.y][p.x + cell.x] = posColor;
          });
          return { ...p, color: posColor };
        }

        const neighborColors = new Set();
        const noAdjacency = activeProfile === 'split' || activeProfile === 'prism' || activeProfile === 'solid';
        const enforceAdjacency = noAdjacency ? false : nextRandom() > 0.25;

        if (enforceAdjacency) {
          p.shape.cells.forEach(cell => {
            const gridX = p.x + cell.x;
            const gridY = p.y + cell.y;

            if (gridY + 1 < heightUnits && colorGrid[gridY + 1][gridX]) neighborColors.add(colorGrid[gridY + 1][gridX]);
            if (gridY - 1 >= 0 && colorGrid[gridY - 1][gridX]) neighborColors.add(colorGrid[gridY - 1][gridX]);
            if (gridX - 1 >= 0 && colorGrid[gridY][gridX - 1]) neighborColors.add(colorGrid[gridY][gridX - 1]);
            if (gridX + 1 < 2 && colorGrid[gridY][gridX + 1]) neighborColors.add(colorGrid[gridY][gridX + 1]);
          });
        }

        let validColors = colorDeck.filter(c => !neighborColors.has(c));

        if (validColors.length === 0) {
          colorDeck = buildBiasedDeck();
          validColors = colorDeck.filter(c => !neighborColors.has(c));

          if (validColors.length === 0) {
            validColors = palette.colors.filter(c => !neighborColors.has(c));
          }
          if (validColors.length === 0) {
            validColors = palette.colors;
          }
        }

        const color = validColors[0];
        const deckIndex = colorDeck.indexOf(color);
        if (deckIndex > -1) colorDeck.splice(deckIndex, 1);

        if (activeProfile === 'prism') colorDeck = buildBiasedDeck();

        p.shape.cells.forEach(cell => {
          colorGrid[p.y + cell.y][p.x + cell.x] = color;
        });

        return { ...p, color };
      });

      if (activeProfile === 'prism') {
        const MIN_DISTINCT = 3;
        const target = Math.min(MIN_DISTINCT, placementsWithColors.length, palette.colors.length);
        const used = new Set(placementsWithColors.map(p => p.color));
        if (used.size < target) {
          const unused = palette.colors.filter(c => !used.has(c));
          for (let i = placementsWithColors.length - 1; i >= 0 && used.size < target && unused.length > 0; i--) {
            const p = placementsWithColors[i];
            const dupCount = placementsWithColors.filter(q => q.color === p.color).length;
            if (dupCount <= 1) continue;
            const newColor = unused.shift();
            p.color = newColor;
            p.shape.cells.forEach(cell => {
              colorGrid[p.y + cell.y][p.x + cell.x] = newColor;
            });
            used.add(newColor);
          }
        }
      }

      return {
        placements: placementsWithColors,
        heightUnits,
        palette,
        activeProfile,
        seed: currentSeed
      };
    }


    // ==========================================================================
    // 6. STATE
    // ==========================================================================
    const appState = {
      heightMode: 'multi',
      targetBlocks: DEFAULT_LIMIT,
      isLimitVisible: false,
      selectedHeights: new Set(),

      rangeStart: null,
      rangeEnd: null,

      selectedPalettes: [],
      selectedProfiles: [],

      formMode: 'native',
      showOutline: true,
      showMetadata: true,
      showExport: true,
      displayLayout: 'art',
      aspectRatio: 'square', // 'square' | 'portrait'
      renderMode: 'single',
      isRenderModeVisible: false,
      isSidebarOpen: true,
      openPanels: new Set(),

      seed: null,
      artwork: null,
      shareUrl: null
    };

    const State = {
      refreshValidHeights() {
        POSSIBLE_HEIGHTS = computeValidHeights(appState.targetBlocks);
        return POSSIBLE_HEIGHTS;
      },

      sanitizeHeights() {
        return sanitizeHeightState();
      },

      clearSeed() {
        appState.seed = null;
      },

      setSeed(seed) {
        appState.seed = seed;
      },

      setTargetBlocks(value) {
        appState.targetBlocks = clampToAllowedLimit(value);
        this.clearSeed();
        this.refreshValidHeights();
        this.sanitizeHeights();
        return appState.targetBlocks;
      },

      setRenderFlag(flag, value) {
        appState[flag] = value;
      },

      computeShowOutline(palette) {
        if (appState.formMode === 'bound') return true;
        if (appState.formMode === 'unbound') return false;
        return !(palette.category === 'muted' || palette.category === 'void');
      },

      resolveForm(palette) {
        appState.showOutline = this.computeShowOutline(palette);
        return appState.showOutline;
      },

      syncCanvasScale() {
        const root = document.documentElement;
        const styles = getComputedStyle(root);
        const pagePadX = parseFloat(styles.getPropertyValue('--page-pad-x')) || 20;
        const pagePadY = parseFloat(styles.getPropertyValue('--page-pad-y')) || 20;
        const sidebarWidth = parseFloat(styles.getPropertyValue('--sidebar-width')) || 365;
        const metadataRatio = parseFloat(styles.getPropertyValue('--poster-metadata-ratio')) || 0.17;
        const metadataRatioPortrait = parseFloat(styles.getPropertyValue('--poster-metadata-ratio-portrait')) || (316 / 576);
        const isMobile = window.innerWidth <= 640;
        const activeSidebarWidth = (!isMobile && appState.isSidebarOpen) ? sidebarWidth : 0;
        const availableWidth = Math.max(1, window.innerWidth - activeSidebarWidth - (pagePadX * 2));
        const availableHeight = Math.max(1, window.innerHeight - (pagePadY * 2));
        const artworkRatio = appState.aspectRatio === 'portrait' ? 0.5625 : 1;

        let byHeight;
        if (appState.displayLayout === 'poster') {
          const posterMetaRatio = appState.aspectRatio === 'portrait' ? (artworkRatio * metadataRatioPortrait) : metadataRatio;
          byHeight = availableHeight / (1 + posterMetaRatio);
        } else {
          byHeight = availableHeight;
        }

        const byWidth = availableWidth / artworkRatio;
        const nextCanvasSize = Math.max(1, Math.min(byHeight, byWidth));
        root.style.setProperty('--canvas-size', `${nextCanvasSize}px`);
      },

      toggleDisplayLayout() {
        appState.displayLayout = appState.displayLayout === 'art' ? 'poster' : 'art';
        document.documentElement.setAttribute('data-layout', appState.displayLayout);
        this.syncCanvasScale();
      },

      toggleAspectRatio() {
        appState.aspectRatio = appState.aspectRatio === 'square' ? 'portrait' : 'square';
        this.syncCanvasScale();
      },

      toggleRenderMode() {
        appState.renderMode = appState.renderMode === 'single' ? 'grid' : 'single';
      },

      toggleSidebar() {
        appState.isSidebarOpen = !appState.isSidebarOpen;
        if (!appState.isSidebarOpen) appState.openPanels.clear();
        this.syncCanvasScale();
      },

      toggleOptionsPanel(panelName) {
        if (appState.openPanels.has(panelName)) appState.openPanels.delete(panelName);
        else appState.openPanels.add(panelName);
      },

      setHeightMode(mode) {
        appState.heightMode = mode;
        if (mode === 'range') {
          const selectedHeights = Array.from(appState.selectedHeights).sort((a, b) => a - b);
          if (selectedHeights.length > 0) {
            appState.rangeStart = selectedHeights[0];
            appState.rangeEnd = selectedHeights[selectedHeights.length - 1];
            const min = Math.min(appState.rangeStart, appState.rangeEnd);
            const max = Math.max(appState.rangeStart, appState.rangeEnd);
            appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(height => height >= min && height <= max));
          } else {
            appState.rangeStart = null;
            appState.rangeEnd = null;
          }
        } else {
          appState.rangeStart = null;
          appState.rangeEnd = null;
        }
        this.sanitizeHeights();
      },

      toggleHeightSelection(height) {
        if (appState.heightMode === 'multi') {
          if (appState.selectedHeights.has(height)) appState.selectedHeights.delete(height);
          else appState.selectedHeights.add(height);
          return;
        }

        if (appState.rangeStart === null || (appState.rangeStart !== null && appState.rangeEnd !== null)) {
          appState.rangeStart = height;
          appState.rangeEnd = null;
          appState.selectedHeights = new Set([height]);
          return;
        }

        appState.rangeEnd = height;
        const min = Math.min(appState.rangeStart, appState.rangeEnd);
        const max = Math.max(appState.rangeStart, appState.rangeEnd);
        appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(value => value >= min && value <= max));
      },

      resetFiltersAndView() {
        appState.heightMode = 'multi';
        appState.selectedHeights.clear();
        appState.rangeStart = null;
        appState.rangeEnd = null;
        appState.selectedPalettes = [];
        appState.selectedProfiles = [];
        appState.formMode = 'native';
        appState.showOutline = true;
        appState.showMetadata = true;
        appState.showExport = true;
        appState.displayLayout = 'art';
        appState.aspectRatio = 'square';
        appState.renderMode = 'single';
        appState.isRenderModeVisible = false;
        appState.openPanels.clear();
        this.clearSeed();
      },

      syncFromDOM() {
        const paletteInputs = document.querySelectorAll('#palette-filter-list input:checked');
        appState.selectedPalettes = [...paletteInputs].map(input => input.value);

        const profileInputs = document.querySelectorAll('#profile-filter-list input[type="checkbox"]:checked');
        appState.selectedProfiles = [...profileInputs].map(input => input.value).filter(v => VALID_PROFILE_IDS.has(v));

        const metadataEl = document.getElementById('toggle-metadata');
        if (metadataEl) appState.showMetadata = metadataEl.checked;

        const exportEl = document.getElementById('toggle-export');
        if (exportEl) appState.showExport = exportEl.checked;
      },

      applyToDOM() {
        Render.renderPaletteFilter();
        Render.renderProfileFilter();

        document.querySelectorAll('#palette-filter-list input[type="checkbox"]').forEach(checkbox => {
          checkbox.checked = appState.selectedPalettes.includes(checkbox.value);
        });
        document.querySelectorAll('#profile-filter-list input[type="checkbox"]').forEach(checkbox => {
          checkbox.checked = appState.selectedProfiles.includes(checkbox.value);
        });

        // Height mode is reflected on the root for the 3-dots toggle icon (renderHeightFilter
        // also sets this; set here too so it's correct before the first pill render).
        document.documentElement.setAttribute('data-height-mode', appState.heightMode === 'range' ? 'range' : 'multi');

        document.querySelectorAll('#form-options-panel input[name="form-mode"]').forEach(radio => {
          radio.checked = (radio.value === appState.formMode);
        });

        const metadataEl = document.getElementById('toggle-metadata');
        if (metadataEl) metadataEl.checked = appState.showMetadata;

        const exportEl = document.getElementById('toggle-export');
        if (exportEl) exportEl.checked = appState.showExport;

        Render.renderHeightFilter();
        this.syncCanvasScale();
        Render.renderDisplayOptions();
        Render.renderSidebarState();
        document.documentElement.setAttribute('data-layout', appState.displayLayout);
      },

      buildGenerationParams() {
        return {
          allowedPalettes: appState.selectedPalettes || [],
          allowedProfiles: appState.selectedProfiles || [],
          allowedHeights: Array.from(appState.selectedHeights),
          seed: appState.seed,
          blockLimit: appState.targetBlocks
        };
      },

      parseURL() {
        const params = new URLSearchParams(window.location.search);

        appState.seed = normalizeSeed(params.get('seed'));
        appState.selectedPalettes = parseCommaList(params.get('palettes')).filter(name => VALID_PALETTE_NAMES.has(name));
        appState.selectedProfiles = parseCommaList(params.get('profiles')).filter(profile => VALID_PROFILE_IDS.has(profile));

        const formParam = params.get('form');
        appState.formMode = (formParam === 'bound' || formParam === 'unbound') ? formParam : 'native';
        appState.showMetadata = params.has('meta') ? params.get('meta') !== 'false' : true;
        appState.showExport = params.has('export') ? params.get('export') !== 'false' : true;
        appState.displayLayout = params.get('layout') === 'poster' ? 'poster' : 'art';

        // Strict Canvas dimension URL check: ?canvas=portrait
        appState.aspectRatio = params.get('canvas') === 'portrait' ? 'portrait' : 'square';

        if (params.has('limit')) {
          appState.targetBlocks = clampToAllowedLimit(parseInt(params.get('limit'), 10));
          appState.isLimitVisible = true;
        } else {
          appState.targetBlocks = DEFAULT_LIMIT;
          appState.isLimitVisible = false;
        }

        const renderParam = params.get('render');
        if (renderParam === 'single' || renderParam === 'grid') {
          appState.renderMode = renderParam;
          appState.isRenderModeVisible = true;
        } else {
          appState.renderMode = 'single';
          appState.isRenderModeVisible = false;
        }

        this.refreshValidHeights();

        const parsedHeights = parseHeightsParam(params.get('heights'));
        appState.heightMode = parsedHeights.heightMode;
        appState.selectedHeights = parsedHeights.selectedHeights;
        appState.rangeStart = parsedHeights.rangeStart;
        appState.rangeEnd = parsedHeights.rangeEnd;

        if (appState.heightMode === 'range' && appState.rangeStart !== null) {
          const min = appState.rangeEnd === null ? appState.rangeStart : Math.min(appState.rangeStart, appState.rangeEnd);
          const max = appState.rangeEnd === null ? appState.rangeStart : Math.max(appState.rangeStart, appState.rangeEnd);
          appState.selectedHeights = new Set(POSSIBLE_HEIGHTS.filter(height => height >= min && height <= max));
        }

        this.sanitizeHeights();
      },

      syncURL() {
        const url = new URL(window.location);
        const searchParams = url.searchParams;

        searchParams.delete('seed');
        searchParams.delete('palettes');
        searchParams.delete('profiles');
        searchParams.delete('heights');
        searchParams.delete('limit');
        searchParams.delete('form');
        searchParams.delete('meta');
        searchParams.delete('export');
        searchParams.delete('layout');
        searchParams.delete('canvas');
        searchParams.delete('render');

        if (appState.selectedPalettes.length) searchParams.set('palettes', appState.selectedPalettes.join(','));
        if (appState.selectedProfiles.length) searchParams.set('profiles', appState.selectedProfiles.join(','));

        if (appState.selectedHeights.size > 0) {
          if (appState.heightMode === 'range' && appState.rangeStart !== null && appState.rangeEnd !== null) {
            const min = Math.min(appState.rangeStart, appState.rangeEnd);
            const max = Math.max(appState.rangeStart, appState.rangeEnd);
            searchParams.set('heights', `${min}-${max}`);
          } else {
            searchParams.set('heights', Array.from(appState.selectedHeights).sort((a, b) => a - b).join(','));
          }
        }

        if (appState.isLimitVisible) searchParams.set('limit', appState.targetBlocks);
        if (appState.formMode !== 'native') searchParams.set('form', appState.formMode);
        if (!appState.showMetadata) searchParams.set('meta', 'false');
        if (!appState.showExport) searchParams.set('export', 'false');
        if (appState.displayLayout !== 'art') searchParams.set('layout', appState.displayLayout);
        if (appState.aspectRatio !== 'square') searchParams.set('canvas', appState.aspectRatio);
        if (appState.isRenderModeVisible) searchParams.set('render', appState.renderMode);
        if (appState.seed) searchParams.set('seed', appState.seed);

        const searchString = searchParams.toString().replace(/%2C/g, ',');
        appState.shareUrl = url.origin + url.pathname + (searchString ? `?${searchString}` : '');

        try {
          window.history.replaceState(null, '', appState.shareUrl);
        } catch (error) {
          console.warn('Could not update URL history state in this environment.', error);
        }
      },

      triggerGeneration() {
        this.syncFromDOM();
        let didMutateHeightState = this.sanitizeHeights();
        let wasSeedForced = !!appState.seed;

        let params = this.buildGenerationParams();
        let newArtwork = generateStack(params);

        if (!newArtwork && appState.seed) {
          this.clearSeed();
          wasSeedForced = false;
          params = this.buildGenerationParams();
          newArtwork = generateStack(params);
        }

        if (!newArtwork && appState.selectedHeights.size > 0) {
          appState.selectedHeights.clear();
          appState.rangeStart = null;
          appState.rangeEnd = null;
          didMutateHeightState = this.sanitizeHeights() || didMutateHeightState;
          params = this.buildGenerationParams();
          newArtwork = generateStack(params);
        }

        if (newArtwork) {
          appState.artwork = newArtwork;
          this.resolveForm(newArtwork.palette);
          appState.seed = newArtwork.seed;
          if (didMutateHeightState) Render.renderHeightFilter();
          Render.render();
          this.syncURL();
          return;
        }

        if (didMutateHeightState) Render.renderHeightFilter();
        this.syncURL();
      }
    };


    // ==========================================================================
    // 7. SYNC
    // ==========================================================================
    function normalizeSeed(value) {
      if (typeof value !== 'string') return null;
      const normalized = value.trim().toUpperCase();
      return /^[A-Z0-9]{6}$/.test(normalized) ? normalized : null;
    }

    function parseCommaList(value) {
      if (typeof value !== 'string') return [];
      return value.split(',').map(item => item.trim()).filter(Boolean);
    }

    function parseHeightsParam(value) {
      if (typeof value !== 'string' || value.trim() === '') {
        return { heightMode: 'multi', selectedHeights: new Set(), rangeStart: null, rangeEnd: null };
      }

      if (value.includes('-')) {
        const [startRaw, endRaw] = value.split('-', 2);
        const start = Number.parseInt(startRaw, 10);
        const end = Number.parseInt(endRaw, 10);
        if (!Number.isFinite(start) || !Number.isFinite(end)) {
          return { heightMode: 'multi', selectedHeights: new Set(), rangeStart: null, rangeEnd: null };
        }
        return { heightMode: 'range', selectedHeights: new Set(), rangeStart: start, rangeEnd: end };
      }

      const parsedHeights = parseCommaList(value)
        .map(item => Number.parseInt(item, 10))
        .filter(height => Number.isFinite(height));
      return {
        heightMode: 'multi',
        selectedHeights: new Set(parsedHeights),
        rangeStart: null,
        rangeEnd: null
      };
    }

    function sanitizeHeightState() {
      const validHeightSet = new Set(POSSIBLE_HEIGHTS);
      const sanitizedHeights = [...appState.selectedHeights].filter(height => validHeightSet.has(height));
      let wasChanged = sanitizedHeights.length !== appState.selectedHeights.size;

      if (appState.heightMode === 'range') {
        const selectedRangeHeights = sanitizedHeights.slice().sort((a, b) => a - b);

        if (selectedRangeHeights.length > 0) {
          const nextStart = selectedRangeHeights[0];
          const nextEnd = selectedRangeHeights[selectedRangeHeights.length - 1];
          if (appState.rangeStart !== nextStart || appState.rangeEnd !== nextEnd) wasChanged = true;
          appState.rangeStart = nextStart;
          appState.rangeEnd = nextEnd === nextStart ? null : nextEnd;
          appState.selectedHeights = new Set(selectedRangeHeights);
        } else if (appState.rangeStart !== null || appState.rangeEnd !== null || appState.selectedHeights.size > 0) {
          appState.rangeStart = null;
          appState.rangeEnd = null;
          appState.selectedHeights = new Set();
          wasChanged = true;
        } else {
          appState.selectedHeights = new Set();
        }
      } else {
        if (appState.rangeStart !== null || appState.rangeEnd !== null) wasChanged = true;
        appState.rangeStart = null;
        appState.rangeEnd = null;
        appState.selectedHeights = new Set(sanitizedHeights.sort((a, b) => a - b));
      }

      return wasChanged;
    }


    // ==========================================================================
    // 8. RENDER
    // ==========================================================================
    function formatUnitLabel(units) {
      return units > 0 ? '•'.repeat(units) : '';
    }

    const Render = {
      renderDisplayOptions() {
        const renderModeRow = document.getElementById('render-mode-row');
        if (renderModeRow) renderModeRow.style.display = appState.isRenderModeVisible ? '' : 'none';

        const renderModeValue = document.getElementById('render-mode-value');
        const renderModeIcon = document.getElementById('render-mode-icon');
        const isGrid = appState.renderMode === 'grid';
        if (renderModeValue) {
          renderModeValue.textContent = isGrid ? 'Grid' : 'Single';
          if (renderModeIcon) {
            renderModeIcon.querySelector('use').setAttribute('href', isGrid ? '#icon-custom-render-grid' : '#icon-custom-render-single');
          }
        }

        const layoutRow = document.getElementById('layout-row');
        const aspectRatioRow = document.getElementById('aspect-ratio-row');
        if (layoutRow) layoutRow.style.display = isGrid ? 'none' : '';
        if (aspectRatioRow) aspectRatioRow.style.display = isGrid ? 'none' : '';

        const layoutValue = document.getElementById('layout-value');
        const layoutIcon = document.getElementById('layout-icon');
        if (layoutValue) {
          layoutValue.textContent = appState.displayLayout === 'art' ? 'Art' : 'Poster';
          if (layoutIcon) {
            layoutIcon.querySelector('use').setAttribute('href', appState.displayLayout === 'art' ? '#icon-custom-art-layout' : '#icon-custom-poster-layout');
          }
        }

        const aspectRatioValue = document.getElementById('aspect-ratio-value');
        const aspectIcon = document.getElementById('aspect-ratio-icon');
        const canvasWrap = document.getElementById('canvas');
        if (aspectRatioValue) {
          aspectRatioValue.textContent = RATIO_LABELS[appState.aspectRatio] || 'Square (1:1)';
          if (aspectIcon) {
            aspectIcon.querySelector('use').setAttribute('href', appState.aspectRatio === 'square' ? '#icon-custom-1-1-ratio' : '#icon-custom-9-16-ratio');
          }
          if (canvasWrap) {
            canvasWrap.setAttribute('data-aspect-ratio', appState.aspectRatio);
          }
          document.documentElement.setAttribute('data-aspect-ratio', appState.aspectRatio);
        }
      },

      updateSeedDisplay() {
        const seedDisplayEl = document.getElementById('seed-display');

      drawArtworkInto(svg, artwork, aspectRatio, showOutline) {
        const { placements, heightUnits, palette } = artwork;
        svg.innerHTML = '';

        const canvasW = aspectRatio === 'portrait' ? 562.5 : CANVAS_SIZE;
        const canvasH = CANVAS_SIZE;

        const stackHeightPx = (heightUnits * CELL_STEP) + BORDER_WIDTH;
        const offsetX = Math.round((canvasW - COLUMN_WIDTH) / 2);
        const offsetY = Math.round((canvasH - stackHeightPx) / 2);

        svg.setAttribute('viewBox', `0 0 ${canvasW} ${canvasH}`);
        svg.setAttribute('width', canvasW);
        svg.setAttribute('height', canvasH);

        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('width', canvasW);
        bg.setAttribute('height', canvasH);
        bg.setAttribute('fill', palette.bg);
        svg.appendChild(bg);

        placements.forEach(placement => {
          const shape = SHAPE_CATALOG[placement.id];
          const occupied = new Set(shape.cells.map(cell => `${cell.x},${cell.y}`));

          shape.cells.forEach(cell => {
            const cellX = offsetX + ((placement.x + cell.x) * CELL_STEP);
            const gridY = placement.y + cell.y;
            const cellY = offsetY + ((heightUnits - 1 - gridY) * CELL_STEP);
            const insetLeft = occupied.has(`${cell.x - 1},${cell.y}`) ? 0 : BORDER_WIDTH;
            const insetRight = occupied.has(`${cell.x + 1},${cell.y}`) ? 0 : BORDER_WIDTH;
            const insetTop = occupied.has(`${cell.x},${cell.y + 1}`) ? 0 : BORDER_WIDTH;
            const insetBottom = occupied.has(`${cell.x},${cell.y - 1}`) ? 0 : BORDER_WIDTH;
            const effectiveGapColor = showOutline ? INK_COLOR : palette.bg;

            addRect(svg, cellX, cellY, CELL_SIZE, CELL_SIZE, effectiveGapColor);
            addRect(
              svg,
              cellX + insetLeft,
              cellY + insetTop,
              CELL_SIZE - insetLeft - insetRight,
              CELL_SIZE - insetTop - insetBottom,
              placement.color
            );
          });
        });
      },

          setText('poster-shapes', placements.length); setText('poster-shapes-portrait', placements.length);

          const colorUsage = {};
          palette.colors.forEach(c => colorUsage[c] = 0);
          placements.forEach(p => {
            const units = SHAPE_CATALOG[p.id].units;
            colorUsage[p.color] += units;
          });
          const maxUnits = Math.max(...Object.values(colorUsage), 0);

          const buildColorBars = (container) => {
            if (!container) return;
            container.innerHTML = '';

              const units = colorUsage[color];
              const bar = document.createElement('div');
              bar.className = 'poster-color-bar';
              bar.style.setProperty('--bar-color', color);
              const minHeightRatio = 1 / palette.colors.length;
              const usageRatio = maxUnits > 0 ? (units / maxUnits) : 0;
              const finalRatio = Math.max(usageRatio, minHeightRatio);
              if (units === 0 || maxUnits === 0) bar.dataset.unused = 'true';
              bar.style.height = `${finalRatio * 100}%`;
              container.appendChild(bar);
            });
          };
          buildColorBars(document.getElementById('poster-color-bars'));
          buildColorBars(document.getElementById('poster-color-bars-portrait'));

          const shapeCounts = placements.reduce((acc, p) => {
            const units = SHAPE_CATALOG[p.id].units;
            acc[units] = (acc[units] || 0) + 1;
            return acc;
          }, {});
          const unitsKeys = Object.keys(shapeCounts).map(Number).sort((a, b) => a - b);

          const buildUnits = (container, cellClass) => {

            unitsKeys.forEach(units => {

        shapesList.innerHTML = '';

          const units = SHAPE_CATALOG[placement.id].units;
          acc[units] = (acc[units] || 0) + 1;
          return acc;
        }, {});

        Object.keys(counts).map(Number).sort((a, b) => a - b).forEach(units => {
          const row = document.createElement('div');
          row.className = 'control-row u-hide-icon';
          row.setAttribute('role', 'listitem');
          row.innerHTML = `<span class="control-label">${formatUnitLabel(units)}</span><span class="control-value">${counts[units]}</span>`;
          shapesList.appendChild(row);

      renderLimitSlider() {
        const container = document.getElementById('limit-slider-container');
        if (!container) return;
        container.innerHTML = '';

        const slider = document.createElement('div');
        slider.className = 'limit-slider';

        const track = document.createElement('div');
        track.className = 'limit-slider-track';

        const thumb = document.createElement('div');
        thumb.className = 'limit-slider-thumb';
        thumb.innerHTML = `<span>${appState.targetBlocks}</span>`;

        slider.appendChild(track);
        slider.appendChild(thumb);
        container.appendChild(slider);

        const sortedLimits = getSortedLimits();
        function updateThumbPos(val) {
          const normalizedVal = clampToAllowedLimit(val);
          const valueIndex = sortedLimits.indexOf(normalizedVal);
          const percent = sortedLimits.length > 1 ? valueIndex / (sortedLimits.length - 1) : 0;
          const sliderWidth = slider.offsetWidth;
          const thumbWidth = thumb.offsetWidth;
          const maxScroll = Math.max(0, sliderWidth - thumbWidth);
          thumb.style.transform = `translateX(${percent * maxScroll}px)`;
          thumb.querySelector('span').textContent = normalizedVal;
        }

        requestAnimationFrame(() => updateThumbPos(appState.targetBlocks));

        let isDragging = false;

        function valFromX(clientX) {
          const rect = slider.getBoundingClientRect();
          const thumbWidth = thumb.offsetWidth;
          const maxScroll = Math.max(0, rect.width - thumbWidth);
          if (maxScroll === 0) return appState.targetBlocks;
          const relativeX = Math.max(0, Math.min(maxScroll, clientX - rect.left - (thumbWidth / 2)));
          const percent = relativeX / maxScroll;
          const index = Math.round(percent * (sortedLimits.length - 1));
          return sortedLimits[Math.max(0, Math.min(sortedLimits.length - 1, index))];
        }

        function onPointerDown(e) {
          const isThumb = e.target.closest('.slider-thumb');
          if (isThumb) {
            isDragging = true;
            thumb.setAttribute('data-dragging', 'true');
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
          } else {
            const rect = thumb.getBoundingClientRect();
            const clickX = e.clientX;
            const currentIndex = sortedLimits.indexOf(clampToAllowedLimit(appState.targetBlocks));
            let newVal = appState.targetBlocks;
            if (clickX < rect.left) {
              newVal = sortedLimits[Math.max(0, currentIndex - 1)];
            } else if (clickX > rect.right) {
              newVal = sortedLimits[Math.min(sortedLimits.length - 1, currentIndex + 1)];
            }
            if (newVal !== appState.targetBlocks) {
              updateLimit(newVal);
            }
          }
        }

        function onPointerMove(e) {
          if (!isDragging) return;
          const newVal = valFromX(e.clientX);
          if (newVal !== appState.targetBlocks) {
            updateLimit(newVal);
          }
        }

        function onPointerUp() {
          isDragging = false;
          thumb.removeAttribute('data-dragging');
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
        }

        function updateLimit(val) {
          State.setTargetBlocks(val);
          updateThumbPos(appState.targetBlocks);
          Render.renderHeightFilter();
          State.triggerGeneration();
        }

        slider.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('resize', () => updateThumbPos(appState.targetBlocks));
      },

      renderHeightFilter() {
        const hList = document.getElementById('height-filter-container');
        if (!hList) return;
        hList.innerHTML = '';

        // Reflect mode on the root so the 3-dots toggle CSS can switch icon states.
        document.documentElement.setAttribute('data-height-mode', appState.heightMode === 'range' ? 'range' : 'multi');

        const sorted = POSSIBLE_HEIGHTS.slice().sort((a, b) => a - b);
        // Pills wrap 4 per row; a merged range capsule must not visually bleed across a row
        // wrap, so mark the pills at row edges to cap their capsule extension.
        const PER_ROW = 4;

        const rangeMin = appState.rangeEnd !== null ? Math.min(appState.rangeStart, appState.rangeEnd) : appState.rangeStart;
        const rangeMax = appState.rangeEnd !== null ? Math.max(appState.rangeStart, appState.rangeEnd) : appState.rangeStart;

        sorted.forEach((h, index) => {
          const cell = document.createElement('button');
          cell.className = 'toggle-cell';
          cell.type = 'button';

          if (appState.heightMode === 'multi') {
            if (appState.selectedHeights.has(h)) cell.setAttribute('data-state', 'selected');
          } else if (appState.selectedHeights.has(h)) {
            cell.setAttribute('data-state', 'in-range');
            if (h === rangeMin) cell.setAttribute('data-range-edge', 'start');
            if (h === rangeMax) cell.setAttribute('data-range-edge', 'end');
            // A single-pill range is both start and end → round both caps (full pill).
            if (h === rangeMin && h === rangeMax) cell.setAttribute('data-range-edge', 'both');
            // Cap the capsule at row wraps so a wrapped range shows normal rounded pills
            // per row rather than flat edges dangling at the wrap.
            if (index % PER_ROW === 0) cell.setAttribute('data-row-edge', 'left');
            if (index % PER_ROW === PER_ROW - 1) cell.setAttribute('data-row-edge', 'right');
          }

          cell.innerHTML = `<span>${h}</span>`;

          cell.addEventListener('click', () => {
            State.toggleHeightSelection(h);
            State.clearSeed();
            Render.renderHeightFilter();
            State.triggerGeneration();
          });

          hList.appendChild(cell);
        });
      }
    };

        });

        document.getElementById('seed-row')?.addEventListener('click', () => this.regenerateFromFilters());
        document.getElementById('seed-row')?.addEventListener('keydown', event => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          this.regenerateFromFilters();

      bindGlobalControls() {
        document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
          State.toggleSidebar();
          Render.renderSidebarState();
        });
        document.getElementById('export-png-btn')?.addEventListener('click', () => ExportActions.downloadPNG(2));
        document.getElementById('export-hires-btn')?.addEventListener('click', () => ExportActions.downloadPNG(6));
        document.getElementById('export-svg-btn')?.addEventListener('click', () => ExportActions.downloadSVG());

        document.getElementById('seed-display')?.addEventListener('click', event => {
          event.stopPropagation();
          if (appState.renderMode === 'grid') return;
          if (!appState.seed) return;
          const url = appState.shareUrl || window.location.href;
          const display = document.getElementById('seed-display');
          const original = display.textContent;

          const showCopied = () => {
            display.innerHTML = '<span style="color: var(--ui-ink-muted);">COPIED</span>';
            setTimeout(() => {
              display.textContent = appState.seed === original ? original : appState.seed;
            }, 1500);
          };

          const fallbackCopy = () => {
            const tempInput = document.createElement('input');
            tempInput.value = url;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showCopied();
          };

          if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(url).then(showCopied).catch(fallbackCopy);
            return;
          }

          fallbackCopy();
        });

        document.getElementById('seed-display')?.addEventListener('keydown', event => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          event.stopPropagation();
          document.getElementById('seed-display')?.click();
        });
      },

      bindShortcuts() {
        document.addEventListener('keydown', event => {
          if (event.target.tagName === 'INPUT' || event.metaKey || event.ctrlKey) return;
          const key = event.key.toLowerCase();

          // These are global shortcuts, not keyboard navigation of a control. Blur whatever
          // was last focused (e.g. a section header just clicked) so the keypress doesn't
          // trigger a :focus-visible ring on panel elements after regenerating.
          if (['r', 'i', 'p', 's'].includes(key) && document.activeElement) {
            document.activeElement.blur();
          }

          if (key === 'r') this.regenerateFromFilters();

          if (key === 'i') {
            State.toggleSidebar();
            Render.renderSidebarState();
          }

          if (key === 'p') ExportActions.downloadPNG();
          if (key === 's') ExportActions.downloadSVG();
        });
      }
    };

    // --- EXPORT MODULE ---
    const ExportActions = {
      getSVGString() {
        const svg = document.getElementById('artwork-svg');
        const clone = svg.cloneNode(true);
        const canvasW = appState.aspectRatio === 'portrait' ? 562.5 : CANVAS_SIZE;
        const canvasH = CANVAS_SIZE;
        clone.setAttribute('width', canvasW);
        clone.setAttribute('height', canvasH);
        clone.setAttribute('viewBox', `0 0 ${canvasW} ${canvasH}`);
        if (!clone.getAttribute('xmlns')) clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        return new XMLSerializer().serializeToString(clone);
      },

      triggerDownload(dataUrl, fileName) {
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = fileName;
        link.click();
        if (dataUrl.startsWith('blob:')) {
          setTimeout(() => URL.revokeObjectURL(dataUrl), 100);
        }
      },

      async _loadSVGImage() {
        const url = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(this.getSVGString())}`;
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = url;
        });
      },

      downloadSVG() {
        if (appState.displayLayout === 'poster') return;
        const blob = new Blob([this.getSVGString()], { type: 'image/svg+xml;charset=utf-8' });
        this.triggerDownload(URL.createObjectURL(blob), `4x4rt-stacks-${appState.seed || 'export'}.svg`);
      },

      async downloadPNG(pixelRatio = 2) {
        if (appState.displayLayout === 'poster') {
          try {
            const node = document.getElementById('poster-mat');
            const canvasW = appState.aspectRatio === 'portrait' ? 562.5 : CANVAS_SIZE;
            const targetWidth = Math.round(canvasW * pixelRatio);
            const rect = node.getBoundingClientRect();
            const targetHeight = Math.round((rect.height / rect.width) * targetWidth);

            const dataUrl = await htmlToImage.toPng(node, {
              width: rect.width,
              height: rect.height,
              canvasWidth: targetWidth,
              canvasHeight: targetHeight,
              pixelRatio: 1,
              backgroundColor: appState.artwork.palette.bg,
              style: {
                transform: 'scale(1)',
                transformOrigin: 'top left'
              }
            });
            this.triggerDownload(dataUrl, `4x4rt-stacks-poster-${appState.seed || 'export'}.png`);
          } catch (error) {
            console.error('Poster PNG download failed', error);
          }
          return;
        }

        const scale = pixelRatio;
        const canvasW = appState.aspectRatio === 'portrait' ? 562.5 : CANVAS_SIZE;
        const canvasH = CANVAS_SIZE;
        try {
          const img = await this._loadSVGImage();

          const canvas = document.createElement('canvas');
          canvas.width = canvasW * scale;
          canvas.height = canvasH * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          this.triggerDownload(canvas.toDataURL('image/png'), `4x4rt-stacks-${appState.seed || 'export'}.png`);
        } catch (error) {
          console.error('PNG download failed', error);
        }
      }
    };


    // ==========================================================================
    // 10. INIT
    // ==========================================================================
    (function initUIColors() {
      const p = PALETTES.find(p => p.name === 'spice') || PALETTES[0];
      const root = document.documentElement;
      root.style.setProperty('--ui-bg', p.bg);
      root.style.setProperty('--ui-ink', 'rgba(28, 28, 26, 0.9)');
      root.style.setProperty('--ui-ink-solid', 'rgb(28, 28, 26)');
      root.style.setProperty('--ui-ink-muted', 'rgba(28, 28, 26, 0.5)');
      root.style.setProperty('--ui-ink-20', 'rgba(28, 28, 26, 0.2)');
      root.style.setProperty('--ui-rule', 'rgba(28, 28, 26, 0.1)');
    })();

    Controls.bindGlobalControls();
    State.parseURL();
    Controls.bindParamsPanel();
    Controls.bindShortcuts();
    State.applyToDOM();
    document.documentElement.setAttribute('data-layout', appState.displayLayout);
    State.syncCanvasScale();
    window.addEventListener('resize', () => {
      State.syncCanvasScale();
      Render.renderDisplayOptions();
      Render.renderSidebarState();
    });
    State.triggerGeneration();
    if (appState.renderMode === 'grid') Render.renderContactSheet();

  </script>
</body>
